// ------------------------------------------------------------
// 11. RICERCA (adattatore B): YouTube Data API v3 + cache + ordinamento
// ------------------------------------------------------------
function parseISODuration(iso) {
  const m = (iso || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  const h = parseInt(m[1] || '0', 10);
  const mnt = parseInt(m[2] || '0', 10);
  const s = parseInt(m[3] || '0', 10);
  return h * 3600 + mnt * 60 + s;
}

/** Cache delle ricerche YouTube: chiave -> { risultati, scadenza }.
 *  10/11/2026: salvata nel browser per 30 giorni (prima 10 minuti, solo in memoria):
 *  una canzone già cercata riparte subito e NON consuma la quota di YouTube. */
const CACHE_RICERCA_TTL_MS = 30 * 24 * 3600 * 1000; // 30 giorni
const CACHE_RICERCA_MAX = 150;
const CHIAVE_CACHE_RICERCA = 'asia_cache_ricerche';
function caricaCacheRicerca() {
  try {
    const o = JSON.parse(localStorage.getItem(CHIAVE_CACHE_RICERCA) || 'null');
    return o ? Object.entries(o).filter(([, v]) => v && Date.now() < v.scadenza) : [];
  } catch (e) { return []; }
}
function salvaCacheRicerca() {
  try {
    while (cacheRicercheYouTube.size > CACHE_RICERCA_MAX) {
      cacheRicercheYouTube.delete(cacheRicercheYouTube.keys().next().value);
    }
    localStorage.setItem(CHIAVE_CACHE_RICERCA, JSON.stringify(Object.fromEntries(cacheRicercheYouTube)));
  } catch (e) { /* spazio pieno: pazienza */ }
}
const cacheRicercheYouTube = new Map(caricaCacheRicerca());

function chiaveCacheRicerca(query, modo) {
  return modo + '|' + normalizza(query);
}

function leggiCacheRicerca(query, modo) {
  const voce = cacheRicercheYouTube.get(chiaveCacheRicerca(query, modo));
  if (!voce) return null;
  if (Date.now() > voce.scadenza) {
    cacheRicercheYouTube.delete(chiaveCacheRicerca(query, modo));
    return null;
  }
  return voce.risultati;
}

function scriviCacheRicerca(query, modo, risultati) {
  cacheRicercheYouTube.delete(chiaveCacheRicerca(query, modo));
  cacheRicercheYouTube.set(chiaveCacheRicerca(query, modo), {
    risultati,
    scadenza: Date.now() + CACHE_RICERCA_TTL_MS
  });
  salvaCacheRicerca();
}

/** Cerca su YouTube. NON parla più: restituisce { risultati, errore }
 *  con errore = 'chiave_mancante' | 'rete' | null. Decide l'Esecutore cosa dire. */
async function cercaYouTube(query, modo) {
  if (!settings.youtubeApiKey) {
    log('⚠️ Chiave YouTube mancante nelle Impostazioni');
    return { risultati: [], errore: 'chiave_mancante' };
  }

  const dallaCache = leggiCacheRicerca(query, modo);
  if (dallaCache) {
    log('📦 Ricerca "' + query + '" presa dalla cache (' + dallaCache.length + ' risultati)');
    return { risultati: dallaCache, errore: null };
  }

  const maxResults = modo === 'riproduci' ? 10 : Math.min(50, settings.listaPagina * 3);

  try {
    const searchUrl = 'https://www.googleapis.com/youtube/v3/search'
      + '?part=snippet&type=video&maxResults=' + maxResults
      + '&regionCode=IT&relevanceLanguage=it&videoCategoryId=10'
      + '&q=' + encodeURIComponent(query)
      + '&key=' + encodeURIComponent(settings.youtubeApiKey);

    // 10/11/2026: se YouTube dice "troppe richieste" (429) aspetta 1,5 s e riprova una volta.
    let searchResp = await fetch(searchUrl);
    Consumi.youtube(100);
    if (searchResp.status === 429) {
      log('⏳ YouTube chiede di rallentare: riprovo tra 1,5 s');
      await new Promise(r => setTimeout(r, 1500));
      searchResp = await fetch(searchUrl);
      Consumi.youtube(100);
    }
    if (!searchResp.ok) {
      let motivo = '';
      try { const j = await searchResp.json(); motivo = (j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || ''; } catch (e) {}
      const err = new Error('ricerca HTTP ' + searchResp.status + (motivo ? ' (' + motivo + ')' : ''));
      if (searchResp.status === 403 && /quota/i.test(motivo)) Consumi.youtubeFinito();
      err.tipo = (searchResp.status === 403 && /quota/i.test(motivo)) ? 'quota' :
                 (searchResp.status === 429 || /rateLimit/i.test(motivo)) ? 'limite' : 'rete';
      throw err;
    }
    const searchData = await searchResp.json();
    const items = (searchData.items || []).filter(it => it.id && it.id.videoId);
    if (!items.length) return { risultati: [], errore: null };

    const ids = items.map(it => it.id.videoId).join(',');
    const detailsUrl = 'https://www.googleapis.com/youtube/v3/videos'
      + '?part=contentDetails,snippet,status&id=' + ids
      + '&key=' + encodeURIComponent(settings.youtubeApiKey);

    const detailsResp = await fetch(detailsUrl);
    Consumi.youtube(1);
    if (!detailsResp.ok) throw new Error('dettagli HTTP ' + detailsResp.status);
    const detailsData = await detailsResp.json();

    // 10/11/2026: via i video che YouTube non permette di suonare fuori da YouTube
    const ammessi = (detailsData.items || []).filter(it => {
      const ok = !(it.status && it.status.embeddable === false) && !VideoBloccati.ha(it.id);
      if (!ok) log('🚫 Scartato (YouTube non lo fa suonare fuori dal sito): ' + rimuoviEmoji(it.snippet.title));
      return ok;
    });
    const risultati = ammessi.map(it => {
      const titoloGrezzo = it.snippet.title;
      const titoloPulito = rimuoviEmoji(titoloGrezzo);
      const canalePulito = rimuoviEmoji(it.snippet.channelTitle);
      return {
        id: it.id,
        titolo: titoloPulito,
        autore: estraiArtista(titoloPulito, canalePulito),
        canaleUfficiale: canaleUfficiale(canalePulito),
        contenutoSocial: titoloPulito !== titoloGrezzo,
        anno: it.snippet.publishedAt ? parseInt(it.snippet.publishedAt.slice(0, 4), 10) : null,
        durataSec: parseISODuration(it.contentDetails.duration)
      };
    });

    if (risultati.length) scriviCacheRicerca(query, modo, risultati);
    return { risultati, errore: null };
  } catch (err) {
    log('❌ Errore ricerca YouTube: ' + err.message);
    return { risultati: [], errore: err.tipo || 'rete' };
  }
}

const Ricerca = {
  /** Cerca su YouTube (con cache). @returns {Promise<{risultati:object[], errore:?string}>} */
  cerca(query, modo) {
    // 10/11/2026: anche dalla memoria delle ricerche, mai i video già rifiutati da YouTube
    return cercaYouTube(query, modo || 'riproduci').then(r =>
      Object.assign({}, r, { risultati: (r.risultati || []).filter(x => !VideoBloccati.ha(x.id)) }));
  },

  /** Stesso punteggio del vecchio scegliMigliore, ma restituisce TUTTA la lista ordinata
   *  (durata 90-480 s preferita, versioni alterate scartate, canali ufficiali premiati). */
  ordinaPerPertinenza(risultati, query) {
    if (!risultati || !risultati.length) return [];
    const parole = normalizza(query).split(' ').filter(w => w.length > 2);
    let cand = risultati.filter(r => r.durataSec >= 90 && r.durataSec <= 480);
    if (!cand.length) cand = risultati.slice();
    cand = filtraVersioniOriginali(cand);
    const scored = cand.map(r => {
      const t = normalizza((r.autore||'') + ' ' + (r.titolo||''));
      let s = 0; parole.forEach(p => { if (t.includes(p)) s++; });
      if (r.canaleUfficiale) s += 3;
      if (t.includes('ufficiale') || t.includes('official')) s += 1;
      QUALIFICATORI_SECONDARI.forEach(q => { if (t.includes(normalizza(q))) s -= 2; });
      return { r, s };
    });
    scored.sort((a,b) => (b.s - a.s) || (Math.abs(a.r.durataSec-210) - Math.abs(b.r.durataSec-210)));
    return scored.map(x => x.r);
  },

  /** Coda di titoli DIVERSI: toglie gli esclusi, ordina per pertinenza, deduplica per
   *  titolo (tenendo il migliore di ogni titolo) e prende i primi `max`.
   *  @param {{escludi?:Set<string>, escludiTitoli?:Set<string>, max?:number}} opzioni */
  costruisciCoda(risultati, query, opzioni) {
    const o = opzioni || {};
    const escludi = o.escludi || new Set();
    const escludiTitoli = o.escludiTitoli || new Set();
    const max = o.max || 5;
    const ammessi = (risultati || []).filter(r => r && r.id && !escludi.has(r.id));
    const ordinati = this.ordinaPerPertinenza(ammessi, query);
    const visti = new Set();
    const coda = [];
    for (const r of ordinati) {
      const k = this.chiaveTitolo(r);
      if (!k || visti.has(k) || escludiTitoli.has(k)) continue;
      visti.add(k);
      coda.push(r);
      if (coda.length >= max) break;
    }
    return coda;
  },

  /** Chiave di confronto del titolo (senza "Artista - " davanti, senza parentesi). */
  chiaveTitolo(brano) {
    return normalizza(Annunci.titoloBreve(brano));
  },

  /** Riusata: "solo artista" (coda di titoli diversi) o "brano preciso". */
  sembraSoloNomeArtista(risultati) {
    return sembraSoloNomeArtista(risultati);
  }
};

// ------------------------------------------------------------
// 12. PLAYER (adattatore A): YouTube IFrame Player API
// ------------------------------------------------------------
let ytPlayer = null;
let ytPlayerReady = false;
let ytApiCaricata = false;
let pendingVideoId = null;

function caricaYouTubeIframeAPI() {
  if (ytApiCaricata) return;
  ytApiCaricata = true;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('ytPlayerDiv', {
    // 10/11/2026: lettore nascosto GRANDE (prima 200x150): a misura minuscola
    // YouTube sceglie la qualità più bassa. Resta comunque fuori dallo schermo.
    height: '720',
    width: '1280',
    playerVars: { playsinline: 1, autoplay: 1, rel: 0, vq: 'hd720' },
    events: {
      onReady: () => {
        ytPlayerReady = true;
        log('✅ Player YouTube pronto');
        Player._applicaVolume();
        if (pendingVideoId) { ytPlayer.loadVideoById(pendingVideoId); pendingVideoId = null; }
      },
      onStateChange: onYTStateChange,
      onError: onYTError
    }
  });
};

const STATI_YT = { '-1': 'non avviato', '0': 'terminato', '1': 'in riproduzione', '2': 'in pausa', '3': 'in buffering', '5': 'in coda' };
const YT_FINITO = 0, YT_SUONA = 1, YT_PAUSA = 2;

/** 10/11/2026: RISPARMIO DATI automatico. Con la SIM (rete cellulare) e senza
 *  internet illimitato: lettore piccolo e qualità minima (~100 MB/ora invece di ~1 GB).
 *  Col Wi-Fi (o sul PC, dove il tipo di rete non si conosce): qualità alta. */
function risparmiaDati() {
  if (settings.internetIllimitato) return false;
  const c = (typeof navigator !== 'undefined') && (navigator.connection || navigator.mozConnection || navigator.webkitConnection);
  if (!c) return false;
  if (c.saveData) return true;                       // "risparmio dati" di Android acceso
  return c.type === 'cellular';
}
/** 10/11/2026: telefono o dispositivo poco potente → video SEMPRE al minimo (anche col
 *  Wi-Fi): YouTube non permette il solo audio, ma un video 144p nascosto pesa pochissimo. */
function dispositivoLeggero() {
  if (typeof navigator === 'undefined') return false;
  const mem = navigator.deviceMemory, cpu = navigator.hardwareConcurrency;
  if ((mem && mem <= 4) || (cpu && cpu <= 4)) return true;
  const tocco = (typeof window !== 'undefined') && ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0);
  return !!(tocco && typeof screen !== 'undefined' && Math.min(screen.width || 9999, screen.height || 9999) < 700);
}
/** 10/11/2026: QUALITÀ AUTOMATICA. Gradini del video: 144p, 240p, 360p, 480p, 720p.
 *  Sul telefono si parte da 360p e ASIA misura da sola se il telefono "fatica"
 *  (la pagina rallenta o la canzone si ferma a caricare): se fatica scende, se va liscio
 *  per un minuto sale. Il livello giusto si ricorda per la volta dopo. L'audio di YouTube
 *  viaggia separato dal video: abbassare il video non peggiora la musica. */
const QualitaAuto = {
  GRADINI: [[256, 144, 'tiny', '144p'], [426, 240, 'small', '240p'], [640, 360, 'medium', '360p'],
            [854, 480, 'large', '480p'], [1280, 720, 'hd720', '720p']],
  CHIAVE: 'asia_qualita_video',
  livello: null,
  _caricamenti: [],     // istanti in cui la canzone si è fermata a caricare
  _lenti: 0, _totali: 0, _ultimoFrame: 0, _lisciaDa: 0, _avviato: false,

  _iniziale() {
    try { const v = parseInt(localStorage.getItem(this.CHIAVE), 10); if (v >= 0 && v <= 4) return v; } catch (e) {}
    return dispositivoLeggero() ? 2 : 4;
  },
  /** Livello da usare adesso (la SIM senza illimitato vince: sempre il minimo). */
  attuale() {
    if (this.livello === null) this.livello = this._iniziale();
    return risparmiaDati() ? 0 : this.livello;
  },
  _cambia(nuovo, motivo) {
    nuovo = Math.max(0, Math.min(4, nuovo));
    if (nuovo === this.livello) return;
    this.livello = nuovo;
    try { localStorage.setItem(this.CHIAVE, String(nuovo)); } catch (e) {}
    log('🎞️ Video ' + this.GRADINI[nuovo][3] + ' (' + motivo + ')');
    applicaQualitaYT();
  },
  /** Chiamato quando YouTube si ferma a caricare durante una canzone. */
  caricamento() {
    const ora = Date.now();
    this._caricamenti = this._caricamenti.filter(t => ora - t < 30000);
    this._caricamenti.push(ora);
    this._lisciaDa = ora;
    if (this._caricamenti.length >= 2) { this._caricamenti = []; this._cambia(this.livello - 1, 'la canzone si fermava a caricare'); }
  },
  /** Misura continua: quanti fotogrammi della pagina arrivano in ritardo (telefono che fatica). */
  avvia() {
    if (this._avviato || typeof requestAnimationFrame === 'undefined') return;
    this._avviato = true;
    this._lisciaDa = Date.now();
    const frame = (t) => {
      if (this._ultimoFrame && Player.stato() === 'suona' && !document.hidden) {
        this._totali++;
        if (t - this._ultimoFrame > 70) this._lenti++;
      }
      this._ultimoFrame = t;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    const t = setInterval(() => this._controlla(), 2000);
    if (t && t.unref) t.unref();
  },
  _controlla() {
    if (Player.stato() !== 'suona' || !Player.branoCorrente() || Player._eAudio(Player.branoCorrente())) {
      this._lenti = 0; this._totali = 0; this._lisciaDa = Date.now();
      return;
    }
    const lenti = this._totali ? this._lenti / this._totali : 0;
    this._lenti = 0; this._totali = 0;
    if (lenti > 0.25) { this._lisciaDa = Date.now(); this._cambia(this.livello - 1, 'il telefono faticava'); return; }
    if (Date.now() - this._lisciaDa > 60000 && !risparmiaDati()) {
      this._lisciaDa = Date.now();
      this._cambia(this.livello + 1, 'tutto liscio da un minuto');
    }
  }
};

function applicaQualitaYT() {
  if (!ytPlayer) return;
  const g = QualitaAuto.GRADINI[QualitaAuto.attuale()];
  try { if (ytPlayer.setSize) ytPlayer.setSize(g[0], g[1]); } catch (e) {}
  try { if (ytPlayer.setPlaybackQuality) ytPlayer.setPlaybackQuality(g[2]); } catch (e) {}
  const chiave = g[3] + (risparmiaDati() ? '-sim' : '');
  if (chiave !== applicaQualitaYT._ultimo) {
    applicaQualitaYT._ultimo = chiave;
    log(risparmiaDati() ? '📉 Rete cellulare: risparmio dati (video ' + g[3] + ')' : '🎞️ Video ' + g[3] + ' (qualità automatica)');
  }
}

function onYTStateChange(e) {
  // 10/11/2026: quando parte un brano, qualità automatica (vedi QualitaAuto).
  if (e && e.data === 1) { applicaQualitaYT(); QualitaAuto.avvia(); }
  if (e && e.data === 3 && Player.stato() === 'suona') QualitaAuto.caricamento();
  Player._suStatoYT(e);
}
function onYTError(e) { Player._suErroreYT(e); }

const Player = {
  _stato: 'fermo',          // 'fermo' | 'caricamento' | 'suona' | 'pausa'
  _corrente: null,
  _idRiproduzione: 0,       // cambia a ogni riproduci/stop: distingue il "vecchio" dal "nuovo"
  _idRegistrato: -1,        // per chiamare Memoria.registraAvvio una sola volta per brano
  _volume: 100,
  _abbassato: false,
  _inizioAscolto: 0,
  _timerTempo: null,
  VOLUME_PASSO: 15,
  VOLUME_DUCKING: 0.25,     // 7.15: musica al 25% mentre ASIA parla

  /** Stato attuale del player. */
  stato() { return this._stato; },

  /** Il brano caricato adesso (anche in pausa o appena finito); null dopo uno stop. */
  branoCorrente() { return this._corrente; },

  /** 10/11/2026: true se il brano non è di YouTube ma un audio diretto (radio o MP3). */
  _eAudio(b) { return !!(b && (b.radio || b.locale) && b.url); },

  /** Lettore audio HTML5 (uno solo, creato al primo uso). Gli eventi arrivano con
   *  l'id della riproduzione: quelli di un brano vecchio vengono ignorati. */
  _audioEl() {
    if (this._audio || typeof Audio === 'undefined') return this._audio || null;
    const a = new Audio();
    a.preload = 'auto';
    const ok = (fn) => () => { if (this._audioId === this._idRiproduzione && this._eAudio(this._corrente)) fn(); };
    a.addEventListener('playing', ok(() => this._suStatoYT({ data: YT_SUONA })));
    a.addEventListener('pause', ok(() => { if (!a.ended) this._suStatoYT({ data: YT_PAUSA }); }));
    a.addEventListener('ended', ok(() => this._suStatoYT({ data: YT_FINITO })));
    a.addEventListener('error', ok(() => this._suErroreYT({ data: 5 })));
    this._audio = a;
    return a;
  },

  /** Carica e fa partire un brano. */
  riproduci(brano) {
    if (!brano) return;
    this._idRiproduzione++;
    this._corrente = brano;
    this._inizioAscolto = Date.now();
    this._imposta('caricamento');
    setPlayerInfo(pulisciTitolo(brano.titolo));
    log('▶️ Riproduco: ' + pulisciTitolo(brano.titolo) + ' (' + brano.id + ')');
    if (this._eAudio(brano)) {
      if (ytPlayer) { try { ytPlayer.stopVideo(); } catch (e) {} }
      const a = this._audioEl();
      if (!a) { log('❌ Lettore audio non disponibile'); return; }
      this._audioId = this._idRiproduzione;
      a.src = brano.url;
      this._applicaVolume();
      const p = a.play();
      if (p && p.catch) p.catch(e => { if (this._audioId === this._idRiproduzione) { log('❌ Audio: ' + e.message); this._suErroreYT({ data: 5 }); } });
      return;
    }
    if (this._audio) { try { this._audio.pause(); } catch (e) {} }
    if (ytPlayerReady && ytPlayer) {
      applicaQualitaYT();
      try { ytPlayer.loadVideoById(brano.id); } catch (e) { log('Errore player: ' + e.message); }
    } else {
      pendingVideoId = brano.id;
      caricaYouTubeIframeAPI();
    }
  },

  /** Ferma e dimentica il brano corrente (gli eventi in ritardo verranno ignorati). */
  stop() {
    this._idRiproduzione++;
    pendingVideoId = null;
    if (ytPlayer) { try { ytPlayer.stopVideo(); } catch (e) {} }
    if (this._audio) { try { this._audio.pause(); this._audio.removeAttribute('src'); this._audio.load(); } catch (e) {} }
    const cera = !!this._corrente;
    this._corrente = null;
    this._imposta('fermo');
    if (cera) setPlayerInfo('⏹️ Fermata');
  },

  /** Pausa vera: il brano resta caricato e "riprendi" continua dal punto esatto. */
  pausa() {
    if (this._stato !== 'suona' && this._stato !== 'caricamento') return;
    if (this._eAudio(this._corrente)) { try { this._audio.pause(); } catch (e) {} }
    else if (ytPlayer) { try { ytPlayer.pauseVideo(); } catch (e) {} }
    this._imposta('pausa');
    if (this._corrente) setPlayerInfo('⏸️ ' + pulisciTitolo(this._corrente.titolo));
  },

  /** Riprende dopo una pausa. */
  riprendi() {
    if (this._stato !== 'pausa') return;
    if (this._eAudio(this._corrente)) { try { this._audio.play(); } catch (e) {} }
    else if (ytPlayer) { try { ytPlayer.playVideo(); } catch (e) {} }
    this._imposta('caricamento');
    if (this._corrente) setPlayerInfo(pulisciTitolo(this._corrente.titolo));
  },

  /** Alza il volume della musica di un passo. */
  volumeSu() { this._volume = Math.min(100, this._volume + this.VOLUME_PASSO); this._applicaVolume(); log('🔊 Volume ' + this._volume); },
  /** Abbassa il volume della musica di un passo. */
  volumeGiu() { this._volume = Math.max(10, this._volume - this.VOLUME_PASSO); this._applicaVolume(); log('🔉 Volume ' + this._volume); },

  /** Ducking: musica bassa mentre ASIA parla (7.15). */
  abbassaPerVoce() { this._abbassato = true; this._applicaVolume(); },
  /** Fine ducking. */
  ripristinaVolume() { this._abbassato = false; this._applicaVolume(); },

  /** Secondi ascoltati del brano corrente (per "saltato entro 10 s"). */
  secondiAscoltati() {
    if (this._eAudio(this._corrente) && this._audio) return this._audio.currentTime || 0;
    try {
      if (ytPlayer && ytPlayer.getCurrentTime) {
        const t = ytPlayer.getCurrentTime();
        if (typeof t === 'number' && !isNaN(t)) return t;
      }
    } catch (e) {}
    return this._inizioAscolto ? (Date.now() - this._inizioAscolto) / 1000 : 0;
  },

  _applicaVolume() {
    const v = this._abbassato ? Math.round(this._volume * this.VOLUME_DUCKING) : this._volume;
    if (this._audio) { try { this._audio.volume = Math.max(0, Math.min(1, v / 100)); } catch (e) {} }
    if (!ytPlayer || !ytPlayer.setVolume) return;
    try { ytPlayer.setVolume(v); } catch (e) {}
  },

  /** Richiesta dell'utente dopo aver notato falsi comandi con la musica alta
   *  (probabile eco dell'altoparlante nel microfono): mentre il brano suona
   *  DAVVERO (non durante il caricamento), il microfono si stacca del tutto,
   *  non solo si filtra il testo riconosciuto. Per intervenire si preme AVVIA
   *  (mette in pausa e riapre il microfono) o STOP (fisico, non passa dal
   *  microfono quindi funziona comunque). */
  _imposta(nuovo) {
    if (this._stato === nuovo) return;
    const prima = this._stato;
    this._stato = nuovo;
    if (nuovo === 'suona') {
      this._avviaTimerTempo(); Listener.pausa('musica');
      // 10/11/2026: durante la musica il microfono è spento: dirlo chiaro sullo schermo
      setStatus('🎵 Premi il pulsante per parlarmi');
    }
    else { this._fermaTimerTempo(); if (prima === 'suona') Listener.riprendi('musica'); }
    Sessione._aggiornaTimerInattivita();
    Sessione.logStato();
  },

  /** Ogni 2 s avvisa la Coda di quanto manca alla fine (serve a 7.6). */
  _avviaTimerTempo() {
    this._fermaTimerTempo();
    this._timerTempo = setInterval(() => {
      if (this._stato !== 'suona' || !this._corrente) return;
      if (this.secondiAscoltati() >= 30) { try { contaAscolto(this._corrente); } catch (e) {} }
      if (this._eAudio(this._corrente)) {
        const a = this._audio;
        if (a && isFinite(a.duration)) { try { Coda.suAvanzamento(this._corrente, a.currentTime, a.duration); } catch (e) {} }
        return;
      }
      if (!ytPlayer || !ytPlayer.getDuration) return;
      try { Coda.suAvanzamento(this._corrente, ytPlayer.getCurrentTime(), ytPlayer.getDuration()); } catch (e) {}
    }, 2000);
  },

  _fermaTimerTempo() {
    if (this._timerTempo) { clearInterval(this._timerTempo); this._timerTempo = null; }
  },

  /** true se l'evento del player riguarda un video diverso da quello corrente. */
  _eventoVecchio() {
    if (!this._corrente) return true;
    if (this._eAudio(this._corrente)) return false;   // gli eventi audio sono già filtrati per id
    try {
      const d = ytPlayer && ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
      if (d && d.video_id && d.video_id !== this._corrente.id) return true;
    } catch (e) {}
    return false;
  },

  _suStatoYT(e) {
    log('▶️ Stato player: ' + (STATI_YT[String(e.data)] || e.data));
    if (this._eventoVecchio()) return;              // fermato da noi o video vecchio
    const brano = this._corrente;
    if (e.data === YT_SUONA) {
      this._applicaVolume();
      this._imposta('suona');
      if (this._idRegistrato !== this._idRiproduzione) {
        this._idRegistrato = this._idRiproduzione;
        Memoria.registraAvvio(brano);
      }
    } else if (e.data === YT_PAUSA) {
      if (this._stato === 'suona' || this._stato === 'caricamento') this._imposta('pausa');
    } else if (e.data === YT_FINITO) {
      if (this._stato !== 'suona' && this._stato !== 'pausa') return;
      const id = this._idRiproduzione;
      this._imposta('fermo');
      setPlayerInfo('⏹️ Canzone finita');
      if (id === this._idRiproduzione) Coda.suFinita(brano);
    }
  },

  _suErroreYT(e) {
    const CODICI_ERRORE = {
      2: 'parametro video non valido',
      5: 'errore del player HTML5',
      100: 'video non trovato o rimosso',
      101: 'il proprietario non permette di riprodurlo fuori da YouTube',
      150: 'il proprietario non permette di riprodurlo fuori da YouTube'
    };
    const msg = CODICI_ERRORE[e.data] || ('codice ' + e.data);
    log('❌ Errore player YouTube: ' + msg);
    if (this._eventoVecchio()) return;
    const brano = this._corrente;
    setPlayerInfo('Errore riproduzione (' + msg + ').');
    this._imposta('fermo');
    Coda.suErrore(brano, e.data);
  }
};

// ------------------------------------------------------------
// 13. CODA (brani da suonare in sequenza)
// ------------------------------------------------------------
const Coda = {
  brani: [],
  indice: -1,               // -1 = coda impostata ma nessun brano ancora partito
  origine: null,            // 'artista' | 'brano' | 'altra'
  MAX_ERRORI_DI_FILA: 3,
  SECONDI_PRIMA_DELLA_FINE: 30,   // 7.6: quando preparare la continuazione
  _versione: 0,
  _erroriDiFila: 0,
  _continuazione: 'nessuna',      // 'nessuna' | 'in_corso' | 'fatta'
  _avviaAppenaPronta: false,
  // 11/11/2026: RICERCA "PIGRA". Le canzoni proposte da Gemini non si cercano più tutte
  // subito su YouTube (100 unità l'una!): restano qui e se ne cerca UNA alla volta,
  // tenendone sempre una sola pronta in anticipo. Domenico cambia spesso: niente sprechi.
  daCercare: [],
  _riempiPromessa: null,

  /** true se ci sono ancora canzoni di Gemini da cercare (o una ricerca in corso). */
  haDaCercare() { return this.daCercare.length > 0 || !!this._riempiPromessa; },

  /** Cerca su YouTube la prossima canzone di daCercare e la aggiunge in fondo alla coda.
   *  Al massimo 3 tentativi per chiamata. @returns {Promise<boolean>} true se ne ha aggiunta una. */
  riempi() {
    if (this._riempiPromessa) return this._riempiPromessa;
    if (!this.daCercare.length) return Promise.resolve(false);
    if (Consumi._dati().ytFinito) { this.daCercare = []; return Promise.resolve(false); }
    const versione = this._versione;
    this._riempiPromessa = (async () => {
      try {
        let tentativi = 0;
        while (this.daCercare.length && tentativi < 3) {
          tentativi++;
          const b = this.daCercare.shift();
          const trovati = await ListaDaGemini.cercaSuYouTube([b]);
          if (versione !== this._versione) return false;
          const escludi = Memoria.idSaltatiValidi();
          Memoria.braniSessione.forEach(id => escludi.add(id));
          this.brani.forEach(x => escludi.add(x.id));
          const nuovo = trovati.find(x => !escludi.has(x.id) && !Memoria.titoliSessione.has(Ricerca.chiaveTitolo(x)));
          if (nuovo) {
            this.brani.push(nuovo);
            log('📃 Pronta la prossima: ' + pulisciTitolo(nuovo.titolo) + ' (ancora ' + this.daCercare.length + ' da cercare)');
            return true;
          }
        }
        return false;
      } catch (e) {
        return false;
      } finally {
        if (versione === this._versione) this._riempiPromessa = null;
      }
    })();
    return this._riempiPromessa;
  },

  /** Imposta una nuova coda (non parte finché non si chiama prossima()). */
  imposta(brani, origine) {
    this.brani = (brani || []).slice();
    this.indice = -1;
    this.origine = origine || 'artista';
    this._nuovaVersione();
    log('📃 Coda (' + this.origine + '): ' + this.brani.map(b => pulisciTitolo(b.titolo)).join(' | '));
    Sessione.logStato();
  },

  /** Svuota la coda (usato da "stop"). */
  svuota() {
    this.brani = [];
    this.indice = -1;
    this.origine = null;
    this._nuovaVersione();
    Sessione.logStato();
  },

  /** Il brano della coda a cui siamo arrivati, o null. */
  attuale() { return this.brani[this.indice] || null; },

  /** true se dopo il brano attuale ce n'è almeno un altro. */
  haAltri() { return this.indice < this.brani.length - 1; },

  /** Avvia il brano successivo (via Player) e lo restituisce; null se non ce ne sono. */
  prossima() {
    if (!this.haAltri()) return null;
    this.indice++;
    const b = this.brani[this.indice];
    Player.riproduci(b);
    Sessione.logStato();
    // ricerca pigra: mentre questa suona, prepara (solo) la prossima
    if (!this.haAltri() && this.daCercare.length) this.riempi();
    return b;
  },

  /** Avvia il brano precedente e lo restituisce; null se siamo al primo. */
  precedente() {
    if (this.indice <= 0) return null;
    this.indice--;
    const b = this.brani[this.indice];
    Player.riproduci(b);
    Sessione.logStato();
    return b;
  },

  /** Chiamato dal Player quando un brano finisce da solo. Nessuna voce, solo il click (7.13). */
  suFinita(brano) {
    Memoria.registraFine(brano, brano && brano.durataSec);
    this._erroriDiFila = 0;
    this._avanti();
  },

  /** Passa alla prossima; se non è ancora pronta ma ce ne sono da cercare, la cerca prima. */
  _avanti() {
    if (this.haAltri()) { Suoni.salto(); this.prossima(); return; }
    if (this.haDaCercare()) {
      const v = this._versione;
      this.riempi().then(ok => {
        if (v !== this._versione) return;
        if (!ok) this.daCercare = [];
        this._avanti();
      });
      return;
    }
    if (this.origine === 'brano' && this._continuazione !== 'fatta') {
      // 7.6: dopo un brano preciso si continua con lo stesso artista.
      this._avviaAppenaPronta = true;
      if (this._continuazione === 'nessuna') this._preparaContinuazione();
      return;
    }
    this._fineCoda();
  },

  /** Chiamato dal Player su errore del video: salta al successivo, max 3 di fila. */
  suErrore(brano, codice) {
    // 10/11/2026: video rifiutato da YouTube → si ricorda e, se c'è, si prova SUBITO e in
    // silenzio un'altra versione della stessa canzone (niente frasi, microfono che resta com'è).
    if ([100, 101, 150, 153].includes(Number(codice)) && brano && brano.id) VideoBloccati.aggiungi(brano.id);
    const riserve = (brano && brano._riserve || []).filter(r => !VideoBloccati.ha(r.id));
    if (riserve.length) {
      const alt = riserve.shift();
      alt._riserve = riserve;
      log('🔁 Provo un\'altra versione: ' + pulisciTitolo(alt.titolo));
      if (this.brani[this.indice] === brano) this.brani[this.indice] = alt;
      Player.riproduci(alt);
      return;
    }
    Suoni.errore();
    this._erroriDiFila++;
    log('⏭️ Video non riproducibile (' + codice + '), errori di fila: ' + this._erroriDiFila);
    if (this._erroriDiFila >= this.MAX_ERRORI_DI_FILA) {
      this._erroriDiFila = 0;
      Voce.parla("Questi video non si possono sentire, prova un'altra ricerca.");
      return;
    }
    if (this.haAltri()) { this.prossima(); return; }
    if (this.haDaCercare()) {
      const v = this._versione;
      this.riempi().then(ok => {
        if (v !== this._versione) return;
        if (ok && this.haAltri()) this.prossima();
        else Voce.parla("Questo video non si può sentire, prova un'altra ricerca.");
      });
      return;
    }
    Voce.parla("Questo video non si può sentire, prova un'altra ricerca.");
  },

  /** Dal Player ogni 2 s: se è un brano preciso che sta per finire, prepara la continuazione. */
  suAvanzamento(brano, secondi, durata) {
    if (this.origine !== 'brano' || this._continuazione !== 'nessuna') return;
    if (!durata || this.haAltri()) return;
    if (durata - secondi <= this.SECONDI_PRIMA_DELLA_FINE) this._preparaContinuazione();
  },

  /** 7.6: seconda ricerca (stesso artista, esclusi i brani di sessione e i saltati),
   *  aggiunta in fondo alla coda. Solo a sessione attiva. */
  async _preparaContinuazione() {
    if (this._continuazione !== 'nessuna') return;
    if (!Sessione.attiva) { this._continuazione = 'fatta'; this._seAttesaAvvia(); return; }

    this._continuazione = 'in_corso';
    const versione = this._versione;
    const branoRif = this.brani[this.indice] || Memoria.ultimoBrano;

    const escludi = Memoria.idSaltatiValidi();
    Memoria.braniSessione.forEach(id => escludi.add(id));
    this.brani.forEach(b => escludi.add(b.id));
    const escludiTitoli = new Set(Memoria.titoliSessione);
    this.brani.forEach(b => escludiTitoli.add(Ricerca.chiaveTitolo(b)));

    if (branoRif && settings.geminiApiKey && settings.usaGeminiPerPlaylist) {
      log('🎵 Chiedo brani simili a ' + pulisciTitolo(branoRif.titolo) + ' a Gemini');
      const { brani, errore } = await chiediBraniSimiliAGemini(branoRif, 8);
      if (versione !== this._versione) return;
      if (!errore && brani.length) {
        // Verifichiamo su YouTube solo le prime candidate: ogni ricerca
        // costa 100 unità di quota (vedi nota sopra in _eseguiLista). Non
        // serve cercarle tutte e 8 subito — se la coda si svuota ancora,
        // questa funzione viene richiamata di nuovo.
        // 11/11/2026: ricerca pigra: se ne cerca UNA (max 3 tentativi), le altre
        // restano in daCercare e si cercano una alla volta solo se servono.
        let nuovi = [];
        let i = 0;
        while (i < brani.length && i < 3 && !nuovi.length) {
          const trovati = await ListaDaGemini.cercaSuYouTube([brani[i]]);
          i++;
          if (versione !== this._versione) return;
          nuovi = trovati.filter(b => !escludi.has(b.id) && !escludiTitoli.has(Ricerca.chiaveTitolo(b)));
        }
        if (nuovi.length) {
          this.brani.push(nuovi[0]);
          this.daCercare = brani.slice(i);
          this._continuazione = 'fatta';
          log('📃 Aggiunti ' + nuovi.length + ' brani simili (Gemini)');
          this._seAttesaAvvia();
          return;
        }
        log('⚠️ Brani simili trovati ma tutti già sentiti: ricado sull\'artista');
      }
    }

    const artista = Memoria.ultimoArtista;
    if (!artista) { this._continuazione = 'fatta'; this._seAttesaAvvia(); return; }
    log('🔎 Fallback: preparo altri brani di ' + artista);
    const { risultati } = await Ricerca.cerca(artista, 'riproduci');
    if (versione !== this._versione) return;
    const nuovi = Ricerca.costruisciCoda(risultati, artista, { escludi, escludiTitoli, max: 5 });
    this.brani.push(...nuovi);
    this._continuazione = 'fatta';
    log('📃 Aggiunti ' + nuovi.length + ' brani di ' + artista);
    this._seAttesaAvvia();
  },

  _seAttesaAvvia() {
    if (!this._avviaAppenaPronta) return;
    this._avviaAppenaPronta = false;
    if (this.haAltri()) { Suoni.salto(); this.prossima(); }
    else this._fineCoda();
  },

  /** 7.7: fine coda → la sessione resta attiva, solo "Finito." */
  _fineCoda() {
    log('🏁 Fine della coda');
    Voce.parla(settings.modoUnPulsante ? 'Finito. Dimmi un\'altra canzone.' : 'Finito.');
    Sessione._aggiornaTimerInattivita();
  },

  _nuovaVersione() {
    this._versione++;
    this.daCercare = [];
    this._riempiPromessa = null;
    this._erroriDiFila = 0;
    this._continuazione = 'nessuna';
    this._avviaAppenaPronta = false;
  }
};

// ------------------------------------------------------------
// 14. CHAT (adattatore C): Gemini. Non parla: restituisce il testo.
// ------------------------------------------------------------
/** Chiede a Gemini. @returns {Promise<{testo:string, errore:?string}>}
 *  errore = 'chiave_mancante' | 'rete' | null. System prompt identico ad ASIA 1. */
/** 10/11/2026: CONTATORE DEI CONSUMI di oggi. Google azzera i limiti a mezzanotte
 *  della California (ore 9 circa in Italia): usiamo lo stesso "giorno".
 *  Conta solo quello che consuma ASIA in questo browser (la verità sta nella
 *  console di Google). YouTube: ricerca = 100 unità, dettagli video = 1. */
const Consumi = {
  CHIAVE: 'asia_consumi',
  LIMITE_YT: 10000,
  d: null,
  _giorno() {
    try { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  },
  _dati() {
    const g = this._giorno();
    if (!this.d) { try { this.d = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null'); } catch (e) { this.d = null; } }
    if (!this.d || this.d.giorno !== g) this.d = { giorno: g, yt: 0, ytFinito: false, gemini: {}, geminiBloccato: {} };
    return this.d;
  },
  _salva() { try { localStorage.setItem(this.CHIAVE, JSON.stringify(this.d)); } catch (e) {} this.mostra(); },
  youtube(unita) { this._dati().yt += unita; this._salva(); },
  youtubeFinito() { const d = this._dati(); d.ytFinito = true; d.yt = Math.max(d.yt, this.LIMITE_YT); this._salva(); },
  gemini(modello, ok) {
    const d = this._dati();
    const m = modello.includes('lite') ? 'Lite' : 'Flash';
    d.gemini[m] = (d.gemini[m] || 0) + 1;
    if (!ok) d.geminiBloccato[m] = true;
    this._salva();
  },
  testo() {
    const d = this._dati();
    const resto = Math.max(0, this.LIMITE_YT - d.yt);
    const yt = d.ytFinito ? '🔴 YouTube: finito per oggi'
      : (resto < 1000 ? '🟠' : '🟢') + ' YouTube: ' + d.yt.toLocaleString('it-IT') + ' / 10.000 · ancora ~' + Math.floor(resto / 101) + ' ricerche';
    const gem = ['Flash', 'Lite'].map(m => m + ' ' + (d.gemini[m] || 0) + (d.geminiBloccato[m] ? ' 🔴' : '')).join(' · ');
    return yt + '\n🤖 Gemini oggi: ' + gem + '\n(si azzera verso le 9 del mattino)';
  },
  mostra() {
    let el = document.getElementById('contatoreConsumi');
    if (!el && document.body && document.createElement) {
      el = document.createElement('div');
      el.id = 'contatoreConsumi';
      if (document.body.appendChild) document.body.appendChild(el);
    }
    if (!el) return;
    if (el.style) {
      el.style.cssText = 'position:fixed;top:10px;left:10px;z-index:650;font:12px/1.35 system-ui,sans-serif;' +
        'color:#ddd;background:rgba(0,0,0,0.55);padding:6px 9px;border-radius:8px;white-space:pre;pointer-events:none;';
      el.style.display = (settings.mostraContatore === false || Cornice.nascosto('contatoreConsumi')) ? 'none' : '';
    }
    el.textContent = this.testo();
    Cornice.applicaUno(el);
  }
};

/** 10/11/2026: VU-METER VINTAGE (strumento per il nonno, sul PC).
 *  Ago bianco e nero stile anni '60 che si muove con la voce, più due spie:
 *   ● ASCOLTA  = il riconoscimento vocale di ASIA è aperto in questo momento
 *   ● HO SENTITO = ASIA ha appena ricevuto delle parole (si accende per 1,5 s)
 *  Il livello viene da un ascolto separato del microfono (solo misura, niente
 *  registrazione): se l'ago si muove ma "HO SENTITO" non si accende, il microfono
 *  funziona ma ASIA in quel momento non sta ascoltando. */
const VuMeter = {
  _ctx: null, _an: null, _buf: null, _canvas: null, _ago: 0, _sentitoFino: 0, _avviato: false,
  W: 280, H: 150,

  async avvia() {
    if (this._avviato || settings.mostraVuMeter === false) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof AudioContext === 'undefined') return;
    this._avviato = true;
    this._creaCanvas();
    // 11/11/2026: su Android il microfono può usarlo UN solo programma alla volta.
    // Se il VU-meter lo prende con getUserMedia, il riconoscimento vocale riceve solo
    // silenzio (sente il volumetro ma ASIA non capisce nulla). Su Android quindi niente
    // getUserMedia: il VU-meter si muove solo quando ASIA riceve parole (sentito()).
    if (/Android/i.test(navigator.userAgent || '')) {
      log('🎚️ VU-meter in modalità telefono (non occupa il microfono)');
      const cicloA = () => { this._disegna(); requestAnimationFrame(cicloA); };
      requestAnimationFrame(cicloA);
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false } });
      this._ctx = new AudioContext();
      const src = this._ctx.createMediaStreamSource(stream);
      this._an = this._ctx.createAnalyser();
      this._an.fftSize = 1024;
      this._buf = new Float32Array(this._an.fftSize);
      src.connect(this._an);
      log('🎚️ VU-meter acceso');
    } catch (e) {
      log('🎚️ VU-meter: microfono non disponibile (' + e.message + ')');
    }
    const ciclo = () => { this._disegna(); requestAnimationFrame(ciclo); };
    requestAnimationFrame(ciclo);
  },

  /** 10/11/2026: perché il microfono è spento, in parole semplici (per il nonno). */
  _perche() {
    if (!Sessione.attiva) return 'ASIA non è avviata';
    const m = Listener.motiviPausa;
    if (m.has('impostazioni')) return 'menu aperto';
    if (m.has('background')) return 'app in secondo piano';
    if (m.has('musica')) return 'musica in corso (premi il pulsante)';
    if (m.has('parlato')) return 'ASIA sta parlando';
    if (Listener.bloccato) return 'pausa dopo un errore, riprovo…';
    return 'si sta riaprendo…';
  },

  /** Chiamato quando ASIA riceve delle parole. */
  sentito() { this._sentitoFino = Date.now() + 1500; },

  _creaCanvas() {
    const c = document.createElement('canvas');
    c.id = 'vuMeter';
    this.W = 296; this.H = 74;
    c.width = this.W * 2; c.height = this.H * 2;          // nitido sugli schermi ad alta densità
    c.style.cssText = 'position:fixed;left:10px;top:78px;z-index:650;width:' + this.W + 'px;height:' + this.H +
      'px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none;';
    document.body.appendChild(c);
    this._canvas = c;
    Cornice.applicaUno(c);
  },

  _livelloVU() {
    if (!this._an) {
      // Modalità telefono: livello "finto" mentre arrivano parole, fermo altrimenti.
      return Date.now() < this._sentitoFino ? (-6 + Math.random() * 8) : -20;
    }
    this._an.getFloatTimeDomainData(this._buf);
    let somma = 0;
    for (let i = 0; i < this._buf.length; i++) somma += this._buf[i] * this._buf[i];
    const rms = Math.sqrt(somma / this._buf.length) || 1e-6;
    const db = 20 * Math.log10(rms);           // dBFS
    return Math.max(-20, Math.min(3, db + 18)); // -18 dBFS = 0 VU (voce normale vicino al microfono)
  },

  /** Striscia LED stile mixer: 24 LED verdi → gialli → rossi, con il "picco" che
   *  resta acceso un attimo, più due LED spia (ASCOLTA, HO SENTITO). */
  _disegna() {
    const c = this._canvas;
    if (!c) return;
    const spento = settings.mostraVuMeter === false || Cornice.nascosto('vuMeter');
    c.style.display = spento ? 'none' : '';
    if (spento) return;
    // se è stato allargato/allungato con la modalità M, ridisegna a quella misura (niente LED deformati)
    const cw = Math.round((c.clientWidth || this.W) * 2), ch = Math.round((c.clientHeight || this.H) * 2);
    if (cw > 20 && ch > 20 && (c.width !== cw || c.height !== ch)) { c.width = cw; c.height = ch; }
    const g = c.getContext('2d');
    const W = c.width, H = c.height, k = 2, N = 24;
    const ascoltaOra = !!(Listener.r && Listener.motiviPausa.size === 0);
    // 10/11/2026: la striscia mostra la voce SOLO quando ASIA sta ascoltando; durante la
    // musica (microfono spento apposta) i LED restano spenti, invece di segnare la cassa.
    const v = ascoltaOra ? this._livelloVU() : -20;
    this._ago += (v - this._ago) * (v > this._ago ? 0.5 : 0.12);
    const quanti = Math.round((this._ago + 20) / 23 * N);
    const ora = Date.now();
    if (quanti >= (this._picco || 0)) { this._picco = quanti; this._piccoFino = ora + 900; }
    else if (ora > (this._piccoFino || 0)) this._picco = Math.max(0, (this._picco || 0) - 1);
    // pannello scuro con leggera sfumatura
    const fondo = g.createLinearGradient(0, 0, 0, H);
    fondo.addColorStop(0, '#1d1f22'); fondo.addColorStop(1, '#0b0c0d');
    g.fillStyle = fondo; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#333'; g.lineWidth = 2 * k; g.strokeRect(k, k, W - 2 * k, H - 2 * k);
    // LED della striscia
    const x0 = 12 * k, y0 = 12 * k, larg = (W - 24 * k) / N, alt = 20 * k;
    for (let i = 0; i < N; i++) {
      const col = i < 15 ? [40, 220, 90] : i < 20 ? [255, 200, 40] : [255, 60, 50];
      const acceso = i < quanti || i === this._picco - 1;
      const x = x0 + i * larg;
      g.shadowBlur = acceso ? 10 * k : 0;
      g.shadowColor = 'rgb(' + col.join(',') + ')';
      g.fillStyle = acceso ? 'rgb(' + col.join(',') + ')' : 'rgba(' + col.join(',') + ',0.13)';
      g.fillRect(x + 1.2 * k, y0, larg - 2.4 * k, alt);
    }
    g.shadowBlur = 0;
    // scritte sotto la striscia
    g.fillStyle = '#7d8590'; g.font = (7 * k) + 'px system-ui, sans-serif'; g.textBaseline = 'middle';
    g.textAlign = 'left'; g.fillText(ascoltaOra ? 'MIC — parla pure' : 'MIC spento: ' + this._perche(), x0, y0 + alt + 8 * k);
    if (ascoltaOra) { g.textAlign = 'right'; g.fillText('troppo forte ▸', W - 12 * k, y0 + alt + 8 * k); }
    // LED spia
    const ascolta = !!(Listener.r && Listener.motiviPausa.size === 0);
    const sentito = ora < this._sentitoFino;
    const spia = (x, accesa, col, testo) => {
      const y = H - 13 * k;
      g.shadowBlur = accesa ? 12 * k : 0; g.shadowColor = col;
      g.fillStyle = accesa ? col : '#2a2d31';
      g.beginPath(); g.arc(x, y, 5 * k, 0, Math.PI * 2); g.fill();
      g.shadowBlur = 0;
      g.fillStyle = accesa ? '#e6edf3' : '#5c636b'; g.font = 'bold ' + (8 * k) + 'px system-ui, sans-serif';
      g.textAlign = 'left'; g.fillText(testo, x + 9 * k, y);
    };
    spia(20 * k, ascolta, '#3ddc84', 'ASCOLTA');
    spia(W / 2 + 8 * k, sentito, '#4fa3ff', 'HO SENTITO');
  }
};

/** 10/11/2026: CRONOLOGIA della sessione, per il nonno: cosa ha chiesto Domenico
 *  (e come l'ha capito ASIA) e quali canzoni sono partite. Si azzera a ogni AVVIA. */
const Cronologia = {
  voci: [],          // { ora, tipo: 'richiesta'|'brano', testo, dettaglio }
  MAX: 40,
  azzera() { this.voci = []; this.mostra(); },
  _ora() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); },
  richiesta(testo, d) {
    const NOMI_AZIONI = { PREF_AGGIUNGI: '⭐ messa nei preferiti', PREF_TOGLI: 'tolta dai preferiti', SOPRANNOME: 'nuovo soprannome',
      UN_ALTRA: "un'altra", DI_NUOVO: 'di nuovo', VOLUME_SU: 'volume su', VOLUME_GIU: 'volume giù', LISTA_NUMERO: 'scelta dalla lista',
      LISTA_TUTTI: 'tutta la lista', LISTA_ANCORA: 'altre della lista', LISTA_RIPETI: 'ripeti la lista', LISTA_PAUSA: 'pausa lista' };
    const tipo = d.tipo === 'CHAT' ? 'chiacchiera' : d.tipo === 'COMANDO' ? (NOMI_AZIONI[d.azione] || (d.azione || 'comando').toLowerCase())
      : ({ riproduci: 'cerca', piacere: 'a piacere', novita: 'novità', momento: 'del momento', preferiti: 'preferiti',
           playlistYT: 'playlist', soprannome: 'soprannome', lista: 'lista', top: 'classifica' }[d.intent] || 'cerca');
    this._aggiungi({ ora: this._ora(), tipo: 'richiesta', testo, dettaglio: tipo });
  },
  brano(b) {
    if (!b) return;
    const autore = Gusti.pulisciArtista(b.autore || '');
    this._aggiungi({ ora: this._ora(), tipo: 'brano', testo: pulisciTitolo(b.titolo || ''), dettaglio: autore });
  },
  _aggiungi(v) { this.voci.push(v); if (this.voci.length > this.MAX) this.voci.shift(); this.mostra(); },
  mostra() {
    if (typeof document === 'undefined' || !document.createElement) return;
    let el = document.getElementById('cronologia');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cronologia';
      if (document.body && document.body.appendChild) document.body.appendChild(el);
    }
    if (!el.style) return;
    el.style.cssText = 'position:fixed;top:72px;right:10px;z-index:640;width:300px;max-height:60vh;overflow-y:auto;' +
      'font:13px/1.4 system-ui,sans-serif;color:#ddd;background:rgba(0,0,0,0.6);padding:8px 10px;border-radius:8px;';
    el.style.display = (settings.mostraCronologia === false || Cornice.nascosto('cronologia')) ? 'none' : '';
    Cornice.applicaUno(el);
    const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    // gruppi "richiesta + canzoni partite dopo", il più recente in alto
    const gruppi = [];
    this.voci.forEach(v => { if (v.tipo === 'richiesta' || !gruppi.length) gruppi.push([]); gruppi[gruppi.length - 1].push(v); });
    const righe = gruppi.reverse().flat().map(v => v.tipo === 'richiesta'
      ? '<div style="margin-top:6px;color:#fff">' + v.ora + ' 🗣️ «' + esc(v.testo) + '» <span style="color:#999">(' + esc(v.dettaglio) + ')</span></div>'
      : '<div style="padding-left:18px;color:#b7e0b0">🎵 ' + esc(v.testo) + (v.dettaglio ? ' – ' + esc(v.dettaglio) : '') + '</div>');
    el.innerHTML = '<div style="font-weight:bold;color:#fff;border-bottom:1px solid #555;padding-bottom:3px">📋 Questa sessione</div>' +
      (righe.length ? righe.join('') : '<div style="color:#999;margin-top:6px">Ancora niente.</div>');
  }
};

/** 10/11/2026: chiamata a Gemini con RISERVA. Se il modello risponde 429 (limite
 *  gratuito finito), 500/503 (server occupati) o 404 (modello non disponibile),
 *  riprova con l'altro: Flash <-> Flash-Lite (Flash-Lite ha limiti gratuiti più alti). */
const GEMINI_FLASH = 'gemini-flash-latest';
const GEMINI_LITE = 'gemini-flash-lite-latest';
async function fetchGemini(url, init) {
  const primo = url.includes(GEMINI_LITE) ? GEMINI_LITE : GEMINI_FLASH;
  const secondo = primo === GEMINI_LITE ? GEMINI_FLASH : GEMINI_LITE;
  let resp = await fetch(url, init);
  Consumi.gemini(primo, resp.status !== 429);
  if (resp.ok || ![429, 500, 503, 404].includes(resp.status)) return resp;
  log('⚠️ Gemini ' + primo + ': HTTP ' + resp.status + ' → provo ' + secondo);
  const url2 = url.replace('/models/' + primo + ':', '/models/' + secondo + ':');
  const resp2 = await fetch(url2, init);
  Consumi.gemini(secondo, resp2.status !== 429);
  return resp2.ok ? resp2 : resp;
}

/** 10/11/2026: carattere e regole dell'"amichetto" (system prompt). */
function promptAmico() {
  const nome = settings.nomeUtente || 'il tuo amico';
  const chi = String(settings.descrizioneAmico || '').replace(/\{nome\}/g, nome);
  const pref = Preferiti.elenco().slice(0, 6).map(v => pulisciTitolo(v.titolo)).join(', ');
  return 'Sei Asia, l\'amica che fa compagnia a ' + nome + ' e gli fa ascoltare la musica. ' + chi + ' ' +
    'Come parli: sempre in italiano; frasi brevi (al massimo 2 o 3), parole semplici; tono caldo, paziente e allegro. ' +
    'Trattalo con affetto e con rispetto, mai con tono di superiorità e mai come un bambino piccolo. ' +
    'Se non capisci cosa dice, non correggerlo: chiedigli con gentilezza di ripetere. ' +
    'Ti piace parlare di musica con lui: fagli una domanda semplice alla volta, interessati alle sue canzoni ' +
    'e ogni tanto proponigli di ascoltarne una (basta che dica "metti" e il titolo). ' +
    'Regole importanti: se ti chiede chi sei, digli con dolcezza che sei un programma, non una persona. ' +
    'Se è triste, arrabbiato o nervoso, rispondi con calma, rassicuralo e suggeriscigli di chiamare il nonno ' +
    'o qualcuno di famiglia. Non parlare di argomenti solo da adulti (sesso, violenza, droghe) e non dare consigli ' +
    'di salute, medicine o soldi: per queste cose digli di chiedere al nonno o alla famiglia. ' +
    'Ogni tanto incoraggialo a raccontare le cose belle anche alla sua famiglia. ' +
    (testoGusti() ? testoGusti() + ' ' : '') +
    (pref ? 'Le sue canzoni preferite: ' + pref + '. ' : '') +
    'Le tue risposte vengono lette ad alta voce: niente elenchi, niente emoji, niente simboli, niente markdown.';
}

async function chiediAGemini(testo) {
  if (!settings.geminiApiKey) return { testo: '', errore: 'chiave_mancante' };

  log('🤖 Chiedo a Gemini: "' + testo + '"');

  try {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent'
      + '?key=' + encodeURIComponent(settings.geminiApiKey);
    // Ricorda gli ultimi scambi della sessione: così è una chiacchierata, non domande slegate.
    const storia = Chat.storia.slice(-12).map(m => ({ role: m.ruolo, parts: [{ text: m.testo }] }));
    const body = {
      contents: storia.concat([{ role: 'user', parts: [{ text: testo }] }]),
      systemInstruction: { parts: [{ text: promptAmico() }] }
    };
    const resp = await fetchGemini(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error('Gemini HTTP ' + resp.status);
    const data = await resp.json();
    const risposta = (data.candidates && data.candidates[0] && data.candidates[0].content &&
                       data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
                       data.candidates[0].content.parts[0].text || '').trim()
                      || 'Non ho capito bene, puoi ripetere?';
    Chat.storia.push({ ruolo: 'user', testo }, { ruolo: 'model', testo: risposta });
    if (Chat.storia.length > 24) Chat.storia.splice(0, Chat.storia.length - 24);
    return { testo: risposta, errore: null };
  } catch (err) {
    log('❌ Errore Gemini: ' + err.message);
    return { testo: '', errore: 'rete' };
  }
}

/** Chiede a Gemini una lista STRUTTURATA di brani per una richiesta musicale.
 *  @param {string} richiesta  la richiesta dell'utente (es. "le canzoni più belle di Nino D'Angelo")
 *  @param {number} quanti     quanti brani restituire (default 20)
 *  @returns {Promise<{brani: Array<{titolo:string, artista:string, anno:?number}>, errore:?string}>}
 *  errore = 'chiave_mancante' | 'rete' | null. */
async function chiediListaBraniAGemini(richiesta, quanti, opz) {
  opz = opz || {};
  if (!settings.geminiApiKey) return { brani: [], errore: 'chiave_mancante' };
  const n = Math.max(5, Math.min(50, quanti || 20));

  log('🧠 Chiedo a Gemini la lista per: "' + richiesta + '"');

  const prompt = 'Sei un esperto di musica. L\'utente chiede: "' + richiesta + '". ' +
    'Restituisci SOLO un array JSON valido, senza testo intorno, senza markdown, ' +
    'di esattamente ' + n + ' brani musicali che corrispondono alla richiesta. ' +
    'Ogni elemento deve avere questa forma: ' +
    '{"titolo": "Titolo esatto del brano", "artista": "Nome esatto dell\'artista", "anno": 1988}. ' +
    'Regole: ' +
    '1) Usa SOLO brani realmente esistenti e verificabili. ' +
    '2) Se la richiesta nomina un artista, tutti i brani devono essere di quell\'artista. ' +
    '3) Se la richiesta è una classifica ("le più ascoltate del 2026"), restituisci brani ' +
    'che plausibilmente appartengono a quella classifica, con l\'anno corretto. ' +
    '4) Non inventare titoli. Se non sei sicuro di un brano, non includerlo. ' +
    '5) Non aggiungere spiegazioni, commenti o testo fuori dal JSON. ' +
    'Restituisci solo l\'array.';
  let extra = '';
  if (opz.web) {
    const oggi = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
    extra += ' Oggi è il ' + oggi + '. Usa la ricerca Google per conoscere le uscite e le classifiche ATTUALI ' +
             'in Italia (radio, TV, Spotify, FIMI): non basarti solo sulla tua memoria.';
  }
  if (opz.gusti) {
    const g = testoGusti();
    if (g) extra += ' ' + g + ' Metti per primi i brani più vicini a questi gusti.';
  }
  if (extra) prompt += extra + ' Rispondi comunque SOLO con l\'array JSON.';

  const chiama = async (conWeb) => {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent'
      + '?key=' + encodeURIComponent(settings.geminiApiKey);
    const body = {
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.4, maxOutputTokens: 2048 }
    };
    if (conWeb) body.tools = [{ google_search: {} }];
    return fetchGemini(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  };

  try {
    let resp = await chiama(!!opz.web);
    if (!resp.ok && opz.web) {
      // la ricerca web non è disponibile (limite gratuito o modello): riprova senza
      log('⚠️ Gemini con ricerca web: HTTP ' + resp.status + ', riprovo senza');
      resp = await chiama(false);
    }
    if (!resp.ok) throw new Error('Gemini HTTP ' + resp.status);
    const data = await resp.json();
    const parti = (data.candidates && data.candidates[0] && data.candidates[0].content &&
                   data.candidates[0].content.parts) || [];
    let testo = parti.map(p => p.text || '').join('').trim();

    // Pulizia difensiva: a volte Gemini incapsula il JSON in ```json ... ```
    testo = testo.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
    // Con la ricerca web a volte aggiunge testo intorno: teniamo solo l'array.
    { const i = testo.indexOf('['), j = testo.lastIndexOf(']'); if (i > 0 && j > i) testo = testo.slice(i, j + 1); }
    // A volte restituisce un oggetto {brani:[...]} invece di un array.
    let arr;
    try { arr = JSON.parse(testo); } catch (e) { arr = null; }
    if (arr && !Array.isArray(arr) && Array.isArray(arr.brani)) arr = arr.brani;
    if (!Array.isArray(arr)) {
      log('⚠️ Gemini non ha restituito un array JSON valido');
      return { brani: [], errore: 'rete' };
    }

    const brani = arr
      .filter(b => b && typeof b.titolo === 'string' && b.titolo.trim() &&
                   typeof b.artista === 'string' && b.artista.trim())
      .map(b => ({ titolo: b.titolo.trim(), artista: b.artista.trim(),
                   anno: Number.isFinite(b.anno) ? b.anno : null }));

    log('✅ Gemini ha proposto ' + brani.length + ' brani');
    return { brani, errore: null };
  } catch (err) {
    log('❌ Errore Gemini lista: ' + err.message);
    return { brani: [], errore: 'rete' };
  }
}
