const Annunci = {
  /** Titolo pulito, senza "Artista - " davanti (evita "X di Y, di Y"). */
  titoloBreve(brano) {
    if (!brano) return '';
    const pieno = pulisciTitolo(brano.titolo);
    let t = pieno;
    if (brano.autore) {
      t = t.replace(new RegExp('^\\s*' + escapeRegex(brano.autore) + '\\s*[-–:]\\s*', 'i'), '');
    }
    return t.trim() || pieno;
  },

  /** Annuncio d'apertura: solo titolo e autore (regola 8). */
  apertura(brano) {
    return this.titoloBreve(brano) + ', di ' + (brano.autore || 'autore sconosciuto') + '.';
  },

  /** Per "che canzone è": titolo, autore, anno, durata. */
  info(brano) {
    const anno = brano.anno ? ', ' + brano.anno : '';
    return this.titoloBreve(brano) + ', di ' + (brano.autore || 'autore sconosciuto') + anno +
           '. Durata ' + durataInParole(brano.durataSec || 0) + '.';
  }
};

// ------------------------------------------------------------
// 16. LISTA (adattatore D): lettura numerata su richiesta esplicita (7.12)
//     È un CONTESTO A SCADENZA, non una modalità: numeri e "ancora" valgono solo
//     per settings.timeoutLista secondi dopo la fine della lettura.
// ------------------------------------------------------------
const Lista = {
  contesto: null,           // { brani, offset, scadenza }
  _inLettura: false,

  /** Cerca e legge la prima pagina. */
  async avvia(query, intent) {
    const mioId = Esecutore._idRichiesta;
    const { risultati, errore } = await Ricerca.cerca(query, 'lista');
    if (mioId !== Esecutore._idRichiesta) return;
    if (errore === 'chiave_mancante') { Esecutore._avvisaErroreRicerca(errore, query); return; }
    if (!risultati.length) {
      Suoni.errore();
      await Voce.parla(errore === 'rete' ? 'Non riesco a collegarmi a YouTube.' : 'Non ho trovato canzoni.');
      return;
    }
    this.contesto = {
      brani: dedupPerTitolo(filtraVersioniOriginali(risultati)),
      offset: 0,
      scadenza: 0            // valida solo dopo la lettura
    };
    await this._leggiPagina();
  },

  /** true se la lista è stata letta da poco (numeri e "ancora" validi). */
  attiva() {
    return !!this.contesto && Date.now() <= this.contesto.scadenza;
  },

  /** Quanti brani ha la lista corrente (per il Classificatore). */
  lunghezza() { return this.contesto ? this.contesto.brani.length : 0; },

  /** true se Asia sta LEGGENDO la lista (mic aperto per "pausa"/numero). */
  inLettura() { return this._inLettura; },

  /** "ancora": legge la pagina successiva. */
  prossimaPagina() {
    if (!this.contesto) return;
    this.contesto.offset += settings.listaPagina;
    return this._leggiPagina();
  },

  /** Avvia il brano N (1-based) della lista. */
  scegliNumero(n) {
    const brano = this.contesto && this.contesto.brani[n - 1];
    if (!brano) { Suoni.errore(); return; }
    return this._avviaBrano(brano);
  },

  /** Se Domenico dice un titolo della lista, lo avvia. @returns {boolean} */
  scegliPerTitolo(testo) {
    if (!this.attiva()) return false;
    const parole = normalizza(testo).split(' ').filter(w => w.length > 2);
    if (!parole.length) return false;
    const trovato = this.contesto.brani.find(b => {
      const tt = normalizza(b.titolo);
      return parole.every(p => tt.includes(p));
    });
    if (!trovato) return false;
    this._avviaBrano(trovato);
    return true;
  },

  /** "tutte": mette in coda TUTTA la lista e fa partire la prima. */
  async suonaTutte() {
    const c = this.contesto;
    if (!c || !c.brani.length) { Suoni.errore(); return; }
    const brani = c.brani.slice();
    this.chiudi();
    const mioId = ++Esecutore._idRichiesta;
    Suoni.ricevuto();
    if (brani[0].autore) Memoria.registraRicerca('playlist', brani[0].autore);
    Coda.imposta(brani, 'playlist');
    await Voce.parla('Ok, ' + brani.length + ' canzoni in fila. Parto con ' + Annunci.apertura(brani[0]));
    if (mioId !== Esecutore._idRichiesta) return;
    Coda.prossima();
  },

  /** "ripeti la lista": rilegge da capo senza nuova ricerca. */
  async ripeti() {
    if (!this.contesto) return;
    this.contesto.offset = 0;
    return this._leggiPagina();
  },

  /** Chiude il contesto lista. */
  chiudi() {
    this.contesto = null;
    this._inLettura = false;
  },

  async _leggiPagina() {
    const c = this.contesto;
    if (!c) return;
    const fine = Math.min(c.offset + settings.listaPagina, c.brani.length);
    const pagina = c.brani.slice(c.offset, fine);
    if (!pagina.length) {
      this.chiudi();
      await Voce.parla('Non ci sono altre canzoni.');
      return;
    }
    let msg = c.offset === 0 ? 'Ecco le canzoni. ' : 'Ecco le altre. ';
    if (c.offset === 0 && c.brani.length > settings.listaPagina) {
      msg = 'Ecco le prime ' + Math.min(settings.listaPagina, c.brani.length) +
            ' canzoni su ' + c.brani.length + '. ';
    }
    pagina.forEach((r, i) => {
      const num = c.offset + i + 1;
      msg += 'Numero ' + num + ': ' + Annunci.titoloBreve(r) + ' di ' + r.autore +
             (r.anno ? ' del ' + r.anno : '') + '. ';
    });
    const restano = c.brani.length - fine;
    if (c.offset === 0) {
      msg += 'Dimmi il numero di quella che vuoi ascoltare';
      msg += restano > 0 ? ', di\' "ancora" per le altre, o di\' "tutte" per sentirle tutte.' : ', oppure di\' "tutte" per sentirle tutte.';
    } else {
      msg += restano > 0 ? 'Quale numero, "ancora", o "tutte"?' : 'Quale numero, o "tutte"?';
    }
    c.scadenza = 0;
    this._inLettura = true;
    const esito = await Voce.parla(msg);
    if (this.contesto !== c) { this._inLettura = false; return; }
    this._inLettura = false;
    c.scadenza = Date.now() + settings.timeoutLista * 1000;
    const mm = Math.round(settings.timeoutLista);
    if (esito === 'interrotto') {
      setStatus('📃 Dimmi il numero, oppure "tutte" (' + mm + ' s)');
    } else {
      setStatus('📃 Lista pronta · di\' un numero, "ancora", "ripeti la lista" o "tutte" (' + mm + ' s)');
    }
  },

  /** Un solo annuncio (non più due di fila come in ASIA 1), poi la musica. */
  async _avviaBrano(brano) {
    this.chiudi();
    const mioId = ++Esecutore._idRichiesta;
    Suoni.ricevuto();
    Memoria.registraRicerca(pulisciTitolo(brano.titolo), brano.autore);
    Coda.imposta([brano], 'brano');
    await Voce.parla(Annunci.apertura(brano));
    if (mioId !== Esecutore._idRichiesta) return;
    Coda.prossima();
  }
};

/** Estrae il nome dell'artista da un motivo tipo "artista:Nino D'Angelo"
 *  (usato da ListaDaGemini.avviaSoloArtista per i messaggi d'errore). */
function nomeArtistaDaMotivo(motivo) {
  const m = String(motivo || '').match(/^artista:(.+)$/);
  return m ? m[1] : 'questo artista';
}

const ListaDaGemini = {
  /** Cerca i brani proposti da Gemini su YouTube e costruisce i risultati
   *  nel formato atteso da Lista.contesto.
   *  @returns {Promise<object[]>} array di brani {id, titolo, autore, anno, durataSec, ...} */
  async cercaSuYouTube(brani) {
    const trovati = [];
    const visti = new Set();
    // 10/11/2026: le ricerche partono TUTTE INSIEME (prima una alla volta: con 10
    // canzoni Domenico aspettava 10 ricerche in fila). L'ordine resta quello di Gemini.
    const t0 = Date.now();
    // 3 alla volta: veloce, ma senza raffiche che fanno rispondere 429 a YouTube.
    const esiti = new Array(brani.length);
    let prossimo = 0;
    const lavoratore = async () => {
      while (prossimo < brani.length) {
        const i = prossimo++;
        const b = brani[i];
        esiti[i] = await Ricerca.cerca(b.titolo + ' ' + b.artista + ' official audio', 'riproduci')
          .catch(() => ({ risultati: [] }));
      }
    };
    await Promise.all([lavoratore(), lavoratore(), lavoratore()]);
    log('⏱️ ' + brani.length + ' ricerche YouTube in ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');
    for (let i = 0; i < brani.length; i++) {
      const b = brani[i];
      // Query mirata: titolo + artista, e "official audio" per preferire
      // la versione originale al posto di cover o remix.
      const { risultati } = esiti[i] || {};
      if (!risultati || !risultati.length) continue;
      // Prendiamo il primo risultato pertinente (ordinaPerPertinenza
      // premia i canali ufficiali e la durata 90-480s).
      const migliore = Ricerca.ordinaPerPertinenza(risultati, b.titolo)[0];
      if (!migliore) continue;
      const chiave = normalizza(migliore.id);
      if (visti.has(chiave)) continue;
      visti.add(chiave);
      // Forziamo autore e anno da Gemini (più affidabili del titolo YouTube).
      migliore.autore = b.artista;
      migliore.anno = b.anno || migliore.anno;
      trovati.push(migliore);
    }
    log('🔎 ListaDaGemini: ' + trovati.length + ' video trovati su YouTube');
    return trovati;
  },

  /** Chiede a Gemini una playlist per un nome d'artista "nudo" (senza titolo,
   *  Ricerca.sembraSoloNomeArtista(risultati) l'ha già rilevato): le sue hit più
   *  famose, in ordine di popolarità, invece della coda automatica di 5 brani. */
  async avviaSoloArtista(nomeArtista) {
    if (!settings.geminiApiKey || !settings.usaGeminiPerPlaylist) return false;
    const richiesta = 'Le canzoni più famose e rappresentative di ' + nomeArtista +
                      ', in ordine di popolarità. Solo brani realmente esistenti di questo artista.';
    // 10/11/2026: niente lista da scegliere col numero: partono subito, in fila.
    return this.suonaSubito(richiesta, 'artista:' + nomeArtista, {});
  },

  /** Nucleo comune a avvia() e avviaSoloArtista(): Gemini → YouTube → Lista.
   *  @returns {Promise<boolean>} true se la richiesta è stata gestita (lista letta,
   *  o errore già comunicato a voce); false se bisogna ricadere sulla ricerca diretta. */
  async _eseguiLista(richiesta, motivo, opz) {
    const mioId = Esecutore._idRichiesta;
    // Cerchiamo su YouTube solo quante canzoni servono per la prima pagina:
    // ogni ricerca costa 100 unità della quota giornaliera dell'API YouTube
    // (di norma 10.000/giorno = circa 99 ricerche dirette). Prima si
    // chiedevano sempre almeno 20 brani a Gemini e si cercavano TUTTI su
    // YouTube, anche se solo settings.listaPagina (di norma 10) venivano
    // lette subito — uno spreco che con uso normale esaurisce in fretta la
    // quota. Se il nipote chiede "ancora" oltre a quanto già cercato,
    // sentirà "Non ci sono altre canzoni" invece di una seconda pagina
    // pronta all'istante (vedi Lista._leggiPagina).
    const quanti = settings.listaPagina;
    log('🧠 ' + motivo + ' → chiedo a Gemini: "' + richiesta + '"');
    const { brani, errore } = await chiediListaBraniAGemini(richiesta, quanti, opz);
    if (mioId !== Esecutore._idRichiesta) return true;
    if (errore === 'chiave_mancante' || !brani.length) return false;
    setStatus('Preparo la lista...');
    const trovati = await this.cercaSuYouTube(brani);
    if (mioId !== Esecutore._idRichiesta) return true;
    if (!trovati.length) {
      Suoni.errore();
      await Voce.parla('Non ho trovato le canzoni di ' + nomeArtistaDaMotivo(motivo) + '.');
      return true;
    }
    if (trovati.length === 1) {
      // 10/11/2026: una sola canzone trovata → parte e basta (niente "quale vuoi?").
      Coda.imposta(trovati, 'brano');
      await Attesa.finisci();
      if (mioId !== Esecutore._idRichiesta) return true;
      await Voce.parla(Annunci.apertura(trovati[0]));
      if (mioId !== Esecutore._idRichiesta) return true;
      Coda.prossima();
      return true;
    }
    Lista.contesto = { brani: trovati, offset: 0, scadenza: 0 };
    await Attesa.finisci();
    if (mioId !== Esecutore._idRichiesta) return true;
    await Lista._leggiPagina();
    return true;
  },

  /** 10/11/2026: Gemini sceglie le canzoni e partono SUBITO (niente lista letta).
   *  Usato da "a piacere", "novità" e "canzoni del momento".
   *  @returns {Promise<boolean>} false se Gemini non ha risposto. */
  async suonaSubito(richiesta, motivo, opz) {
    const mioId = Esecutore._idRichiesta;
    log('🧠 ' + motivo + ' → chiedo a Gemini: "' + richiesta + '"');
    const { brani, errore } = await chiediListaBraniAGemini(richiesta, 10, opz);
    if (mioId !== Esecutore._idRichiesta) return true;
    if (errore === 'chiave_mancante' || !brani.length) return false;
    setStatus('Preparo le canzoni...');
    // 11/11/2026 (ricerca pigra): si cerca su YouTube SOLO la prima canzone (max 3 tentativi
    // se non si trova); le altre restano in Coda.daCercare e si cercano una alla volta,
    // sempre una pronta in anticipo. Prima: 8 ricerche = 800 unità a ogni "a piacere".
    const escludi = Memoria.idSaltatiValidi();
    Memoria.braniSessione.forEach(id => escludi.add(id));
    let trovati = [];
    let usate = 0;
    while (usate < brani.length && usate < 3 && !trovati.length) {
      trovati = (await this.cercaSuYouTube([brani[usate]])).filter(b => !escludi.has(b.id));
      usate++;
      if (mioId !== Esecutore._idRichiesta) return true;
    }
    if (!trovati.length) {
      Suoni.errore();
      await Voce.parla('Non ho trovato canzoni adatte, riprova tra poco.');
      return true;
    }
    Coda.imposta(trovati.slice(0, 1), 'playlist');
    Coda.daCercare = brani.slice(usate);          // le altre: si cercano solo se servono
    await Attesa.finisci();
    if (mioId !== Esecutore._idRichiesta) return true;
    await Voce.parla(Annunci.apertura(trovati[0]));
    if (mioId !== Esecutore._idRichiesta) return true;
    Coda.prossima();                               // parte e prepara (solo) la prossima
    return true;
  },

  /** Punto d'ingresso: richiesta libera → lista numerata pronta per Lista. */
  async avvia(richiesta, intent, opz) {
    if (!opz && richiestaAttuale(richiesta)) opz = { web: true, gusti: true };
    const gestito = await this._eseguiLista(richiesta, 'playlist', opz);
    if (gestito) return;
    log('⚠️ Fallback alla ricerca YouTube diretta');
    return Lista.avvia(richiesta, intent);
  }
};

// ------------------------------------------------------------
// 17. ESECUTORE (riceve le decisioni ed esegue; nessuna conferma)
// ------------------------------------------------------------
const Esecutore = {
  _idRichiesta: 0,           // invalida i risultati arrivati in ritardo (R12)
  _occupato: 0,              // quante ricerche/chat sono in corso
  _ultimoFermoVuoto: 0,      // ts dell'ultimo "Fermo." detto a vuoto (BUG 4)

  /** Punto d'ingresso unico dal Listener. */
  riceviFrase(frase) {
    if (!Sessione.attiva) return;
    const d = Classificatore.classifica(frase, Sessione.contesto());
    log('🎯 ' + d.tipo + (d.azione ? '/' + d.azione : '') + (d.intent ? '/' + d.intent : '') +
        (d.query ? ' "' + d.query + '"' : '') + ' — ' + d.motivo);
    if (d.tipo === 'RUMORE') return;
    try { Cronologia.richiesta(d.testo || frase.testo || '', d); } catch (e) {}
    Sessione.segnalaAttivita();
    Promise.resolve()
      .then(() => this.esegui(d, frase))
      .catch(e => log('❌ Errore eseguendo: ' + (e && e.message)));
  },

  /** Smista la decisione. Restituisce la promessa dell'azione (utile nei test). */
  esegui(decisione, frase) {
    const d = decisione;
    if (d.tipo === 'COMANDO') return this.eseguiComando(d);
    if (d.tipo === 'RICERCA') {
      // Un titolo della lista appena letta vince sulla nuova ricerca.
      if (d.intent === 'riproduci' && Lista.attiva() && Lista.scegliPerTitolo(d.query || d.testo)) return;
      // Revisione finale: frase simile all'eco della lista che NON è un suo titolo → ignorata.
      if (d.soloTitoloLista) { log('🔇 Somiglia all\'eco della lista e non è un titolo: ignorata'); return; }
      Lista.chiudi();
      return this.eseguiRicerca(d, frase);
    }
    if (d.tipo === 'CHAT') { Lista.chiudi(); return this.eseguiChat(d.testo); }
  },

  /** Comandi: stop, trasporto, info, lista. */
  eseguiComando(d) {
    const az = d.azione;
    if (az !== 'LISTA_NUMERO' && az !== 'LISTA_ANCORA' &&
        az !== 'LISTA_TUTTI' && az !== 'LISTA_RIPETI' && az !== 'LISTA_PAUSA') Lista.chiudi();
    const st = Player.stato();
    switch (az) {
      case 'STOP':
        return this.stop(false);

      case 'SPEGNI':
        return this.spegni();

      case 'PAUSA':
        if (st === 'suona' || st === 'caricamento') { Suoni.ricevuto(); Player.pausa(); return; }
        Suoni.errore();
        return;

      case 'RIPRENDI':
        if (st === 'pausa') { Suoni.ricevuto(); Player.riprendi(); return; }
        Suoni.errore();
        return Voce.parla("Non c'è niente da riprendere.");

      case 'SALTA':
        return this._salta();

      case 'INDIETRO':
        if (Coda.indice > 0) { Suoni.salto(); Coda.precedente(); return; }
        Suoni.errore();
        return;

      case 'VOLUME_SU':
        Suoni.volumeSu(); Player.volumeSu();
        return;

      case 'VOLUME_GIU':
        Suoni.volumeGiu(); Player.volumeGiu();
        return;

      case 'DI_NUOVO': {
        const brano = Player.branoCorrente() || Coda.attuale() || Memoria.ultimoBrano;
        if (!brano) { Suoni.errore(); return Voce.parla('Non ricordo quale.'); }
        Suoni.ricevuto();
        Player.riproduci(brano);
        return;
      }

      case 'UN_ALTRA':
        // 7.5: se la coda ha altri brani è come "salta".
        if (Coda.haAltri() || Coda.haDaCercare()) return this._salta();
        return this._unAltraDaRicerca();

      case 'INFO': {
        const brano = Player.branoCorrente();
        return Voce.parla(brano ? Annunci.info(brano) : 'Non sta suonando niente.');
      }

      case 'SOPRANNOME': {
        const brano = Player.branoCorrente() || Coda.attuale() || Memoria.ultimoBrano;
        if (!brano) { Suoni.errore(); return Voce.parla('Prima fammi sentire la canzone a cui vuoi dare il nome.'); }
        Soprannomi.impara(d.query, brano);
        Suoni.ricevuto();
        return Voce.parla('Va bene. Quando dici ' + d.query + ', te la metto.').then(() => { if (Player.stato() === 'pausa') Player.riprendi(); });
      }

      case 'PREF_AGGIUNGI': {
        const brano = Player.branoCorrente() || Coda.attuale() || Memoria.ultimoBrano;
        if (!brano) { Suoni.errore(); return Voce.parla('Prima fammi sentire una canzone.'); }
        if (brano.radio) {
          Suoni.errore();
          return Voce.parla('Questa è la radio. Se ti piace la canzone, dimmi il titolo e te la cerco.')
            .then(() => { if (Player.stato() === 'pausa') Player.riprendi(); });
        }
        Preferiti.aggiungi(brano);
        Gusti.registraRichiesta(brano.autore);
        Suoni.ricevuto();
        return Voce.parla('Aggiunta ai preferiti.').then(() => { if (Player.stato() === 'pausa') Player.riprendi(); });
      }

      case 'PREF_TOGLI': {
        const brano = Player.branoCorrente() || Coda.attuale() || Memoria.ultimoBrano;
        if (!brano) { Suoni.errore(); return Voce.parla('Non so quale canzone.'); }
        const cera = Preferiti.togli(brano);
        Memoria.registraSalto(brano, 0);   // non rientra nelle code per 30 giorni
        Suoni.ricevuto();
        return Voce.parla(cera ? 'Tolta dai preferiti.' : 'Va bene, non te la rimetto.').then(() => {
          if (Coda.haAltri() || Coda.haDaCercare()) return this._salta();
          if (Player.stato() === 'pausa') Player.stop();
        });
      }

      case 'LISTA_NUMERO':
        return Lista.scegliNumero(d.numero);

      case 'LISTA_ANCORA':
        return Lista.prossimaPagina();

      case 'LISTA_TUTTI':
        return Lista.suonaTutte();

      case 'LISTA_RIPETI':
        return Lista.ripeti();

      case 'LISTA_PAUSA':
        // Zittisce ASIA subito (interrompe _leggiPagina in corso) SENZA chiudere la
        // lista: Domenico può ancora scegliere un numero, dire "tutte" o "ancora".
        Suoni.ricevuto();
        Voce.interrompi();
        return;
    }
  },

  /** Ricerca musicale: coda di artista (5 titoli diversi) o brano preciso.
   *  d.origine === 'altra' (interno, da "un'altra") esclude TUTTI i brani di sessione. */
  async eseguiRicerca(d, frase) {
    const mioId = ++this._idRichiesta;
    this._occupato++;
    try {
      Suoni.ricevuto();
      setStatus('Cerco...');
      Attesa.avvia();

      if (d.intent === 'preferiti') {
        await this._eseguiPreferiti(d);
        return;
      }

      if (d.intent === 'radio') {
        const r = await Radio.trova(d.query);
        if (mioId !== this._idRichiesta) return;
        if (!r) {
          // non è una radio (es. "metti Radio Ga Ga"): allora è una canzone
          log('📻 Nessuna radio "' + d.query + '": la cerco come canzone');
          d = Object.assign({}, d, { intent: 'riproduci', query: estraiQueryRicerca(d.testo.replace(RE_VERBI_EXTRA, ''), 'riproduci') });
        } else {
          const b = Radio.comeBrano(r);
          Coda.imposta([b], 'radio');
          await Attesa.finisci();
          if (mioId !== this._idRichiesta) return;
          await Voce.parla('Ecco ' + r.nome + '.');
          if (mioId !== this._idRichiesta) return;
          Coda.prossima();
          return;
        }
      }

      if (d.intent === 'playlistYT' && d.playlist) {
        const { brani, errore } = await leggiPlaylistYouTube(d.playlist);
        if (mioId !== this._idRichiesta) return;
        if (!brani.length) {
          Attesa.ferma();
          Suoni.errore();
          await Voce.parla(errore === 'chiave_mancante' ? 'Manca la chiave di YouTube nelle impostazioni.'
            : 'Non riesco ad aprire la playlist ' + d.query + '.');
          return;
        }
        Coda.imposta(brani, 'playlist');
        await Attesa.finisci();
        if (mioId !== this._idRichiesta) return;
        await Voce.parla('Ecco ' + d.query + ', ' + brani.length + (brani.length === 1 ? ' canzone. ' : ' canzoni. ') + Annunci.apertura(brani[0]));
        if (mioId !== this._idRichiesta) return;
        Coda.prossima();
        return;
      }

      if (d.intent === 'soprannome' && d.brano) {
        Attesa.ferma();
        Coda.imposta([d.brano], 'brano');
        await Voce.parla(Annunci.apertura(d.brano));
        if (mioId !== this._idRichiesta) return;
        Coda.prossima();
        return;
      }

      if (d.intent === 'piacere' || d.intent === 'novita' || d.intent === 'momento') {
        await this._eseguiSpeciale(d);
        return;
      }

      if (d.intent === 'lista' || d.intent === 'top') {
        // Se c'è Gemini configurato, proviamo prima il percorso intelligente:
        // Gemini interpreta la richiesta e produce una lista di brani, poi
        // cerchiamo ogni brano su YouTube. Se Gemini non c'è o fallisce,
        // ListaDaGemini fa da solo il fallback a Lista.avvia().
        if (settings.geminiApiKey) {
          await ListaDaGemini.avvia(d.testo || d.query, d.intent);
        } else {
          await Lista.avvia(d.query, d.intent);
        }
        return;
      }

      const origineAltra = d.origine === 'altra';
      let query = d.query;
      // 10/11/2026: canzone già suonata? Allora niente YouTube (anche se Chrome ha capito
      // qualche lettera diversa dalla volta prima).
      const giaSentita = !origineAltra && Storico.trova(query);
      if (giaSentita) {
        log('🗂️ Già suonata, la rimetto senza cercare: ' + pulisciTitolo(giaSentita.titolo));
        const b = Preferiti._copia(giaSentita);
        Memoria.registraRicerca(query, b.autore);
        Coda.imposta([b], 'brano');
        await Attesa.finisci();
        if (mioId !== this._idRichiesta) return;
        await Voce.parla(Annunci.apertura(b));
        if (mioId !== this._idRichiesta) return;
        Coda.prossima();
        return;
      }
      let { risultati, errore } = await Ricerca.cerca(query, 'riproduci');
      if (mioId !== this._idRichiesta) return;
      if (errore === 'chiave_mancante') { this._avvisaErroreRicerca(errore, query); return; }

      // Ripiego sulle altre trascrizioni: al massimo 2 tentativi (R14).
      // Solo se la ricerca non ha dato risultati per un problema di TESTO
      // (parola sbagliata/non trovata): se invece "errore" è valorizzato
      // (rete/quota YouTube, chiave mancante...) il problema non dipende
      // dalla trascrizione e riprovare con altre trascrizioni fallirebbe
      // comunque, sprecando tempo e (soprattutto in caso di HTTP 429) altre
      // chiamate all'API già limitata.
      if (!risultati.length && !errore && frase && !origineAltra) {
        const provate = new Set([normalizza(query)]);
        let tentativi = 0;
        for (const alt of (frase.alternative || [])) {
          if (tentativi >= 2) break;
          const pulita = Classificatore._togliPrefissoAsia(alt).testo.replace(RE_VERBI_EXTRA, '');
          const q = estraiQueryRicerca(pulita, 'riproduci');
          if (!q || provate.has(normalizza(q))) continue;
          provate.add(normalizza(q));
          tentativi++;
          log('🔁 Provo la trascrizione alternativa "' + q + '"');
          const r2 = await Ricerca.cerca(q, 'riproduci');
          if (mioId !== this._idRichiesta) return;
          if (r2.risultati.length) { risultati = r2.risultati; errore = null; query = q; break; }
        }
      }

      if (!risultati.length) { this._avvisaErroreRicerca(errore, query); return; }

      let coda, origine, artista;
      if (!origineAltra && Ricerca.sembraSoloNomeArtista(risultati) &&
          settings.geminiApiKey && settings.usaGeminiPerPlaylist) {
        log('🎤 Solo artista rilevato: chiedo a Gemini le hit di ' + query);
        const gestito = await ListaDaGemini.avviaSoloArtista(query);
        if (mioId !== this._idRichiesta) return;
        if (gestito) return;
      }
      if (origineAltra || Ricerca.sembraSoloNomeArtista(risultati)) {
        const escludi = Memoria.idSaltatiValidi();
        let escludiTitoli = new Set();
        if (origineAltra) {
          Memoria.braniSessione.forEach(id => escludi.add(id));
          escludiTitoli = new Set(Memoria.titoliSessione);
        }
        coda = Ricerca.costruisciCoda(risultati, query, { escludi, escludiTitoli, max: 5 });
        // Se i "saltati" hanno svuotato tutto, meglio riproporli che non suonare niente
        // (ma MAI per "un'altra": lì si escludono sempre i brani già sentiti).
        if (!coda.length && !origineAltra) coda = Ricerca.costruisciCoda(risultati, query, { max: 5 });
        origine = origineAltra ? 'altra' : 'artista';
        artista = origineAltra ? null : query;
      } else {
        const ordinati = Ricerca.ordinaPerPertinenza(risultati, query);
        // copie: i risultati stanno anche nella memoria delle ricerche, non vanno modificati
        const migliore = ordinati[0] ? Object.assign({}, ordinati[0]) : null;
        // 10/11/2026: altre versioni della stessa canzone, se YouTube rifiuta la prima
        if (migliore) migliore._riserve = ordinati.slice(1, 4).filter(r => r.id !== migliore.id).map(r => Object.assign({}, r));
        coda = migliore ? [migliore] : [];
        origine = 'brano';
        artista = migliore ? migliore.autore : null;
      }

      if (!coda.length) {
        Suoni.errore();
        await Voce.parla(origineAltra ? 'Non ne trovo altre di ' + query + '.' : 'Non trovo ' + query + '.');
        return;
      }

      Memoria.registraRicerca(query, artista);
      Coda.imposta(coda, origine);
      await Attesa.finisci();
      if (mioId !== this._idRichiesta) return;
      await Voce.parla(Annunci.apertura(coda[0]));     // 7.13: annuncio PRIMA della musica
      if (mioId !== this._idRichiesta) return;
      Coda.prossima();
    } finally {
      this._occupato--;
      Attesa.ferma();
    }
  },

  /** 10/11/2026: i preferiti, in fila e mescolati (o letti come lista se richiesto). */
  async _eseguiPreferiti(d) {
    const mioId = this._idRichiesta;
    const brani = Preferiti.elenco().map(v => Preferiti._copia(v));
    if (!brani.length) {
      Suoni.errore();
      await Voce.parla('Non hai ancora canzoni preferite. Quando una ti piace, premi AVVIA e dimmi: questa mi piace.');
      return;
    }
    if (d.leggi) {
      Lista.contesto = { brani, offset: 0, scadenza: 0 };
      await Lista._leggiPagina();
      return;
    }
    for (let i = brani.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [brani[i], brani[j]] = [brani[j], brani[i]];
    }
    Coda.imposta(brani, 'playlist');
    await Voce.parla('I tuoi preferiti, ' + brani.length + (brani.length === 1 ? ' canzone. ' : ' canzoni. ') + Annunci.apertura(brani[0]));
    if (mioId !== this._idRichiesta) return;
    Coda.prossima();
  },

  /** 10/11/2026: "a piacere", "novità", "canzoni del momento" (tutte via Gemini). */
  async _eseguiSpeciale(d) {
    if (!settings.geminiApiKey) {
      const pref = d.intent === 'piacere' ? Gusti.artistiPreferiti(5) : [];
      if (pref.length) {
        const a = pref[Math.floor(Math.random() * pref.length)];
        log('🎲 A piacere senza Gemini: ' + a.nome);
        return this.eseguiRicerca({ tipo: 'RICERCA', intent: 'riproduci', query: a.nome, motivo: 'a piacere', testo: a.nome });
      }
      Suoni.errore();
      await Voce.parla('Per questa richiesta mi serve la chiave Gemini nelle impostazioni.');
      return;
    }
    const nome = settings.nomeUtente || 'chi ascolta';
    const conGusti = !!testoGusti();
    let richiesta, opz;
    if (d.intent === 'piacere') {
      const giaSentite = [...Memoria.titoliSessione].slice(-15).join('; ');
      richiesta = 'Scegli canzoni da far ascoltare adesso a ' + nome + ', a sorpresa ma che gli piacciano. ' +
        'Gli piacciono TUTTI i generi e cerca sempre canzoni nuove da scoprire: mescola successi recenti e ' +
        'canzoni vecchie famose (anni 60, 70, 80, 90, 2000), generi e cantanti diversi. ' +
        (conGusti
          ? 'Parti dai suoi gusti: due o tre delle sue preferite, il resto canzoni simili o di quegli anni che forse non conosce ancora. '
          : 'Non conosci ancora i suoi gusti: scegli grandi successi, italiani e internazionali, adatti a tutta la famiglia. ') +
        'Soprattutto musica italiana; brani in inglese vanno bene.' +
        (giaSentite ? ' Non ripetere queste, già sentite adesso: ' + giaSentite + '.' : '');
      opz = { gusti: true };
    } else if (d.intent === 'novita') {
      richiesta = 'Le canzoni nuove uscite nelle ultime settimane (al massimo negli ultimi due mesi) che passano in radio e in TV, ' +
        'soprattutto italiane e qualcuna internazionale. Richiesta originale: "' + d.testo + '".';
      opz = { web: true, gusti: true };
    } else {
      richiesta = d.testo + ' (classifica attuale in Italia per il periodo richiesto: radio, TV, Spotify).';
      opz = { web: true, gusti: true };
    }
    if (d.leggi) { await ListaDaGemini.avvia(richiesta, 'top', opz); return; }
    const gestito = await ListaDaGemini.suonaSubito(richiesta, d.intent, opz);
    if (!gestito) {
      Suoni.errore();
      await Voce.parla('Adesso non riesco a trovare le canzoni, riprova tra poco.');
    }
  },

  /** Chiacchierata con Gemini (con ducking se c'è musica, 7.15). */
  async eseguiChat(testo) {
    const mioId = ++this._idRichiesta;
    this._occupato++;
    try {
      Suoni.ricevuto();
      setStatus('Ci penso un attimo...');
      const r = await Chat.chiedi(testo);
      if (mioId !== this._idRichiesta) return;
      if (r.errore === 'chiave_mancante') {
        await Voce.parla('Per parlare con me servirebbe la chiave Gemini nelle impostazioni. Nel frattempo posso solo cercarti canzoni.');
        return;
      }
      if (r.errore) { Suoni.errore(); await Voce.parla('Scusa, non riesco a risponderti adesso.'); return; }
      await Voce.parla(r.testo);
    } finally {
      this._occupato--;
    }
  },

  /** "stop" (voce o pulsante): annulla ricerche in corso, ferma musica, coda e lista.
   *  La sessione RESTA attiva.
   *  BUG 4: se non c'era niente da fermare e l'ultimo "Fermo." è recentissimo, non lo
   *  ripete — altrimenti il microfono può ricatturare la propria eco di "Fermo." (che
   *  è anche una parola del vocabolario di stop) e ripeterlo all'infinito. La PRIMA
   *  volta (anche a vuoto) "Fermo." si sente sempre, per dare comunque conferma. */
  stop(daPulsante) {
    Attesa.ferma();
    log('--- STOP (' + (daPulsante ? 'pulsante' : 'voce') + ') ---');
    const cEraQualcosa = Voce.staParlando() || Player.stato() !== 'fermo' ||
      Coda.brani.length > 0 || !!Lista.contesto || this._occupato > 0;
    // 10/11/2026: "stop" mentre ASIA sta ancora cercando (la musica non è partita):
    // si annulla la ricerca e ASIA è subito pronta per un'altra richiesta.
    const stavaCercando = this._occupato > 0 && Player.stato() === 'fermo';
    this._idRichiesta++;
    Voce.interrompi();
    Suoni.ricevuto();
    Player.stop();
    Coda.svuota();
    Lista.chiudi();
    if (Sessione.attiva) {
      if (!cEraQualcosa) {
        // Revisione finale: vale anche dopo un "Fermo." NON a vuoto (il caso più comune:
        // "stop" con la musica → "Fermo." → eco "fermo" → prima si ripeteva una volta).
        const ecoDiFermo = Voce.ultimoTesto === 'Fermo.' &&
          Date.now() - Voce.fineUltimoParlato < Classificatore.FINESTRA_ECO_MS;
        if (!daPulsante && (ecoDiFermo || Date.now() - this._ultimoFermoVuoto < Classificatore.FINESTRA_ECO_MS)) return;
        this._ultimoFermoVuoto = Date.now();
      } else {
        this._ultimoFermoVuoto = 0;
      }
      if (stavaCercando) { Suoni.pronto(); return Voce.parla('Va bene. Dimmi pure.'); }
      return Voce.parla('Fermo.');
    }
    setStatus(settings.messaggioAttesa);
  },

  /** "spegni"/"buonanotte"/"chiudi tutto": ferma tutto e chiude la sessione (o,
   *  a sessione già chiusa, prova a chiudere la scheda/app). */
  spegni() {
    log('--- SPEGNI ---');
    this._idRichiesta++;
    Voce.interrompi();
    Player.stop();
    Coda.svuota();
    Lista.chiudi();
    if (Sessione.attiva) {
      Sessione.termina('spegni');
    } else {
      setStatus(settings.messaggioAttesa);
      setTimeout(() => { try { window.close(); } catch (e) {} }, 300);
    }
  },

  /** true se una ricerca o una chat è in corso (serve al pulsante STOP). */
  occupato() { return this._occupato > 0; },

  async _salta() {
    this._registraSaltoCorrente();
    if (Coda.haAltri()) { Suoni.salto(); Coda.prossima(); return; }
    if (Coda.haDaCercare()) {
      const ok = await Coda.riempi();
      if (ok && Coda.haAltri()) { Suoni.salto(); Coda.prossima(); return; }
    }
    // Coda finita: "salta" si comporta come "un'altra".
    return this._unAltraDaRicerca();
  },

  _registraSaltoCorrente() {
    const st = Player.stato();
    const b = Player.branoCorrente();
    // 11/11/2026: Domenico ascolta 10 secondi e cambia, anche le canzoni che ama: un salto
    // non vuol dire "non mi piace" (per escluderne una si dice "non mi piace" / "togli").
    if (!settings.saltoNonGradito) return;
    if (b && (st === 'suona' || st === 'pausa' || st === 'caricamento')) {
      Memoria.registraSalto(b, Player.secondiAscoltati());
    }
  },

  /** 7.5: coda finita + artista in memoria → nuova ricerca che esclude TUTTI i brani
   *  della sessione; nessun artista → errore + "Dimmi un cantante." */
  _unAltraDaRicerca() {
    if (!Memoria.ultimoArtista) {
      Suoni.errore();
      return Voce.parla('Dimmi un cantante.');
    }
    return this.eseguiRicerca({
      tipo: 'RICERCA', intent: 'riproduci', query: Memoria.ultimoArtista,
      origine: 'altra', motivo: "un'altra dello stesso artista"
    }, null);
  },

  /** Frase d'errore della ricerca (unico punto). */
  _avvisaErroreRicerca(errore, query) {
    Suoni.errore();
    if (errore === 'chiave_mancante') {
      return Voce.parla('Manca la chiave di YouTube nelle impostazioni. Chiedi a chi ti ha configurato Asia di inserirla.');
    }
    if (errore === 'quota') return Voce.parla('Per oggi ho finito le ricerche su YouTube. Puoi ascoltare i tuoi preferiti, oppure riproviamo domani.');
    if (errore === 'limite') return Voce.parla('YouTube mi chiede di aspettare un pochino. Riprova tra un minuto.');
    if (errore === 'rete') return Voce.parla('Non riesco a collegarmi a YouTube.');
    return Voce.parla('Non trovo ' + query + '.');
  }
};

// ------------------------------------------------------------
// 17d. SCHERMO SEMPRE ACCESO (10/11/2026)
// ------------------------------------------------------------
// Se lo schermo del tablet si spegne, Chrome chiude il microfono e ASIA non
// sente più. Finché la sessione è attiva chiediamo al tablet di tenere lo
// schermo acceso (Screen Wake Lock). Quando l'app torna in primo piano il
// blocco va richiesto di nuovo (Chrome lo toglie da solo in background).
const SchermoAcceso = {
  _blocco: null,
  async acquisisci() {
    try {
      if (!('wakeLock' in navigator) || this._blocco || document.hidden) return;
      this._blocco = await navigator.wakeLock.request('screen');
      this._blocco.addEventListener('release', () => { this._blocco = null; });
      log('💡 Schermo sempre acceso');
    } catch (e) {
      log('💡 Schermo acceso non disponibile: ' + e.message);
    }
  },
  rilascia() {
    try { if (this._blocco) this._blocco.release(); } catch (e) {}
    this._blocco = null;
  }
};

// ------------------------------------------------------------
// 18. SESSIONE (il "regista": attiva/non attiva, timer, visibilità)
// ------------------------------------------------------------
const Sessione = {
  attiva: false,
  _inizio: 0,
  _timerInattivita: null,
  _timerDurata: null,
  _ultimaDescrizione: '',

  /** Pulsante AVVIA a sessione chiusa. */
  avvia() {
    if (this.attiva) return;
    Suoni.init();
    caricaVoci();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      Suoni.errore();
      Voce.parla('Il riconoscimento vocale non funziona su questo browser. Usa Chrome.');
      return;
    }
    this.attiva = true;
    this._inizio = Date.now();
    Memoria.carica();
    Gusti.carica();
    Preferiti.carica();
    VuMeter.avvia();
    Cronologia.azzera();
    Chat.storia = [];
    Memoria.braniSessione.clear();
    Memoria.titoliSessione.clear();
    this._avviaTimerDurata();
    log('--- Sessione avviata ---');
    Suoni.pronto();
    const saluto = settings.messaggioBenvenuto.replace('{nome}', settings.nomeUtente || 'amico');
    // Prima il saluto (che mette il mic in pausa), POI il Listener: così il
    // riconoscitore non si apre per essere richiuso subito (sez. 3.2).
    Voce.parla(saluto);
    Listener.avvia();
    SchermoAcceso.acquisisci();
    this._aggiornaTimerInattivita();
    aggiornaClasseSessione();
    this.logStato();
  },

  /** Chiude la sessione. motivo: 'inattivita' | 'durata_max' | 'utente' | 'permesso' | 'errore_microfono'.
   *  7.8: allo scadere dell'ora si chiude SOLO il microfono; la musica continua. */
  termina(motivo) {
    if (!this.attiva) return;
    this.attiva = false;
    Attesa.ferma();
    if (this._timerInattivita) { clearTimeout(this._timerInattivita); this._timerInattivita = null; }
    if (this._timerDurata) { clearTimeout(this._timerDurata); this._timerDurata = null; }
    Listener.ferma();
    Lista.chiudi();
    SchermoAcceso.rilascia();
    log('--- Sessione terminata: ' + motivo + ' ---');
    let frase;
    switch (motivo) {
      case 'inattivita': frase = 'Sono qui se mi chiami.'; break;
      case 'durata_max': frase = "È passata un'ora. Per parlarmi ancora, premi AVVIA."; break;
      case 'utente':     frase = 'A dopo.'; break;
      case 'permesso':
        Suoni.errore();
        frase = 'Non posso più sentirti, chiedi aiuto per riattivare il microfono.';
        break;
      case 'spegni':
        frase = 'Buonanotte.';
        break;
      default:
        Suoni.errore();
        frase = 'Il microfono non funziona. Premi AVVIA per riprovare.';
    }
    Voce.parla(frase).then(() => { if (!this.attiva) setStatus(settings.messaggioAttesa); });
    aggiornaClasseSessione();
    this.logStato();
    if (motivo === 'spegni') {
      setTimeout(() => {
        try { window.close(); } catch (e) {}
      }, 1500);
    }
  },

  /** Azzera il conteggio dell'inattività (Domenico ha detto qualcosa di utile). */
  segnalaAttivita() {
    this._aggiornaTimerInattivita();
  },

  /** Istantanea dello stato, letta dal Classificatore. */
  contesto() {
    const st = Player.stato();
    return {
      staSuonando: st === 'suona' || st === 'caricamento',
      inPausa: st === 'pausa',
      codaHaAltri: Coda.haAltri(),
      listaAttiva: Lista.attiva(),
      listaLunghezza: Lista.lunghezza(),
      listaInLettura: Lista.inLettura(),
      artistaInMemoria: Memoria.ultimoArtista || '',
      msDaFineParlato: Voce.fineUltimoParlato ? Date.now() - Voce.fineUltimoParlato : Infinity,
      ultimoTestoParlato: Voce.ultimoTesto
    };
  },

  /** Riga compatta per il log, es. "attiva · mic aperto · suona · coda 2/5". */
  descrivi() {
    const parti = [this.attiva ? 'attiva' : 'non attiva'];
    if (Listener.r) parti.push('mic aperto');
    else parti.push('mic chiuso' + (Listener.motiviPausa.size ? ' (' + [...Listener.motiviPausa].join(', ') + ')' : ''));
    if (Voce.staParlando()) parti.push('parla');
    parti.push(Player.stato());
    parti.push('coda ' + (Coda.indice + 1) + '/' + Coda.brani.length);
    if (Lista.contesto) parti.push('lista');
    return parti.join(' · ');
  },

  /** Scrive nel log lo stato SOLO quando cambia (sostituisce la vecchia macchina a stati). */
  logStato() {
    const d = this.descrivi();
    if (d === this._ultimaDescrizione) return;
    this._ultimaDescrizione = d;
    log('📊 ' + d);
  },

  /** 7.8: i minuti di inattività NON contano mentre suona la musica o ASIA parla. */
  _aggiornaTimerInattivita() {
    if (this._timerInattivita) { clearTimeout(this._timerInattivita); this._timerInattivita = null; }
    if (!this.attiva) return;
    const st = Player.stato();
    if (Voce.staParlando() || st === 'suona' || st === 'caricamento') return;
    const ms = Math.max(1, Number(settings.minutiInattivita) || 5) * 60000;
    this._timerInattivita = setTimeout(() => {
      this._timerInattivita = null;
      const s = Player.stato();
      if (!this.attiva || Voce.staParlando() || s === 'suona' || s === 'caricamento') return;
      log('⏱️ Nessuna richiesta da ' + settings.minutiInattivita + ' minuti');
      this.termina('inattivita');
    }, ms);
  },

  _avviaTimerDurata() {
    if (this._timerDurata) clearTimeout(this._timerDurata);
    this._timerDurata = setTimeout(() => {
      this._timerDurata = null;
      this.termina('durata_max');
    }, this._durataMaxMs());
  },

  _durataMaxMs() {
    return Math.max(1, Number(settings.minutiMaxSessione) || 60) * 60000;
  },

  /** visibilitychange: in background il mic va in pausa; al ritorno si riapre da solo
   *  (se la sessione è attiva e dentro l'ora) con il suono "pronto" (7.17). */
  _suVisibilita() {
    if (document.hidden) {
      Listener.pausa('background');
      log('📱 App in background: microfono in pausa');
      return;
    }
    Listener.riprendi('background');
    if (!this.attiva) return;
    if (Date.now() - this._inizio >= this._durataMaxMs()) { this.termina('durata_max'); return; }
    log('📱 App di nuovo in primo piano');
    SchermoAcceso.acquisisci();
    Suoni.init();
    Suoni.pronto();
  }
};

// ------------------------------------------------------------
// 19. PULSANTI AVVIA E STOP (7.10)
// ------------------------------------------------------------
/** AVVIA: a sessione chiusa la apre; a sessione attiva zittisce ASIA e dà il
 *  suono "pronto" (= "ti ascolto adesso"). Se c'è musica che suona (il
 *  microfono è staccato, vedi Player._imposta), la mette in pausa: è così che
 *  si "interviene" per parlare mentre suona una canzone. */
function comandoAvvia() {
  if (!Licenza.ok) { Licenza.mostra(); return; }   // 11/11/2026: attivazione
  if (!Sessione.attiva) { log('--- AVVIA premuto ---'); Sessione.avvia(); return; }
  log('--- AVVIA a sessione attiva: ti ascolto ---');
  Voce.interrompi();
  Suoni.init();
  Suoni.pronto();
  if (Player.stato() === 'suona' || Player.stato() === 'caricamento') Player.pausa();
  Listener.riprendi('parlato');     // difensivo: nessun motivo 'parlato' orfano
  Listener.riprendi('musica');      // difensivo: nessun motivo 'musica' orfano
  Sessione.segnalaAttivita();
}
if (settings.modoUnPulsante) {
  document.getElementById('wrap-stopBtn').style.display = 'none';
  if (settings.mostraRotella === false) {
    document.getElementById('settingsBtn').style.display = 'none';
    document.getElementById('layoutBtn').style.display = 'none';
  }
  initPulsanteUnico();
} else {
  document.getElementById('startBtn').addEventListener('click', comandoAvvia);
}

if (settings.tuttoSchermoPulsante) {
  document.body.classList.add('tutto-schermo');
  aggiornaClasseSessione();
  document.body.addEventListener('click', (e) => {
    // 10/11/2026: Domenico tiene il telefono in mano e lo tocca di continuo: ASIA
    // risponde SOLO al pulsante verde (che si può ingrandire quanto si vuole con M).
    if (!settings.toccoOvunque) return;
    if (e.target.closest('#settingsView')) return;
    if (e.target.closest('#settingsBtn') || e.target.closest('#layoutBtn')) return;
    if (e.target.matches('input, textarea, select, button, a')) {
      if (e.target.closest('#startBtn')) return;
      return;
    }
    e.preventDefault();
    comandoPulsanteUnico();
  });
}

initPressioneLungaTitolo();

/** STOP fisico: se ASIA parla la zittisce (il mic si riapre); altrimenti se c'è
 *  musica (o una ricerca in corso) la ferma; altrimenti chiude la sessione.
 *  BUG 3: zittire da sola non basta quando ASIA sta leggendo l'annuncio di un
 *  brano ("Titolo, di Autore.") — la canzone parte comunque subito dopo, perché
 *  eseguiRicerca/_avviaBrano riprendono non appena l'annuncio finisce (anche se
 *  interrotto). Per questo qui si avanza SEMPRE anche il contatore _idRichiesta:
 *  è la stessa guardia di identità che quelle funzioni controllano prima di far
 *  partire la musica, quindi la riproduzione in sospeso viene annullata insieme
 *  alla voce, senza dover premere STOP due volte. */
function comandoStopManuale() {
  log('--- STOP premuto ---');
  if (Voce.staParlando()) { Esecutore._idRichiesta++; Voce.interrompi(); return; }
  if (Player.stato() !== 'fermo' || Esecutore.occupato()) { Esecutore.stop(true); return; }
  if (Sessione.attiva) { Sessione.termina('utente'); return; }
  setStatus(settings.messaggioAttesa);
}
document.getElementById('stopBtn').addEventListener('click', comandoStopManuale);

/** 10/11/2026: TASTO UNICO. Lo stesso tasto (INVIO o SPAZIO della tastiera, un
 *  pulsante fisico, o il pulsante grande sullo schermo) fa tutto:
 *    un colpo              → "ti ascolto" (o avvia ASIA)
 *    due colpi veloci      → salta alla prossima canzone
 *    tenuto giù 2 secondi  → STOP (zittisce / ferma la musica / chiude)
 *  I rimbalzi del pulsante (< 40 ms) vengono ignorati. */
const Gesti = {
  DOPPIO_MS: 450,
  LUNGO_MS: 2000,
  _giu: false, _ultimoCambio: 0, _timerLungo: null, _lungoFatto: false, _tocchi: 0, _timerTocchi: null,
  giu(fonte) {
    const ora = Date.now();
    if (this._giu || ora - this._ultimoCambio < 40) return;
    this._giu = true; this._ultimoCambio = ora; this._lungoFatto = false;
    clearTimeout(this._timerLungo);
    this._timerLungo = setTimeout(() => {
      this._timerLungo = null;
      this._lungoFatto = true;
      this._tocchi = 0;
      clearTimeout(this._timerTocchi); this._timerTocchi = null;
      log('👆 ' + fonte + ': tenuto premuto → STOP');
      comandoStopManuale();
      if (typeof aggiornaClasseSessione === 'function') aggiornaClasseSessione();
    }, this.LUNGO_MS);
  },
  su(fonte, suTre) {
    const ora = Date.now();
    if (!this._giu) return;            // il rilascio non si scarta mai (sennò partirebbe lo STOP lungo)
    this._giu = false; this._ultimoCambio = ora;
    clearTimeout(this._timerLungo); this._timerLungo = null;
    if (this._lungoFatto) return;
    this._tocchi++;
    clearTimeout(this._timerTocchi);
    this._timerTocchi = setTimeout(() => {
      const n = this._tocchi;
      this._tocchi = 0; this._timerTocchi = null;
      if (n >= 3 && suTre) { log('👆 ' + fonte + ': 3 colpi'); suTre(); return; }
      if (n >= 2 && Sessione.attiva && (Player.stato() !== 'fermo' || Coda.haAltri() || Coda.haDaCercare())) {
        log('👆 ' + fonte + ': due colpi → salta');
        Esecutore.eseguiComando({ azione: 'SALTA' });
        return;
      }
      log('👆 ' + fonte + ': un colpo → ti ascolto');
      if (settings.modoUnPulsante) comandoPulsanteUnico(); else comandoAvvia();
    }, this.DOPPIO_MS);
  }
};

/** 10/11/2026: PULSANTI FISICI. Un pulsante arcade con ESP32 collegato in Bluetooth
 *  come tastiera (o la tastiera vera) comanda ASIA senza toccare lo schermo:
 *    INVIO / SPAZIO / Play-Pausa  → "ti ascolto" (come AVVIA: mette in pausa la musica)
 *    ESC / Stop multimediale      → STOP
 *  Colpi ripetuti entro 0,7 s contano come uno solo (pulsante che rimbalza, o colpi
 *  dati con nervosismo). Ignorati mentre si scrive nelle Impostazioni. */
const TASTI_ASCOLTA = new Set(['Enter', 'NumpadEnter', ' ', 'Spacebar', 'MediaPlayPause']);
const TASTI_STOP = new Set(['Escape', 'Esc', 'MediaStop']);
let _ultimoTastoFisico = 0;
const _menuAperto = () => { const sv = document.getElementById('settingsView'); return !!(sv && sv.classList.contains('open')); };
document.addEventListener('keydown', (e) => {
  if (_menuAperto()) return;
  if (e.target && e.target.matches && e.target.matches('input, textarea, select')) return;
  // TAB non deve spostarsi su pulsanti nascosti: con ASIA si usa un tasto solo.
  if (e.key === 'Tab') { e.preventDefault(); return; }
  const ascolta = TASTI_ASCOLTA.has(e.key) || e.code === 'Space';
  const stop = TASTI_STOP.has(e.key);
  if (!ascolta && !stop) return;
  e.preventDefault();
  if (e.repeat) return;
  if (stop) {
    const ora = Date.now();
    if (ora - _ultimoTastoFisico < 700) return;
    _ultimoTastoFisico = ora;
    log('⌨️ Tasto STOP (' + e.key + ')');
    comandoStopManuale();
    return;
  }
  Gesti.giu('tasto');
});
document.addEventListener('keyup', (e) => {
  if (_menuAperto()) return;
  const ascolta = TASTI_ASCOLTA.has(e.key) || e.code === 'Space';
  if (!ascolta) return;
  e.preventDefault();
  Gesti.su('tasto');
});

/** Modalità "un pulsante solo" (Gruppo D): un tocco breve equivale ad AVVIA
 *  (a sessione chiusa) o a "ti ascolto" (a sessione attiva, come comandoAvvia). */
function comandoPulsanteUnico() {
  if (!Licenza.ok) { Licenza.mostra(); return; }   // 11/11/2026: attivazione
  if (!Sessione.attiva) { log('--- PULSANTE: avvio sessione ---'); Sessione.avvia(); aggiornaClasseSessione(); return; }
  log('--- PULSANTE: ti ascolto ---');
  Voce.interrompi();
  Suoni.init();
  Suoni.pronto();
  if (Player.stato() === 'suona' || Player.stato() === 'caricamento') Player.pausa();
  Listener.riprendi('parlato');
  Listener.riprendi('musica');
  Sessione.segnalaAttivita();
  aggiornaClasseSessione();
}

function aggiornaClasseSessione() {
  if (!settings.tuttoSchermoPulsante) return;
  document.body.classList.toggle('session-off', !Sessione.attiva);
  document.body.classList.toggle('session-on', Sessione.attiva);
  const btn = document.getElementById('startBtn');
  if (btn) btn.textContent = Sessione.attiva ? '🎤 TI ASCOLTO' : '👆 TOCCA PER INIZIARE';
}

function initPulsanteUnico() {
  const btn = document.getElementById('startBtn');
  if (!btn) return;
  // 10/11/2026: stessi gesti del tasto (un colpo / due colpi / tenuto premuto);
  // 3 colpi veloci fanno ricomparire ⚙️ e ↔️ (il menu poi chiede il PIN, se c'è).
  const rivelaConfig = () => {
    const elenco = ['settingsBtn', 'layoutBtn'];
    const qualcunoVisibile = elenco.some(id => {
      const el = document.getElementById(id);
      return el && el.style.display !== 'none';
    });
    elenco.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = qualcunoVisibile ? 'none' : '';
    });
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); Gesti.giu('pulsante'); });
  btn.addEventListener('pointerup', (e) => { e.preventDefault(); Gesti.su('pulsante', rivelaConfig); });
  btn.addEventListener('pointercancel', () => { Gesti._giu = false; clearTimeout(Gesti._timerLungo); });
  btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  btn.addEventListener('contextmenu', (e) => e.preventDefault());   // niente menu del tasto destro/pressione lunga
}

function initPressioneLungaTitolo() {
  const titolo = document.getElementById('title');
  if (!titolo) return;
  const DURATA_MS = 5000;
  let timer = null;
  let partito = false;
  const inizia = () => {
    const sv = document.getElementById('settingsView');
    if (sv && sv.classList.contains('open')) return;
    partito = false;
    titolo.classList.add('titolo-premuto');
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      partito = true;
      titolo.classList.remove('titolo-premuto');
      log('🔓 Pressione lunga sul titolo: apro le Impostazioni');
      ['settingsBtn', 'layoutBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = '';
      });
      if (typeof apriImpostazioni === 'function') apriImpostazioni();
    }, DURATA_MS);
  };
  const annulla = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    titolo.classList.remove('titolo-premuto');
  };
  titolo.addEventListener('pointerdown', inizia);
  titolo.addEventListener('pointerup', annulla);
  titolo.addEventListener('pointercancel', annulla);
  titolo.addEventListener('pointerleave', annulla);
  titolo.addEventListener('click', (e) => {
    if (partito) { partito = false; e.preventDefault(); e.stopPropagation(); }
  }, true);
}

// ------------------------------------------------------------
// 20b. SPOSTA TUTTO (10/11/2026): tasto M, come nel jukebox
// ------------------------------------------------------------
// Ogni pezzo dello schermo si trascina dove si vuole e si ingrandisce/rimpicciolisce
// in proporzione (tutto quello che c'è dentro cresce insieme). Le posizioni sono in
// percentuale dello schermo e vengono salvate SEPARATE per PC e per telefono.
const Cornice = {
  PEZZI: [
    ['title', 'Titolo'], ['wrap-startBtn', 'Pulsante AVVIA'], ['wrap-stopBtn', 'Pulsante STOP'],
    ['status', 'Scritta di stato'], ['player', 'Canzone in corso'], ['log', 'Log tecnico'],
    ['logCopyBtn', 'Copia log'], ['contatoreConsumi', 'Contatore limiti'], ['vuMeter', 'Strisca LED microfono'],
    ['cronologia', 'Elenco sessione'], ['settingsBtn', 'Rotella menu'], ['layoutBtn', 'Pulsante ↔️']
  ],
  attiva: false,
  _sel: null,
  _formato() { return (typeof innerWidth === 'number' && innerWidth < 700) ? 'telefono' : 'pc'; },
  _dati() {
    if (!settings.cornice || typeof settings.cornice !== 'object') settings.cornice = {};
    const f = this._formato();
    if (!settings.cornice[f]) settings.cornice[f] = {};
    return settings.cornice[f];
  },
  /** Mette un pezzo dove è stato salvato (se è stato spostato). */
  applicaUno(el) {
    if (!el || !el.id || !el.style) return;
    const d = this._dati()[el.id];
    if (!d) return;
    el.style.position = 'fixed';
    el.style.margin = '0';
    el.style.left = d.x + 'vw';
    el.style.top = d.y + 'vh';
    el.style.right = 'auto'; el.style.bottom = 'auto';
    if (d.w) el.style.width = d.w + 'vw';
    if (d.alt) { el.style.height = d.alt + 'vh'; if (el.tagName !== 'CANVAS' && el.tagName !== 'BUTTON') el.style.overflow = 'auto'; }
    if (el.tagName === 'DIV' && el.classList.contains('pulsante-wrap') && (d.w || d.alt)) {
      // il pulsante dentro la sua cornice segue la misura scelta
      const b = el.querySelector('button');
      if (b && b.style) { b.style.width = '100%'; if (d.alt) b.style.height = '100%'; }
    }
    el.style.transform = 'scale(' + (d.s || 1) + ')';
    el.style.transformOrigin = 'top left';
    if (d.nasc) {
      if (this.attiva) { el.classList.add('cornice-nascosto'); el.style.display = ''; }
      else el.style.display = 'none';
    } else if (el.classList) el.classList.remove('cornice-nascosto');
  },
  /** true se il pezzo è nascosto (fuori dalla modalità M). */
  nascosto(id) { const d = this._dati()[id]; return !!(d && d.nasc && !this.attiva); },
  applicaTutti() {
    if (typeof document === 'undefined') return;
    this.PEZZI.forEach(([id]) => this.applicaUno(document.getElementById(id)));
  },
  _salvaUno(el, scala) {
    const r = el.getBoundingClientRect();
    const d = this._dati();
    const vecchia = (d[el.id] && d[el.id].s) || 1;
    const s = scala || vecchia;
    const prima = d[el.id] || {};
    d[el.id] = {
      x: +(r.left / innerWidth * 100).toFixed(2),
      y: +(r.top / innerHeight * 100).toFixed(2),
      w: +((r.width / vecchia) / innerWidth * 100).toFixed(2),
      s: +s.toFixed(3)
    };
    if (prima.alt) d[el.id].alt = prima.alt;
    if (prima.nasc) d[el.id].nasc = true;
    salvaSettings();
    this.applicaUno(el);
  },

  accendi() {
    this.attiva = true;
    document.body.classList.add('cornice-edit');
    ['settingsBtn', 'layoutBtn'].forEach(id => { const b = document.getElementById(id); if (b) b.style.display = ''; });
    this.PEZZI.forEach(([id, nome]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('cornice-el');
      const et = document.createElement('div');
      et.className = 'cornice-nome';
      et.dataset.per = id;
      et.textContent = nome;
      document.body.appendChild(et);
    });
    const aiuto = document.createElement('div');
    aiuto.id = 'corniceAiuto';
    aiuto.innerHTML = '✥ <b>SPOSTA TUTTO</b> — clicca un pezzo e trascinalo · maniglie gialle = <b>più largo / più lungo</b><br>' +
                      '<b>rotellina</b> o <b>+ / −</b> = tutto più grande / più piccolo · <b>H</b> = nascondi / mostra · ' +
                      '<b>0</b> = misura originale<br><b>R</b> = rimetti tutto com\'era · <b>M</b> = fine (salva) ' +
                      '&nbsp; <span style="color:#aaa">[' + this._formato() + ']</span>';
    document.body.appendChild(aiuto);
    this._barra();
    this.applicaTutti();                // i pezzi nascosti ricompaiono trasparenti
    this._aggiornaEtichette();
    log('✥ Modalità SPOSTA TUTTO (' + this._formato() + ')');
  },
  spegni() {
    this.attiva = false;
    document.body.classList.remove('cornice-edit');
    document.querySelectorAll('.cornice-nome, #corniceAiuto, #corniceBarra, .cornice-man').forEach(e => e.remove());
    this.PEZZI.forEach(([id]) => { const el = document.getElementById(id); if (el) el.classList.remove('cornice-el', 'cornice-sel'); });
    if (settings.mostraRotella === false) ['settingsBtn', 'layoutBtn'].forEach(id => { const b = document.getElementById(id); if (b) b.style.display = 'none'; });
    this._sel = null;
    this.applicaTutti();
    log('✥ Posizioni salvate');
  },
  /** Nasconde / mostra il pezzo selezionato (tasto H o pulsante "Nascondi"). */
  nascondiSel() {
    if (!this._sel) return;
    if (!this._dati()[this._sel.id]) this._salvaUno(this._sel);
    const d = this._dati()[this._sel.id];
    d.nasc = !d.nasc;
    if (!d.nasc) this._sel.classList.remove('cornice-nascosto');
    salvaSettings();
    this.applicaUno(this._sel);
    log('✥ ' + this._sel.id + (d.nasc ? ' nascosto' : ' di nuovo visibile'));
  },
  /** Il pezzo selezionato torna alla misura originale (tasto 0 o pulsante "Originale"). */
  originaleSel() {
    if (!this._sel) return;
    const d = this._dati()[this._sel.id];
    if (d) { delete d.w; delete d.alt; d.s = 1; }
    this._sel.style.width = ''; this._sel.style.height = '';
    const b = this._sel.querySelector && this._sel.querySelector('button');
    if (b) { b.style.width = ''; b.style.height = ''; }
    this._salvaUno(this._sel, 1);
    this._aggiornaEtichette();
  },
  /** 11/11/2026: sul telefono non c'è la tastiera → barra in basso con pulsanti grandi.
   *  Finché non scegli un pezzo, i pulsanti sono spenti e la scritta spiega cosa fare. */
  _barra() {
    const vecchia = document.getElementById('corniceBarra');
    if (vecchia) vecchia.remove();
    const bar = document.createElement('div');
    bar.id = 'corniceBarra';
    bar.innerHTML = '<div class="titolo"><span class="scritta"></span><button type="button" class="giro">⇅ Sposta barra</button></div><div class="riga"></div>';
    const giro = bar.querySelector('.giro');
    giro.addEventListener('pointerdown', (e) => e.stopPropagation());
    giro.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); bar.classList.toggle('su'); });
    const riga = bar.querySelector('.riga');
    const voci = [
      ['piu',  '➕', 'Più grande', () => this._scala(this._sel, 0.1)],
      ['meno', '➖', 'Più piccolo', () => this._scala(this._sel, -0.1)],
      ['nasc', '🙈', 'Nascondi', () => this.nascondiSel()],
      ['orig', '↺', "Com'era", () => this.originaleSel()],
      ['fine', '✔', 'Fatto', () => this.spegni()]
    ];
    voci.forEach(([id, ico, testo, fn]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.id = id;
      if (id === 'fine') b.className = 'fine';
      b.innerHTML = '<span class="ico">' + ico + '</span><span class="txt">' + testo + '</span>';
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (id !== 'fine' && !this._sel) return;
        fn();
        this._aggiornaBarra();
      });
      riga.appendChild(b);
    });
    bar.addEventListener('pointerdown', (e) => e.stopPropagation());
    document.body.appendChild(bar);
    this._aggiornaBarra();
  },
  _aggiornaBarra() {
    const bar = document.getElementById('corniceBarra');
    if (!bar) return;
    const nomi = Object.fromEntries(this.PEZZI);
    const sel = this._sel;
    bar.querySelector('.scritta').textContent = sel
      ? 'Scelto: ' + (nomi[sel.id] || sel.id) + ' — trascinalo col dito'
      : '👆 Tocca un pezzo per sceglierlo';
    bar.querySelectorAll('button').forEach(b => { if (b.dataset.id !== 'fine') b.disabled = !sel; });
    const d = sel && this._dati()[sel.id];
    const nasc = bar.querySelector('button[data-id="nasc"]');
    nasc.querySelector('.ico').textContent = d && d.nasc ? '👁' : '🙈';
    nasc.querySelector('.txt').textContent = d && d.nasc ? 'Mostra' : 'Nascondi';
  },
  rimetti() {
    if (!confirm('Rimettere tutto come all\'inizio (' + this._formato() + ')?')) return;
    settings.cornice[this._formato()] = {};
    salvaSettings();
    location.reload();
  },
  _maniglie() {
    document.querySelectorAll('.cornice-man').forEach(m => m.remove());
    const el = this._sel;
    if (!this.attiva || !el) return;
    const r = el.getBoundingClientRect();
    [['dx', r.right - 8, r.top + r.height / 2 - 8], ['giu', r.left + r.width / 2 - 8, r.bottom - 8], ['ang', r.right - 8, r.bottom - 8]]
      .forEach(([tipo, x, y]) => {
        const m = document.createElement('div');
        m.className = 'cornice-man ' + tipo;
        m.dataset.tipo = tipo;
        m.style.left = x + 'px'; m.style.top = y + 'px';
        document.body.appendChild(m);
      });
  },
  _aggiornaEtichette() {
    this._maniglie();
    document.querySelectorAll('.cornice-nome').forEach(et => {
      const el = document.getElementById(et.dataset.per);
      if (!el) return;
      const r = el.getBoundingClientRect();
      et.style.display = (r.width || r.height) ? '' : 'none';
      et.style.left = Math.max(0, r.left) + 'px';
      et.style.top = Math.max(0, r.top - 18) + 'px';
    });
  },
  _pezzoDa(target) {
    for (const [id] of this.PEZZI) {
      const el = document.getElementById(id);
      if (el && (el === target || el.contains(target))) return el;
    }
    return null;
  },
  _scala(el, delta) {
    const d = this._dati()[el.id];
    const s = Math.max(0.3, Math.min(4, ((d && d.s) || 1) + delta));
    this._salvaUno(el, s);
    this._aggiornaEtichette();
  },

  init() {
    if (typeof document === 'undefined' || !document.addEventListener) return;
    let trascina = null;
    let allunga = null;
    document.addEventListener('pointerdown', (e) => {
      if (!this.attiva) return;
      if (e.target && e.target.classList && e.target.classList.contains('cornice-man') && this._sel) {
        e.preventDefault(); e.stopPropagation();
        const el = this._sel;
        if (!this._dati()[el.id]) this._salvaUno(el);
        allunga = { el, tipo: e.target.dataset.tipo, s: this._dati()[el.id].s || 1, r: el.getBoundingClientRect() };
        return;
      }
      const el = this._pezzoDa(e.target);
      if (!el) return;
      e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('.cornice-sel').forEach(x => x.classList.remove('cornice-sel'));
      el.classList.add('cornice-sel');
      this._sel = el;
      this._aggiornaBarra();
      const barra = document.getElementById('corniceBarra');
      if (barra) {
        const rr = el.getBoundingClientRect();
        barra.classList.toggle('su', (rr.top + rr.height / 2) > innerHeight / 2);   // pezzo in basso → barra in alto
      }
      if (!this._dati()[el.id]) this._salvaUno(el);      // diventa "libero" al primo tocco
      const r = el.getBoundingClientRect();
      trascina = { el, dx: e.clientX - r.left, dy: e.clientY - r.top };
    }, true);
    document.addEventListener('pointermove', (e) => {
      if (this.attiva && allunga) {
        e.preventDefault();
        const { el, tipo, s, r } = allunga;
        if (tipo !== 'giu') el.style.width = Math.max(30, (e.clientX - r.left) / s) + 'px';
        if (tipo !== 'dx') {
          el.style.height = Math.max(20, (e.clientY - r.top) / s) + 'px';
          if (el.tagName !== 'CANVAS' && el.tagName !== 'BUTTON') el.style.overflow = 'auto';
        }
        const b = el.classList.contains('pulsante-wrap') && el.querySelector('button');
        if (b) { b.style.width = '100%'; if (tipo !== 'dx') b.style.height = '100%'; }
        this._aggiornaEtichette();
        return;
      }
      if (!this.attiva || !trascina) return;
      e.preventDefault();
      trascina.el.style.left = (e.clientX - trascina.dx) + 'px';
      trascina.el.style.top = (e.clientY - trascina.dy) + 'px';
      this._aggiornaEtichette();
    }, true);
    document.addEventListener('pointerup', (e) => {
      if (!this.attiva) return;
      if (allunga) {
        const { el, tipo, s } = allunga;
        allunga = null;
        const r = el.getBoundingClientRect();
        const d = this._dati();
        d[el.id] = Object.assign(d[el.id] || {}, {
          w: +((r.width / s) / innerWidth * 100).toFixed(2),
          s
        });
        if (tipo !== 'dx') d[el.id].alt = +((r.height / s) / innerHeight * 100).toFixed(2);
        salvaSettings();
        this.applicaUno(el);
        this._aggiornaEtichette();
        e.preventDefault(); e.stopPropagation();
        return;
      }
      if (trascina) { this._salvaUno(trascina.el); trascina = null; this._aggiornaEtichette(); }
      if (this._pezzoDa(e.target)) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    document.addEventListener('click', (e) => {
      if (this.attiva && this._pezzoDa(e.target)) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    document.addEventListener('wheel', (e) => {
      if (!this.attiva) return;
      const el = this._pezzoDa(e.target) || this._sel;
      if (!el) return;
      e.preventDefault();
      this._scala(el, e.deltaY < 0 ? 0.05 : -0.05);
    }, { capture: true, passive: false });
    document.addEventListener('keydown', (e) => {
      const sv = document.getElementById('settingsView');
      if (sv && sv.classList.contains('open')) return;
      if (e.target && e.target.matches && e.target.matches('input, textarea, select')) return;
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault(); e.stopPropagation();
        if (this.attiva) this.spegni(); else this.accendi();
        return;
      }
      if (!this.attiva) return;
      e.stopPropagation();
      if (e.key === 'r' || e.key === 'R') { e.preventDefault(); this.rimetti(); return; }
      if (this._sel && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); this.nascondiSel(); return; }
      if (this._sel && e.key === '0') { e.preventDefault(); this.originaleSel(); return; }
      if (e.key === 'Escape') { e.preventDefault(); this.spegni(); return; }
      if (this._sel && (e.key === '+' || e.key === '=')) { e.preventDefault(); this._scala(this._sel, 0.05); }
      if (this._sel && (e.key === '-' || e.key === '_')) { e.preventDefault(); this._scala(this._sel, -0.05); }
      e.preventDefault();      // in modalità sposta nessun altro tasto fa partire ASIA
    }, true);
    addEventListener('resize', () => { this.applicaTutti(); if (this.attiva) this._aggiornaEtichette(); });
  }
};

// ------------------------------------------------------------
// 20. SPOSTA E RIDIMENSIONA I PULSANTI (posizione salvata nelle Impostazioni)
// ------------------------------------------------------------
function applicaLayoutPulsanti() {
  const layout = settings.layoutPulsanti || {};
  Object.keys(layout).forEach((id) => {
    const dati = layout[id];
    const wrap = document.getElementById('wrap-' + id);
    if (!wrap || !dati) return;
    wrap.style.position = 'fixed';
    wrap.style.margin = '0';
    wrap.style.left = dati.left;
    wrap.style.top = dati.top;
    wrap.style.transform = 'scale(' + (dati.scala || 1) + ')';
    wrap.style.transformOrigin = 'top left';
  });
}

function salvaLayoutPulsante(id, wrap) {
  if (!settings.layoutPulsanti) settings.layoutPulsanti = {};
  const m = /scale\(([\d.]+)\)/.exec(wrap.style.transform || '');
  settings.layoutPulsanti[id] = {
    left: wrap.style.left,
    top: wrap.style.top,
    scala: m ? parseFloat(m[1]) : 1
  };
  salvaSettings();
}

function assicuraPosizioneFissa(wrap) {
  if (wrap.style.position === 'fixed') return;
  const rect = wrap.getBoundingClientRect();
  wrap.style.position = 'fixed';
  wrap.style.margin = '0';
  wrap.style.left = rect.left + 'px';
  wrap.style.top = rect.top + 'px';
}

/** 10/11/2026: un pulsante che funziona solo TENUTO PREMUTO (di solito 3 s): il tocco
 *  veloce non fa niente, così Domenico non apre il menu per sbaglio. */
function tieniPremuto(el, ms, azione) {
  if (!el || !el.addEventListener) return;
  let timer = null;
  const annulla = () => { if (timer) { clearTimeout(timer); timer = null; } el.classList.remove('tenendo'); };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    annulla();
    el.classList.add('tenendo');
    timer = setTimeout(() => { timer = null; el.classList.remove('tenendo'); azione(); }, ms);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => {
    if (timer) setStatus('Tieni premuto ' + Math.round(ms / 1000) + ' secondi');
    annulla();
  }));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

function initLayoutPulsanti() {
  const layoutBtn = document.getElementById('layoutBtn');
  // 11/11/2026: ↔️ tenuto premuto 3 s = come il tasto M (serve sul telefono, senza tastiera).
  tieniPremuto(layoutBtn, 3000, () => {
    if (Cornice.attiva) Cornice.spegni(); else Cornice.accendi();
  });

  document.querySelectorAll('.pulsante-wrap').forEach((wrap) => {
    const id = wrap.dataset.btn;
    const handle = wrap.querySelector('.drag-handle');
    let trascinando = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

    handle.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('layout-edit')) return;
      e.preventDefault();
      trascinando = true;
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      assicuraPosizioneFissa(wrap);
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(wrap.style.left) || 0;
      origTop = parseFloat(wrap.style.top) || 0;
    });
    handle.addEventListener('pointermove', (e) => {
      if (!trascinando) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      const rect = wrap.getBoundingClientRect();
      const nuovoLeft = Math.max(0, Math.min(window.innerWidth - rect.width, origLeft + dx));
      const nuovoTop = Math.max(0, Math.min(window.innerHeight - rect.height, origTop + dy));
      wrap.style.left = nuovoLeft + 'px';
      wrap.style.top = nuovoTop + 'px';
    });
    const fineTrascinamento = () => {
      if (!trascinando) return;
      trascinando = false;
      salvaLayoutPulsante(id, wrap);
    };
    handle.addEventListener('pointerup', fineTrascinamento);
    handle.addEventListener('pointercancel', fineTrascinamento);

    wrap.querySelectorAll('.resize-handle').forEach((rh) => {
      rh.addEventListener('pointerdown', (e) => e.preventDefault());
      rh.addEventListener('click', (e) => {
        if (!document.body.classList.contains('layout-edit')) return;
        e.preventDefault(); e.stopPropagation();
        const delta = parseFloat(rh.dataset.delta) * 0.1;
        const m = /scale\(([\d.]+)\)/.exec(wrap.style.transform || '');
        const attuale = m ? parseFloat(m[1]) : 1;
        const nuova = Math.max(0.5, Math.min(2.5, attuale + delta));
        assicuraPosizioneFissa(wrap);
        wrap.style.transform = 'scale(' + nuova.toFixed(2) + ')';
        wrap.style.transformOrigin = 'top left';
        salvaLayoutPulsante(id, wrap);
      });
    });
  });
}

// ------------------------------------------------------------
// 21. PANNELLO IMPOSTAZIONI
//     Tolti (7.11): "Chiedi conferma prima di cercare", "Per dire sì", "Per dire no".
//     Tolto (7.8): "Secondi di attesa risposta" (timeoutAscolto).
