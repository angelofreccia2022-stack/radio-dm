function costruisciPannello() {
  const cont = document.getElementById('settingsContent');
  cont.innerHTML = '';
  caricaVoci();

  SCHEMA.forEach((sec, idx) => {
    const section = document.createElement('div');
    section.className = 'settings-section' + (idx === 0 ? '' : ' collapsed');

    const header = document.createElement('div');
    header.className = 'settings-section-header';
    header.innerHTML = '<span>' + sec.icona + ' ' + sec.sezione + '</span><span class="arrow">▾</span>';
    header.onclick = () => section.classList.toggle('collapsed');
    section.appendChild(header);

    const body = document.createElement('div');
    body.className = 'settings-section-body';
    sec.campi.forEach(campo => body.appendChild(creaCampo(campo)));
    section.appendChild(body);
    cont.appendChild(section);
  });
}

function creaCampo(campo) {
  const wrap = document.createElement('div');
  wrap.className = 'field';

  const label = document.createElement('label');
  label.textContent = campo.label;
  wrap.appendChild(label);

  const val = settings[campo.key];

  if (campo.tipo === 'text') {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = val || '';
    inp.oninput = () => { settings[campo.key] = inp.value; salvaSettings(); applicaStili(); };
    wrap.appendChild(inp);

  } else if (campo.tipo === 'password') {
    const inp = document.createElement('input');
    inp.type = 'password';
    inp.autocomplete = 'off';
    inp.value = val || '';
    inp.oninput = () => { settings[campo.key] = inp.value; salvaSettings(); };
    wrap.appendChild(inp);

  } else if (campo.tipo === 'textarea') {
    const ta = document.createElement('textarea');
    ta.value = val || '';
    ta.oninput = () => { settings[campo.key] = ta.value; salvaSettings(); };
    wrap.appendChild(ta);

  } else if (campo.tipo === 'checkbox') {
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.checked = !!val;
    inp.style.width = '24px'; inp.style.height = '24px';
    inp.onchange = () => { settings[campo.key] = inp.checked; salvaSettings(); applicaStili(); };
    wrap.appendChild(inp);

  } else if (campo.tipo === 'range') {
    const row = document.createElement('div');
    row.className = 'field-row';
    const inp = document.createElement('input');
    inp.type = 'range';
    inp.min = campo.min; inp.max = campo.max; inp.step = campo.step;
    inp.value = val;
    const out = document.createElement('span');
    out.className = 'field-value';
    out.textContent = formatValore(val, campo);
    inp.oninput = () => {
      const n = parseFloat(inp.value);
      settings[campo.key] = n;
      out.textContent = formatValore(n, campo);
      salvaSettings();
      if (campo.key.startsWith('font') || campo.key.startsWith('colore')) applicaStili();
    };
    row.appendChild(inp); row.appendChild(out);
    wrap.appendChild(row);

  } else if (campo.tipo === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = val;
    inp.oninput = () => { settings[campo.key] = inp.value; salvaSettings(); applicaStili(); };
    wrap.appendChild(inp);

  } else if (campo.tipo === 'qr') {
    // 11/11/2026: QR code per aprire ASIA sul telefono
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;gap:14px;align-items:center;flex-wrap:wrap;';
    const url = String(settings.indirizzoTelefono || '').trim() ||
      ((typeof location !== 'undefined' && location.protocol === 'https:') ? location.origin + location.pathname : '');
    if (url) {
      const img = document.createElement('img');
      img.alt = 'QR code di ASIA';
      img.width = 180; img.height = 180;
      img.style.cssText = 'background:#fff;padding:8px;border-radius:8px;';
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=' + encodeURIComponent(url);
      const t = document.createElement('div');
      t.style.cssText = 'font-size:14px;color:#ccc;max-width:320px;';
      t.innerHTML = 'Inquadra con la fotocamera del telefono: si apre <b>' + url.replace(/[<>&]/g, '') + '</b>.<br>' +
                    'Poi in Chrome: ⋮ → <b>Aggiungi a schermata Home</b>, così ASIA diventa un\'icona come un\'app.';
      d.appendChild(img); d.appendChild(t);
    } else {
      d.innerHTML = '<div style="font-size:14px;color:#e0c070;">Il QR code compare quando ASIA è su internet (indirizzo che inizia con https://). ' +
                    'Sul PC ASIA è solo "in casa" (localhost) e il telefono non la vede. Quando la mettiamo online, scrivi qui sopra il suo indirizzo.</div>';
    }
    wrap.appendChild(d);

  } else if (campo.tipo === 'guida') {
    const d = document.createElement('div');
    d.innerHTML = GUIDA_HTML;
    wrap.appendChild(d);

  } else if (campo.tipo === 'pulsante') {
    // Nuovo tipo ASIA 2 (usato da "Dimentica brani saltati"): un pulsante con un'azione.
    const b = document.createElement('button');
    b.textContent = campo.testo || campo.label;
    b.style.cssText = 'margin-top:4px;padding:10px 16px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;cursor:pointer;';
    b.onclick = () => { if (campo.azione) campo.azione(b); };
    wrap.appendChild(b);

  } else if (campo.tipo === 'voice') {
    const sel = document.createElement('select');
    const opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = 'Automatica (migliore disponibile)';
    sel.appendChild(opt0);
    vociDisponibili.filter(v => v.lang.startsWith('it'))
      .forEach(v => {
        const o = document.createElement('option');
        o.value = v.name;
        o.textContent = v.name + ' (' + v.lang + ')';
        if (v.name === val) o.selected = true;
        sel.appendChild(o);
      });
    sel.onchange = () => { settings[campo.key] = sel.value; salvaSettings(); };
    wrap.appendChild(sel);

    const prova = document.createElement('button');
    prova.textContent = '🔊 Prova voce';
    prova.style.cssText = 'margin-top:8px;padding:10px 16px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;cursor:pointer;';
    prova.onclick = () => {
      const u = new SpeechSynthesisUtterance('Ciao, sono Asia, la tua amica musicale.');
      u.lang = 'it-IT'; u.rate = settings.voceRate;
      u.pitch = settings.vocePitch; u.volume = settings.voceVolume;
      const v = voceItaliana(); if (v) u.voice = v;
      synth.cancel(); synth.speak(u);
    };
    wrap.appendChild(prova);
  }

  if (campo.hint) {
    const hint = document.createElement('div');
    hint.className = 'field-hint';
    hint.textContent = campo.hint;
    wrap.appendChild(hint);
  }

  return wrap;
}

function formatValore(v, campo) {
  const n = parseFloat(v);
  if (campo.step && campo.step < 1) return n.toFixed(2);
  return String(n);
}

// ------------------------------------------------------------
// 21z. ATTIVAZIONE (11/11/2026) - anti-copia
// ------------------------------------------------------------
// Ogni telefono/PC ha un suo "codice dispositivo" (es. K7QM-3XPA).
// ASIA funziona solo se trova un codice di attivazione FIRMATO per quel
// dispositivo. La firma la può fare solo il generatore che sta sul PC di
// casa (chiave segreta). Qui dentro c'è solo la chiave pubblica: serve a
// controllare la firma, non a crearla.
const Licenza = {
  ok: false,
  motivo: '',
  scadenza: '',
  CHIAVE_PUBBLICA: {"kty":"EC","crv":"P-256","x":"RYwHelw1A2Q9srK3mD1bB2hmjsKwilfgp8y2LXOArwE","y":"Li5LPqHpj4MBiNWlzymaZLw5LikglkDlXJ6mxAf-F20"},
  ALFABETO: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789',

  codiceDispositivo() {
    let c = null;
    try { c = localStorage.getItem('asia_dispositivo'); } catch (e) {}
    if (!c || !/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c)) {
      const a = this.ALFABETO; let s = '';
      const r = new Uint8Array(8);
      try { crypto.getRandomValues(r); } catch (e) { for (let i = 0; i < 8; i++) r[i] = Math.floor(Math.random() * 256); }
      for (let i = 0; i < 8; i++) s += a[r[i] % a.length];
      c = s.slice(0, 4) + '-' + s.slice(4);
      try { localStorage.setItem('asia_dispositivo', c); } catch (e) {}
    }
    return c;
  },

  _b64u(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s); const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },

  // Restituisce {ok, motivo, scadenza}
  async verifica(token) {
    try {
      token = String(token || '').trim();
      const m = token.match(/attiva=([A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)/);
      if (m) token = m[1];
      const parti = token.split('.');
      if (parti.length !== 2) return { ok: false, motivo: 'codice non valido' };
      const datiByte = this._b64u(parti[0]);
      const firma = this._b64u(parti[1]);
      const testo = new TextDecoder().decode(datiByte);
      const campi = testo.split('|');
      if (campi.length !== 3 || campi[0] !== 'ASIA1') return { ok: false, motivo: 'codice non valido' };
      if (!(window.crypto && crypto.subtle)) return { ok: false, motivo: 'questo browser non può controllare il codice (serve https)' };
      const chiave = await crypto.subtle.importKey('jwk', this.CHIAVE_PUBBLICA, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const buona = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, chiave, firma, datiByte);
      if (!buona) return { ok: false, motivo: 'codice falso o copiato male' };
      if (campi[1] !== this.codiceDispositivo()) return { ok: false, motivo: 'questo codice è di un altro dispositivo (' + campi[1] + ')' };
      if (campi[2] !== '0') {
        const oggi = new Date(); const o = oggi.getFullYear() * 10000 + (oggi.getMonth() + 1) * 100 + oggi.getDate();
        if (o > parseInt(campi[2], 10)) return { ok: false, motivo: 'attivazione scaduta il ' + campi[2].slice(6, 8) + '/' + campi[2].slice(4, 6) + '/' + campi[2].slice(0, 4) };
        return { ok: true, scadenza: campi[2].slice(6, 8) + '/' + campi[2].slice(4, 6) + '/' + campi[2].slice(0, 4) };
      }
      return { ok: true, scadenza: '' };
    } catch (e) {
      return { ok: false, motivo: 'codice non valido (' + e.message + ')' };
    }
  },

  async init() {
    // 1) codice arrivato dal QR (link ...#attiva=XXXX)
    let daLink = null;
    try {
      const h = location.hash || '';
      const m = h.match(/attiva=([A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)/);
      if (m) { daLink = m[1]; history.replaceState(null, '', location.pathname + location.search); }
    } catch (e) {}
    if (daLink) {
      const r = await this.verifica(daLink);
      if (r.ok) { try { localStorage.setItem('asia_attivazione', daLink); } catch (e) {} log('🔑 ASIA attivata da QR'); }
      else { log('🔑 Codice dal QR rifiutato: ' + r.motivo); this._motivoLink = r.motivo; }
    }
    // 2) codice già salvato
    let salvato = null;
    try { salvato = localStorage.getItem('asia_attivazione'); } catch (e) {}
    const r = salvato ? await this.verifica(salvato) : { ok: false, motivo: 'non ancora attivata' };
    this.ok = this.ok || !!r.ok; this.motivo = (!r.ok && this._motivoLink) ? this._motivoLink : (r.motivo || ''); this._motivoLink = ''; this.scadenza = r.scadenza || '';
    if (r.ok) { log('🔑 Attivazione valida' + (this.scadenza ? ' fino al ' + this.scadenza : ' (senza scadenza)')); this.nascondi(); }
    else if (!this.ok) { log('🔒 ASIA non attivata: ' + this.motivo); this.mostra(); }
    return this.ok;
  },

  mostra() {
    if (typeof document === 'undefined' || !document.body) return;
    let el = document.getElementById('licenza-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'licenza-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#0d1b2a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;overflow:auto';
      el.innerHTML =
        '<div style="font-size:44px">🔒</div>' +
        '<h2 style="margin:8px 0">ASIA non è attivata</h2>' +
        '<p style="margin:4px 0;opacity:.85">Codice di questo dispositivo:</p>' +
        '<div id="licenza-codice" style="font-size:40px;font-weight:bold;letter-spacing:4px;background:#1b263b;padding:10px 22px;border-radius:12px;margin:8px 0;user-select:all"></div>' +
        '<p style="max-width:460px;opacity:.85;margin:10px 0">Scrivi questo codice nel generatore sul PC, poi inquadra il QR che ti dà con la fotocamera del telefono.<br>Oppure incolla qui sotto il codice di attivazione:</p>' +
        '<textarea id="licenza-input" rows="3" style="width:100%;max-width:460px;font-size:14px;border-radius:8px;padding:8px" placeholder="incolla qui il codice di attivazione"></textarea>' +
        '<button id="licenza-btn" style="margin-top:12px;font-size:22px;padding:12px 30px;border:0;border-radius:12px;background:#2ecc71;color:#fff">Attiva</button>' +
        '<p id="licenza-msg" style="min-height:1.4em;margin-top:10px;color:#ffb3b3"></p>';
      document.body.appendChild(el);
      el.querySelector('#licenza-btn').addEventListener('click', async () => {
        const v = el.querySelector('#licenza-input').value;
        const r = await this.verifica(v);
        const msg = el.querySelector('#licenza-msg');
        if (r.ok) {
          const m = String(v).match(/attiva=([A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)/);
          try { localStorage.setItem('asia_attivazione', m ? m[1] : String(v).trim()); } catch (e) {}
          this.ok = true; this.scadenza = r.scadenza || '';
          log('🔑 ASIA attivata a mano');
          this.nascondi();
        } else { msg.textContent = '❌ ' + r.motivo; }
      });
    }
    el.querySelector('#licenza-codice').textContent = this.codiceDispositivo();
    el.querySelector('#licenza-msg').textContent = (this.motivo && this.motivo !== 'non ancora attivata') ? '❌ ' + this.motivo : '';
    el.style.display = 'flex';
  },

  nascondi() {
    if (typeof document === 'undefined') return;
    const el = document.getElementById('licenza-overlay');
    if (el) el.style.display = 'none';
  }
};
