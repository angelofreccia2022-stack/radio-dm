<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ASIA</title>
<style>
  :root {
    --bg: #111;
    --text: #eee;
    --accent: #7dd3a0;
    --btn-bg: #2d8f4e;
    --btn-text: #fff;
    --font-status: 28px;
    --font-button: 40px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 20px; }

  #mainView { width: 100%; max-width: 900px;
              display: flex; flex-direction: column; align-items: center;
              gap: 20px; padding-top: 30px; }
  #mainView.reversed { flex-direction: column-reverse; }

  #title { font-size: 1.6em; color: var(--accent); margin: 0; }

  #startBtn {
    font-size: var(--font-button);
    padding: 30px 60px;
    border-radius: 25px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    font-weight: bold;
    user-select: none;
    transition: transform 0.1s;
  }
  #startBtn:active { transform: scale(0.97); }

  #stopBtn {
    font-size: var(--font-button);
    padding: 30px 60px;
    border-radius: 25px;
    border: none;
    background: #a02020;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    user-select: none;
    transition: transform 0.1s;
  }
  #stopBtn:active { transform: scale(0.97); }

  #layoutBtn {
    position: fixed; top: 15px; right: 68px; z-index: 700;
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: #333; color: #fff; font-size: 20px; cursor: pointer;
  }
  #layoutBtn.attivo { background: #ffcc00; color: #111; }

  .pulsante-wrap { position: relative; display: inline-flex; }

  .drag-handle, .resize-handle {
    display: none;
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold;
    cursor: pointer; user-select: none; z-index: 800;
    touch-action: none;
  }
  body.layout-edit .drag-handle,
  body.layout-edit .resize-handle { display: flex; }
  .drag-handle { top: -20px; left: -20px; background: #4a90d9; color: #fff; }
  .resize-handle.piu { top: -20px; right: -20px; background: #2d8f4e; color: #fff; }
  .resize-handle.meno { bottom: -20px; right: -20px; background: #666; color: #fff; }
  body.layout-edit .pulsante-wrap { outline: 3px dashed #ffcc00; outline-offset: 10px; }

  #status { font-size: var(--font-status); text-align: center;
            line-height: 1.4; min-height: 3em; }

  #player { font-size: 1.3em; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 15px;
            width: 100%; min-height: 60px; text-align: center; }
  #ytPlayerDiv { position: absolute; left: -9999px; top: -9999px; width: 1280px; height: 720px; overflow: hidden; }
  #ytPlayerDiv iframe { width: 1280px !important; height: 720px !important; border: none; }

  #log { font-size: 0.85em; color: #888; text-align: left; width: 100%;
         max-height: 180px; overflow-y: auto; padding: 10px;
         background: rgba(0,0,0,0.35); border-radius: 8px;
         font-family: monospace; }
  #log.hidden { display: none; }

  #settingsBtn {
    position: fixed; top: 12px; right: 12px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 1.2em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; opacity: 0.6;
  }
  #settingsBtn:hover { opacity: 1; }

  #settingsView {
    position: fixed; inset: 0;
    background: #171717; z-index: 100;
    overflow-y: auto; padding: 20px;
    display: none;
  }
  #settingsView.open { display: block; }

  .settings-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 15px; margin-bottom: 15px;
    border-bottom: 1px solid #333;
    position: sticky; top: 0; background: #171717; z-index: 1;
  }
  .settings-header h2 { margin: 0; color: var(--accent); font-size: 1.3em; }
  .settings-header button {
    background: #333; color: #fff; border: 1px solid #555;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 1em;
  }

  .settings-section { background: #222; border-radius: 12px;
                      margin-bottom: 12px; overflow: hidden; }
  .settings-section-header {
    padding: 14px 18px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 1em; user-select: none;
  }
  .settings-section-header:hover { background: #2a2a2a; }
  .settings-section-body { padding: 0 18px 18px; display: flex;
                           flex-direction: column; gap: 14px; }
  .settings-section.collapsed .settings-section-body { display: none; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 0.9em; color: #bbb; }
  .field input[type=text], .field input[type=password], .field input[type=number],
  .field textarea, .field select {
    background: #2a2a2a; color: #fff; border: 1px solid #444;
    padding: 10px 12px; border-radius: 8px; font-size: 1em;
    font-family: inherit; width: 100%;
  }
  .field textarea { min-height: 90px; resize: vertical; font-family: monospace;
                    font-size: 0.9em; line-height: 1.5; }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .field input[type=color] { width: 60px; height: 40px; border: none;
                             background: none; cursor: pointer; padding: 0; }
  .field-row { display: flex; align-items: center; gap: 12px; }
  .field-row input[type=range] { flex: 1; }
  .field-value { min-width: 60px; text-align: right; color: var(--accent);
                 font-weight: bold; font-variant-numeric: tabular-nums; }
  .field-hint { font-size: 0.78em; color: #888; }
  .field-hint a { color: var(--accent); }

  .settings-footer {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    padding: 25px 0 10px; margin-top: 15px; border-top: 1px solid #333;
  }
  .settings-footer button {
    background: #333; color: #fff; border: 1px solid #555;
    padding: 12px 20px; border-radius: 8px; cursor: pointer;
    font-size: 0.95em; min-width: 140px;
  }
  .settings-footer button.danger { background: #6b2020; border-color: #a03030; }

  /* --- Modalità "tutto schermo è un pulsante" (telefono appoggiato) --- */
  body.tutto-schermo { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body.tutto-schermo #mainView { justify-content: center; min-height: 100vh; gap: 30px; }
  body.tutto-schermo #title { font-size: 2.4em; }
  body.tutto-schermo #status { font-size: 2em; line-height: 1.3; padding: 0 20px; max-width: 100%; }
  body.tutto-schermo #player { font-size: 1.4em; padding: 25px; }
  body.tutto-schermo #startBtn { font-size: 2.4em; padding: 40px 30px; width: 90vw; max-width: 520px; border-radius: 40px; }
  /* Il log resta governato SOLO da "Mostra log tecnico" (#log.hidden, riga 104):
     non lo nascondiamo più qui a prescindere, altrimenti chi deve fare debug non
     può più vederlo (serviva mostraLog:true, ma la modalità tutto-schermo vinceva
     comunque via CSS). */
  body.tutto-schermo.session-off #mainView { background: rgba(45, 143, 78, 0.08); }
  /* Il log deve restare selezionabile/copiabile anche in modalità tutto-schermo,
     nonostante lo user-select:none del body qui sopra (serve per non far
     selezionare per sbaglio il resto della pagina col tocco). */
  body.tutto-schermo #log, body.tutto-schermo #logCopyBtn {
    user-select: text; -webkit-user-select: text; cursor: auto;
  }
  #logCopyBtn {
    display: block; margin: 8px auto 0; background: #333; color: #fff;
    border: 1px solid #555; padding: 8px 16px; border-radius: 8px;
    font-size: 0.9em; cursor: pointer;
  }

  /* --- Pressione lunga sul titolo per aprire le Impostazioni --- */
  #title { cursor: default; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: transform 0.1s, color 0.3s; }
  #title.titolo-premuto { transform: scale(1.1); color: #ffcc00; }
  /* 10/11/2026: guida nel menu */
  .guida { font-size: 15px; line-height: 1.5; color: #ddd; }
  .guida .g-intro { background: #1f3a2a; border-left: 4px solid #3ddc84; padding: 8px 12px; border-radius: 6px; }
  .guida details { background: #1b1d21; border: 1px solid #333; border-radius: 8px; margin: 8px 0; padding: 4px 12px; }
  .guida summary { cursor: pointer; font-weight: bold; font-size: 16px; padding: 6px 0; color: #fff; }
  .guida table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .guida th, .guida td { border: 1px solid #3a3d42; padding: 5px 7px; text-align: left; vertical-align: top; }
  .guida th { background: #2a2d32; color: #ffcc00; }
  .guida code { background: #2a2d32; padding: 1px 5px; border-radius: 4px; font-size: 13px; color: #9fe0b0; }
  .guida li { margin: 4px 0; }
  /* 10/11/2026: col menu aperto spariscono i pannelli che gli stavano sopra */
  body.menu-aperto #contatoreConsumi, body.menu-aperto #vuMeter, body.menu-aperto #cronologia,
  body.menu-aperto #settingsBtn, body.menu-aperto #layoutBtn { display: none !important; }
  /* 10/11/2026: pulsanti da tenere premuti 3 secondi */
  .tenendo { transform: scale(1.4) !important; background: #ffcc00 !important; opacity: 1 !important;
             transition: transform 3s linear, background 3s linear !important; }
  /* 10/11/2026: modalità SPOSTA TUTTO (tasto M) */
  body.cornice-edit .cornice-el { outline: 2px dashed #ffcc00 !important; outline-offset: 3px;
                                  cursor: move !important; pointer-events: auto !important; }
  body.cornice-edit .cornice-el.cornice-sel { outline: 3px solid #ffcc00 !important; }
  .cornice-nome { position: fixed; z-index: 2000; background: #ffcc00; color: #000; font: bold 11px system-ui, sans-serif;
                  padding: 1px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  body.cornice-edit .cornice-el.cornice-nascosto { opacity: .28 !important; }
  .cornice-man { position: fixed; z-index: 2002; width: 16px; height: 16px; background: #ffcc00; border: 2px solid #000;
                 border-radius: 4px; box-sizing: border-box; }
  .cornice-man.dx { cursor: ew-resize; } .cornice-man.giu { cursor: ns-resize; } .cornice-man.ang { cursor: nwse-resize; }
  #corniceAiuto { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2001;
                  background: rgba(0,0,0,.85); color: #ffcc00; font: 14px/1.4 system-ui, sans-serif;
                  padding: 8px 14px; border-radius: 10px; border: 1px solid #ffcc00; text-align: center; pointer-events: none; }
  /* 11/11/2026: modalità "sposta tutto" anche col dito (telefono): barra di pulsanti */
  body.cornice-edit .cornice-el { touch-action: none !important; }
  #corniceBarra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2003; padding: 10px 10px 14px;
                  background: rgba(0,0,0,.94); border-top: 2px solid #ffcc00; font: 16px system-ui, sans-serif; color: #fff; }
  #corniceBarra .titolo { text-align: center; margin-bottom: 8px; color: #ffcc00; font-weight: 600; }
  #corniceBarra .riga { display: flex; gap: 8px; justify-content: center; }
  #corniceBarra button { flex: 1; max-width: 140px; min-height: 56px; font: 600 15px system-ui, sans-serif;
                         border-radius: 12px; border: 0; background: #333; color: #fff; touch-action: manipulation; }
  #corniceBarra button .ico { display: block; font-size: 22px; line-height: 1.1; }
  #corniceBarra button:disabled { opacity: .3; }
  #corniceBarra button.fine { background: #2e7d32; }
  @media (pointer: coarse) { #corniceAiuto { display: none !important; } }
  #corniceBarra.su { top: 0; bottom: auto; border-top: 0; border-bottom: 2px solid #ffcc00; padding: 14px 10px 10px; }
  #corniceBarra .titolo { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #corniceBarra .titolo button.giro { flex: 0 0 auto; max-width: none; min-height: 40px; padding: 0 12px;
                                      background: #ffcc00; color: #111; font-size: 15px; }
  /* 11/11/2026: sul telefono la pagina non scorre (niente barra su/giù): è un'app, non un sito */
  @media (pointer: coarse) {
    html, body { overflow: hidden !important; height: 100%; min-height: 0; overscroll-behavior: none; }
  }
  @media (pointer: coarse) { .cornice-man { width: 30px !important; height: 30px !important; } }
</style>
</head>
<body>

<button id="settingsBtn" aria-label="Impostazioni" title="Impostazioni">⚙️</button>
<button id="layoutBtn" aria-label="Sposta e ridimensiona i pulsanti" title="Sposta e ridimensiona i pulsanti">↔️</button>

<div id="mainView">
  <h1 id="title">🎵 ASIA</h1>

  <div class="pulsante-wrap" id="wrap-startBtn" data-btn="startBtn">
    <span class="drag-handle" title="Trascina per spostare">✥</span>
    <span class="resize-handle meno" data-delta="-1" title="Rimpicciolisci">−</span>
    <span class="resize-handle piu" data-delta="1" title="Ingrandisci">+</span>
    <button id="startBtn">AVVIA</button>
  </div>

  <div class="pulsante-wrap" id="wrap-stopBtn" data-btn="stopBtn">
    <span class="drag-handle" title="Trascina per spostare">✥</span>
    <span class="resize-handle meno" data-delta="-1" title="Rimpicciolisci">−</span>
    <span class="resize-handle piu" data-delta="1" title="Ingrandisci">+</span>
    <button id="stopBtn">STOP</button>
  </div>

  <div id="status">Premi AVVIA per iniziare</div>
  <div id="player">
    <div id="playerInfo">Nessuna canzone in riproduzione.</div>
    <div id="ytPlayerDiv"></div>
  </div>
  <div id="log"></div>
  <button id="logCopyBtn" type="button">📋 Copia log</button>
</div>

<div id="settingsView">
  <div class="settings-header">
    <h2>⚙️ Impostazioni ASIA</h2>
    <button id="closeSettings">Chiudi</button>
  </div>
  <div id="settingsContent"></div>
  <div class="settings-footer">
    <button id="resetSettings" class="danger">Ripristina default</button>
    <button id="exportSettings">Esporta</button>
    <button id="importSettings">Importa</button>
  </div>
</div>

<script>
// ============================================================
// ASIA 2.0 - Assistente vocale musicale per Domenico
// Ricerca e riproduzione reali su YouTube + conversazione con Gemini.
//
// Modello a "flusso continuo" (vedi ARCHITETTURA_ASIA_2.0.md):
//   Listener (microfono unico) → Classificatore (funzione pura) → Esecutore.
// Niente modalità, niente conferme. Lo stato vero è in quattro posti soltanto:
//   Sessione.attiva · Voce.staParlando() · Player.stato() · Coda (brani + indice).
// Il microfono è aperto se e solo se: sessione attiva E nessun motivo di pausa
// ('parlato', 'background', 'impostazioni').
// ============================================================

// ------------------------------------------------------------
// 1. IMPOSTAZIONI: default + caricamento/salvataggio
// ------------------------------------------------------------
const STORAGE_KEY = 'asia_settings_v1';

const DEFAULT_SETTINGS = {
  nomeUtente: '',
  layoutPulsanti: {},
  messaggioBenvenuto: 'Ciao {nome}, sono Asia. Quale canzone vuoi ascoltare oggi?',
  // 10/11/2026: chi è Domenico per l'"amichetto" (lo scrive e lo cambia il nonno).
  descrizioneAmico: '{nome} è un ragazzo di 27 anni, dolce, con un modo di fare semplice e un po\' da bambino. ' +
                    'Ha una grande passione per la musica, soprattutto italiana: ha una memoria incredibile, ' +
                    'ricorda e canta tantissime canzoni che sente alla radio e in TV.',
  messaggioAttesa: 'In attesa. Premi AVVIA quando vuoi.',
  messaggioAscolto: 'Ti ascolto...',
  etichettaPulsanteAvvia: 'AVVIA',
  mostraLog: true,
  mostraContatore: true,
  mostraVuMeter: true,
  mostraCronologia: true,       // 10/11/2026: elenco a destra di cosa chiede Domenico e cosa suona
  // 10/11/2026: soprannomi delle canzoni difficili da pronunciare, uno per riga:
  //   nome facile = cosa cercare su YouTube
  soprannomi: '',
  // 10/11/2026: radio in diretta
  radioPreferita: 'Radio Italia',
  pinMenu: '',
  saltoNonGradito: false,       // 11/11/2026: Domenico salta di continuo: un salto NON vuol dire "non mi piace"
  indirizzoTelefono: '',        // 11/11/2026: indirizzo internet di ASIA (per il QR code del telefono)
  toccoOvunque: false,          // 10/11/2026: false = risponde solo al pulsante verde
  mostraRotella: true,          // 10/11/2026: ⚙️ e ↔️ sempre visibili (si aprono tenendo premuto 3 s)                  // 10/11/2026: PIN per aprire le Impostazioni (vuoto = nessun PIN)
  internetIllimitato: false,    // 10/11/2026: SIM con internet illimitato → niente risparmio dati   // quella che parte con "metti la radio"
  radioElenco: '',                  // facoltativo: "nome = indirizzo dello stream", uno per riga          // 10/11/2026: strumento ad ago che mostra cosa sente il microfono        // 10/11/2026: contatore dei limiti YouTube/Gemini sullo schermo
  pulsanteSotto: false,
  modoUnPulsante: true,
  tuttoSchermoPulsante: true,
  confermaRicerca: false,          // ASIA 2: non più usata (7.11), tenuta per import/export

  youtubeApiKey: '',
  geminiApiKey: '',
  usaGeminiPerPlaylist: true,   // interpreta le richieste di lista con Gemini

  voceNome: '',
  voceRate: 0.9,
  vocePitch: 1.05,
  voceVolume: 1.0,
  frasiAttesa: true,            // 10/11/2026: "aspetta, te la sto cercando" mentre cerca

  fontStatus: 28,
  fontButton: 40,
  coloreSfondo: '#111111',
  coloreTesto: '#eeeeee',
  coloreAccento: '#7dd3a0',
  colorePulsante: '#2d8f4e',
  colorePulsanteTesto: '#ffffff',

  timeoutAscolto: 12,              // ASIA 2: non più usata (7.8), tenuta per import/export
  timeoutLista: 45,                // 45 s: il tempo di leggere la lista e decidere
  listaPagina: 10,

  // --- nuove chiavi ASIA 2.0 ---
  suoniAttivi: true,
  suonoAscolto: true,      // 11/11/2026: "blin" morbido quando il microfono si apre (come Alexa)
  minutiInattivita: 5,
  minutiMaxSessione: 60,
  ritardoRiaperturaMicMs: 250,

  // "pausa" NON è più un comando di stop (7.9): ha il suo elenco comandiPausa.
  comandiStop: 'stop\nstoppa\nferma\nfermati\nfermo\nbasta\nsilenzio\nzitto\ninterrompi',
  comandiSpegni: 'spegni\nspegni tutto\nspegni il telefono\nspegni il telefonino\nchiudi\nchiudi tutto\nchiudi l app\nchiudi l applicazione\nesci\nesci da asia\nbuonanotte\nbuona notte\nvai a dormire\ndormi\nriposati\narrivederci\narrivederci asia\na dopo asia\nciao asia spegni',
  comandiAncora: 'ancora\navanti\nle altre\ndammene altre\ncontinua\nsuccessive\nprossime\naltre\naltre ancora\nmostra altre',
  comandiTutte: 'tutte\nmettile tutte\nmettile tutte in fila\nfalle partire tutte\nfacciamo la playlist\nvoglio la playlist\nla playlist\nplaylist\ntutte quante\nmettile in coda\nsentiamole tutte\nvoglio sentirle tutte\nfammi sentire tutte\nfammi ascoltare tutte',
  comandiRipetiLista: 'ripeti la lista\nripetila\nripeti i numeri\nrileggila\nrileggile\nleggila di nuovo\nleggile di nuovo\ndimmi di nuovo la lista\nancora la lista\nridimmi la lista',
  comandiSi: 'si\nsì\ncerto\nok\nokay\nva bene\nvabbene\nesatto\ngiusto\nconfermo\ndai\nsissi\nyes',        // non più usata (7.11)
  comandiNo: 'no\nniente\nsbagliato\nnon è giusto\nrifai\nripeti\ncambia\naspetta\nannulla',               // non più usata (7.11)
  comandiConversazione: 'come stai\ncome va\nchi sei\ncosa sei\ncosa puoi fare\nraccontami qualcosa\nraccontami una storia\nraccontami una barzelletta\nparliamo\nfacciamo due chiacchiere\nciao asia\nbuongiorno asia\nbuonasera asia',

  comandiSalta: 'salta\navanti\nprossima\nsuccessiva\nnext\nla prossima\nvai avanti\npassa all\'altra\npassa alla prossima\npassa oltre\npassa\ncambia\ncambia canzone\ncambiala\nquesta no\nnon questa\nla prossima canzone',
  comandiIndietro: 'indietro\ntorna indietro\nvai indietro\nprecedente\nquella prima\nquella di prima',
  comandiVolumeSu: 'più forte\nalza\nalza il volume\nvolume su\npiù alto\nalzalo',
  comandiVolumeGiu: 'più piano\nabbassa\nabbassa il volume\nvolume giù\npiù basso\nabbassalo',
  comandiPausa: 'pausa\nmetti in pausa\nfai una pausa',
  comandiRiprendi: 'riprendi\ncontinua\nriparti\nplay\nfai ripartire',
  comandiDiNuovo: 'di nuovo\nrimetti\nrimettila\nridammela\nda capo\nricomincia\nancora quella\nancora una volta',
  comandiUnAltra: "un'altra\naltra\nun altro\naltro\ndella stessa\ndello stesso\nmetti un'altra\nmettine un'altra\ndammi un'altra\nfammi sentire un'altra",
  comandiInfo: "che canzone è\nche canzone era\nche canzone\nche brano è\nche brano\nchi canta\nchi la canta\ncome si chiama\ncome si intitola\ncosa sta suonando\ncos'è questa\ninfo\ninformazioni"
};

let settings = caricaSettings();

function caricaSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_SETTINGS };
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_SETTINGS, ...parsed };
  } catch (e) {
    console.warn('Errore caricamento impostazioni:', e);
    return { ...DEFAULT_SETTINGS };
  }
}

function copiaLog() {
  const el = document.getElementById('log');
  const btn = document.getElementById('logCopyBtn');
  if (!el) return;
  const testo = el.innerText || el.textContent || '';
  const mostraEsito = (ok) => {
    if (!btn) return;
    const originale = btn.textContent;
    btn.textContent = ok ? '✔️ Copiato' : '⚠️ Copia non riuscita';
    setTimeout(() => { btn.textContent = originale; }, 1800);
  };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = testo;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      mostraEsito(ok);
    } catch (e) {
      mostraEsito(false);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(testo).then(() => mostraEsito(true), fallback);
  } else {
    fallback();
  }
}

function escapeHtml(s) {

    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/** Rende sicuro un testo qualsiasi da inserire dentro una RegExp. */
function escapeRegex(s) {

// ------------------------------------------------------------
// Usata ovunque nel file per confrontare testi in modo tollerante: comandi vocali,
// titoli, nomi d'artista, chiavi di cache. Toglie anche gli accenti (sì -> si,
// perché -> perche) perché Chrome spesso trascrive le vocali accentate senza
// accento: senza questo passaggio "sì" e "si" restavano parole diverse.
function normalizza(s) {
  return (s || '').toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '') // toglie gli accenti
          .replace(/[^\w\s]/g, ' ')
          .replace(/\s+/g, ' ').trim();
}

function comandiArray(str) {
  return String(str || '').split('\n').map(s => s.trim().toLowerCase()).filter(s => s);
}

/** Confine di parola tollerante per i comandi brevi: la parola detta deve iniziare
 *  esattamente come il comando, e avere al massimo 3 lettere in più (copre varianti
 *  di trascrizione tipo "stoppa"/"fermati"/"sissi" senza rischiare di far scattare
 *  "stop" dentro una parola lunga e diversa che inizia per caso allo stesso modo). */
function paroleCombaciano(parola, comando) {
  if (parola === comando) return true;
  if (comando.length >= 2 && parola.startsWith(comando) && parola.length - comando.length <= 3) return true;
  return false;
}

/** Cerca un comando (una delle varianti elencate in comandiStringa, una per riga)
 *  dentro il testo riconosciuto. Controlla anche le eventuali trascrizioni
 *  "alternative" restituite da Chrome per la stessa frase. Non scarta mai una frase
 *  solo perché contiene parole extra intorno al comando ("stoppa la musica" è valida). */
function matchaComando(testo, comandiStringa, alternative) {
  const comandi = comandiArray(comandiStringa).map(c => normalizza(c));
  if (!comandi.length) return false;

  const testiDaControllare = [...new Set([testo, ...(alternative || [])].filter(Boolean).map(normalizza))];

  return testiDaControllare.some(t => {
    const parole = t.split(' ').filter(Boolean);
    return comandi.some(c => {
      if (!c) return false;
      if (c.includes(' ')) return (' ' + t + ' ').includes(' ' + c + ' ');
      return parole.some(p => paroleCombaciano(p, c));
    });
  });
}

function estraiNumero(testo) {
  const t = (testo || '').toLowerCase();
  const m = t.match(/\b(\d{1,3})\b/);
  if (m) return parseInt(m[1], 10);
  for (const [parola, num] of Object.entries(NUMERI)) {
    if (new RegExp('\\b' + parola + '\\b').test(t)) return num;
  }
  return null;
}

/** Riconosce il tipo di richiesta musicale: 'top' | 'lista' | 'conversazione' | 'riproduci'.
 *  Nel nuovo modello è un passo interno del Classificatore. */
function rilevaIntent(query) {
  const q = query.toLowerCase().trim();

  // "playlist ...", "raccolta ...", "compilation ...", "mix ..." → LISTA.
  // Deve stare PRIMA di 'top', altrimenti "playlist delle canzoni più
  // suonate di quest'anno" finirebbe in 'top' (classifica generica) e
  // perderebbe la richiesta di playlist.
  if (/\bplaylist\b/.test(q) ||
      /(metti|voglio|fammi|dammi|ascoltiamo|sentiamo)\s+(una\s+|la\s+)?(bella\s+)?(raccolta|compilation|mix)\b/.test(q)) {
    return 'lista';
  }

  // "tutte le canzoni di ...", "le canzoni di ...", "discografia ..." → LISTA.
  if (/(tutte le canzoni|le canzoni di|le canzoni che|discografia|brani di|canzoni di|mi dici le canzoni|mi elenchi|elencami|fammi sentire le canzoni)/.test(q)) return 'lista';
  if (/(dimmi|mostra|elenca|fammi vedere|lista)/.test(q) && /(canzon|brani|musica)/.test(q)) return 'lista';

  // Classifiche generiche (solo se non c'è già stata una playlist sopra).
  if (/(pi[uù]\s*(ascoltat|suonat|riprodott|gettonat|popolar|famos)|classifica|\btop\b|hit\b|successi|brani pi[uù]|prime\s+\d+\s+canzoni)/.test(q)) return 'top';

  // conversazione: frasi note dalle Impostazioni...
  if (matchaComando(q, settings.comandiConversazione)) return 'conversazione';
  // ...oppure domande generiche che non parlano di musica
  const sembraDomanda = /^(chi|cosa|come|perch[eé]|quando|dove|quanti|quanto|quale)\b/.test(q)
    && !/(canzon|brani|musica|cant|ascolt|sent|suona|metti)/.test(q);
  if (sembraDomanda) return 'conversazione';

  return 'riproduci';
}

function estraiQueryRicerca(testo, intent) {
  let q = testo
    .replace(/^(asia|cerca|cercami|voglio|ascolta|riproduci|metti|fammi sentire)\s+/i, '')
    .replace(/\s+(per favore|grazie)$/i, '')
    .trim();
  if (intent === 'top') {
    q = 'top hits ' + new Date().getFullYear();
  } else if (intent === 'lista') {
    q = q.replace(/\b(?:la\s+|una\s+|bella\s+)?playlist(?:\s+di|\s+con|\s+delle|\s+dei|\s+del|\s+della|\s+degli|\s+dello)?\s*/gi, ' ');
    q = q.replace(/\b(?:raccolta|compilation|mix|best\s*of|greatest\s*hits)\s*(?:di|con|dei|delle|del|della|degli|dello)?\s*/gi, ' ');
    q = q.replace(/\b(tutte le canzoni di|le canzoni di|le canzoni che (fa|ha|canta)|discografia di|i brani di|brani di|canzoni di|mi dici le canzoni di|mi dici le canzoni|elencami|elenca|fammi sentire le canzoni di)\b/gi, ' ')
         .replace(/\b(dimmi|mostra|fammi vedere|lista)\b/gi, ' ')
         .replace(/\s+/g, ' ').trim();
  }
  return q;
}

// 5. MODULO SELEZIONE CANZONE (blocco 12bis di ASIA 1, intatto)
//    Funzioni "pure" per capire, tra i risultati grezzi di YouTube, qual è la
//    canzone giusta: vero autore, versioni alterate, contenuti non musicali, punteggio.
// ------------------------------------------------------------
function pulisciNomeCanale(nome) {
  return (nome || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').trim();
}

function canaleUfficiale(nome) {
  return /-\s*topic$/i.test((nome || '').trim()) || /vevo$/i.test((nome || '').trim());
}

// Molti video vengono caricati da canali privati/fan (non dall'artista): in quel caso il
// nome del canale non è l'autore della canzone. Se il titolo segue il formato comune
// "Artista - Titolo", usiamo quel nome come autore quando il canale non sembra ufficiale.
function estraiArtista(titolo, channelTitle) {
  const canale = pulisciNomeCanale(channelTitle);
  const m = (titolo || '').match(/^\s*([^-–:]{2,40})\s*[-–:]\s*.+/);
  if (m) {
    const candidato = m[1].trim();
    const canaleNorm = normalizza(canale);
    const candNorm = normalizza(candidato);
    if (canaleNorm && (canaleNorm.includes(candNorm) || candNorm.includes(canaleNorm))) {
      return canale;
    }
    if (!canaleUfficiale(channelTitle) && candidato.length <= 40) return candidato;
  }
  return canale;
}

function rimuoviEmoji(testo) {
  return (testo || '')
    .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/#\S+/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

const PAROLE_VERSIONE_ALTERATA = [
  'remix', 'rmx', 'cover', 'reggaeton', 'napoletana', 'napoletano',
  'tiktok', 'sped up', 'slowed', '8d audio', 'mashup', 'parodia', 'parody',
  'nightcore', 'instrumental', 'strumentale', 'karaoke', 'tutorial',
  'reaction', 'dance version', 'trap version', 'bootleg',
  'live', 'dal vivo', 'unplugged', 'acoustic', 'acustica', 'concerto',
  'tour', 'session'
];

function isVersioneAlterata(titolo) {
  const t = normalizza(titolo);
  return PAROLE_VERSIONE_ALTERATA.some(p => t.includes(normalizza(p)));
}

const FRASI_CONTENUTO_NON_MUSICALE = [
  'suoneria', 'ringtone', 'come mettere', 'come scaricare', 'come installare',
  'whatsapp', 'stato whatsapp', 'dedico una canzone', 'per conquistare',
  'reels', 'shorts', 'challenge', 'quiz musicale', 'indovina la canzone'
];

function sembraContenutoNonMusicale(r) {
  if (r.contenutoSocial) return true;
  const t = normalizza(r.titolo);
  return FRASI_CONTENUTO_NON_MUSICALE.some(p => t.includes(normalizza(p)));
}

function filtraVersioniOriginali(risultati) {
  const puliti = risultati.filter(r => !isVersioneAlterata(r.titolo) && !sembraContenutoNonMusicale(r));
  return puliti.length ? puliti : risultati;
}

const QUALIFICATORI_SECONDARI = [
  'remaster', 'remastered', 'deluxe', 'demo', 'bonus track', 'extended',
  'alternate', 'anniversary edition', 'edit'
];

function pulisciTitolo(titolo) {
  let t = (titolo || '').replace(/[\(\[][^\)\]]*[\)\]]/g, '');
  t = t.replace(/\s*[-–|]\s*(official|ufficiale|video ufficiale|official video|official audio|lyric video|audio ufficiale|hd|hq)\s*$/gi, '');
  t = t.replace(/[#|•·»«‹›~*_♪♫]+/g, ' ');
  return t.replace(/\s{2,}/g, ' ').trim();
}

/** Il migliore tra i risultati di YouTube per questa query (o null).
 *  ASIA 2: è il primo elemento di Ricerca.ordinaPerPertinenza(). NON confondere con
 *  Classificatore.scegliTrascrizione, che sceglie tra le trascrizioni vocali (R13). */
function scegliMigliore(risultati, query) {
  return Ricerca.ordinaPerPertinenza(risultati, query)[0] || null;
}

function durataInParole(sec) {
  const m = Math.floor(sec/60), r = sec%60;
  return m + (m===1 ? ' minuto' : ' minuti') + (r>=25 ? ' e mezzo' : '');
}

/** Toglie dalla lista i brani con titolo duplicato (stesso titolo, canali diversi). */
function dedupPerTitolo(arr) {
  const visti = new Set(); const out = [];
  for (const r of arr) {
    const k = normalizza(r.titolo);
    if (!visti.has(k)) { visti.add(k); out.push(r); }
  }
  return out;
}

/** Se una ricerca restituisce tante canzoni DIVERSE tra loro, Domenico ha detto solo
 *  il nome di un cantante (→ coda di titoli diversi), non un titolo preciso. */
function sembraSoloNomeArtista(risultati) {
  let cand = risultati.filter(r => r.durataSec >= 90 && r.durataSec <= 480);
  if (!cand.length) cand = risultati.slice();
  cand = filtraVersioniOriginali(cand);
  const titoliDistinti = new Set(cand.slice(0, 8).map(r => normalizza(pulisciTitolo(r.titolo))));
  return titoliDistinti.size >= 5;
}
