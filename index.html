// 6. SUONI DI SISTEMA (Web Audio)
// ------------------------------------------------------------
const Suoni = {
  ctx: null,

  /** Crea/riattiva l'AudioContext. Va chiamata al tocco su AVVIA (gesto utente). */
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
    } catch (e) { log('Suoni non disponibili: ' + e.message); }
  },

  /** Suona una nota breve (con attacco/rilascio morbidi) dopo ritardoMs. */
  _tono(freq, durataMs, tipo, volume, ritardoMs) {
    if (!settings.suoniAttivi) return;
    this.init();
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (ritardoMs || 0) / 1000;
      const dur = durataMs / 1000;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = tipo || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume || 0.15, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* un suono perso non deve mai bloccare l'app */ }
  },

  /** Dong-dong ascendente: "ti ascolto". */
  pronto()    { this._ultimoAscolto = Date.now(); this._tono(660, 80); this._tono(880, 80, 'sine', 0.15, 100); },

  /** 11/11/2026: "blin" morbido (come Alexa) quando il microfono si apre e si può parlare.
   *  Una nota che sale piano, con attacco e coda morbidi: niente click, niente bip secchi.
   *  Al massimo uno ogni 2,5 secondi, così non diventa fastidioso. */
  _ultimoAscolto: 0,
  ascolto() {
    if (!settings.suoniAttivi || settings.suonoAscolto === false) return;
    const ora = Date.now();
    if (ora - this._ultimoAscolto < 2500) return;
    this._ultimoAscolto = ora;
    this.init();
    if (!this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + 0.01;
      const nota = (f1, f2, inizio, dur, vol) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f1, t0 + inizio);
        o.frequency.exponentialRampToValueAtTime(f2, t0 + inizio + dur * 0.6);
        g.gain.setValueAtTime(0.0001, t0 + inizio);
        g.gain.linearRampToValueAtTime(vol, t0 + inizio + 0.03);          // attacco dolce
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + inizio + dur);  // coda che sfuma
        o.connect(g); g.connect(c.destination);
        o.start(t0 + inizio); o.stop(t0 + inizio + dur + 0.05);
      };
      nota(523, 659, 0.00, 0.28, 0.10);   // do -> mi
      nota(784, 784, 0.12, 0.40, 0.08);   // sol, che resta un attimo
    } catch (e) { /* un suono perso non deve mai bloccare l'app */ }
  },
  /** Dong basso: comando ricevuto. */
  ricevuto()  { this._tono(440, 100, 'sine', 0.12); },
  /** Due note discendenti: errore. */
  errore()    { this._tono(600, 100); this._tono(400, 150, 'sine', 0.15, 120); },
  /** Click breve: cambio brano. */
  salto()     { this._tono(1000, 40); },
  /** Due note che salgono: volume su. */
  volumeSu()  { this._tono(880, 60); this._tono(1100, 60, 'sine', 0.15, 70); },
  /** Due note che scendono: volume giù. */
  volumeGiu() { this._tono(880, 60); this._tono(660, 60, 'sine', 0.15, 70); }
};

// ------------------------------------------------------------
// 7. VOCE (TTS)
//    Appena inizia a parlare chiude il microfono; appena finisce (per qualsiasi
//    motivo) lo riapre. Ogni frase ha un id: la fine di una frase vecchia non può
//    riaprire il microfono mentre ne sta dicendo una nuova.
// ------------------------------------------------------------
const synth = window.speechSynthesis;
let vociDisponibili = [];

function caricaVoci() {
  vociDisponibili = synth ? synth.getVoices() : [];
  return vociDisponibili;
}

function voceItaliana() {
  caricaVoci();
  if (settings.voceNome) {
    const trovata = vociDisponibili.find(v => v.name === settings.voceNome);
    if (trovata) { voceItaliana._log(trovata); return trovata; }
  }
  // 10/11/2026: prima una voce INSTALLATA sul dispositivo (Microsoft sul PC, quella di
  // Android sul telefono): avvisa bene quando finisce di parlare e non dipende da
  // internet. Le voci "Google" del PC passano da internet e spesso non lo avvisano.
  // 11/11/2026: ASIA è una ragazza → tra le voci italiane preferisce quelle femminili
  // (Elsa, Isabella, ecc.) e scarta quelle maschili note (Cosimo, Diego, Giuseppe...).
  const ita = vociDisponibili.filter(x => x.lang.startsWith('it'));
  const maschile = x => /cosimo|diego|giuseppe|benigno|calimero|gianni|rinaldo|luca|paolo|male|uomo/i.test(x.name);
  const femminile = x => /elsa|isabella|alice|paola|federica|carla|bianca|giorgia|chiara|female|donna/i.test(x.name);
  let v = ita.find(x => x.localService && femminile(x))
       || ita.find(x => x.localService && !maschile(x))
       || ita.find(x => femminile(x))
       || ita.find(x => !maschile(x) && x.name.includes('Google'));
  if (!v) v = ita.find(x => x.localService);
  if (!v) v = vociDisponibili.find(x => x.lang.startsWith('it') && x.name.includes('Google'));
  if (!v) v = vociDisponibili.find(x => x.lang.startsWith('it'));
  if (!v) v = vociDisponibili.find(x => x.lang.startsWith('it-'));
  voceItaliana._log(v);
  return v;
}
voceItaliana._log = (v) => {
  if (!v || voceItaliana._ultima === v.name) return;
  voceItaliana._ultima = v.name;
  log('🗣️ Voce di ASIA: ' + v.name + (v.localService ? ' (installata sul dispositivo)' : ' (via internet: può essere più lenta ad avvisare la fine)'));
};

const Voce = {
  ultimoTesto: '',
  fineUltimoParlato: 0,
  _idParlato: 0,
  _staParlando: false,
  _uCorrente: null,        // riferimento tenuto vivo: evita il bug di Chrome sull'onend perso (R6)
  _watchdog: null,
  _risolvi: null,

  /** true se ASIA sta parlando (flag proprio: NON synth.speaking, inaffidabile). */
  staParlando() { return this._staParlando; },

  /** Dice un testo. Risolve SEMPRE (mai reject) con 'finito' | 'interrotto' | 'errore'.
   *  Se stava già dicendo un'altra frase, quella risolve 'interrotto' SENZA riaprire
   *  il microfono in mezzo alle due. */
  parla(testo, opz) {
    testo = String(testo == null ? '' : testo).trim();
    if (!testo) return Promise.resolve('finito');

    const giaInCorso = this._staParlando;
    if (giaInCorso) this._chiudiPromessa('interrotto');
    const id = ++this._idParlato;
    this._staParlando = true;
    this.ultimoTesto = testo;
    this._quandoInizio();      // mic in pausa PRIMA di synth.speak (salvo lettura lista)

    setStatus(testo);
    log('🔊 ' + testo);

    return new Promise((resolve) => {
      this._risolvi = resolve;
      if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
        setTimeout(() => this._fine(id, 'errore'), 0);
        return;
      }
      try { synth.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(testo);
      u.lang = 'it-IT';
      u.rate = (opz && opz.rate) || settings.voceRate;
      u.pitch = (opz && opz.pitch) || settings.vocePitch;
      u.volume = settings.voceVolume;
      const v = voceItaliana();
      if (v) u.voice = v;
      u.onend = () => this._fine(id, 'finito');
      // 10/11/2026: Chrome segnala ogni parola detta: serve a capire quando la frase è
      // finita davvero anche se poi "dimentica" di avvisare la fine.
      this._ultimaParola = 0; this._ultimoCarattere = -1;
      u.onboundary = (e) => { if (id === this._idParlato) { this._ultimaParola = Date.now(); this._ultimoCarattere = e.charIndex || 0; } };
      u.onerror = (e) => {
        const err = e && e.error;
        if (err !== 'interrupted' && err !== 'canceled') log('Errore TTS: ' + err);
        this._fine(id, (err === 'interrupted' || err === 'canceled') ? 'interrotto' : 'errore');
      };
      this._uCorrente = u;
      this._armaWatchdog(id, testo);
      try { synth.speak(u); }
      catch (e) { log('Errore TTS: ' + e.message); this._fine(id, 'errore'); }
    });
  },

  /** Zittisce ASIA subito. La frase in corso risolve 'interrotto' e il mic si riapre. */
  interrompi() {
    const id = this._idParlato;
    try { if (synth) synth.cancel(); } catch (e) {}
    if (this._staParlando) this._fine(id, 'interrotto');
  },

  /** Cane da guardia (R6): se il browser non segnala mai la fine del parlato,
   *  dopo il tempo stimato (e con synth.speaking falso) la dichiara finita lo stesso.
   *  Tetto massimo: il doppio della stima + 10 s, anche se synth.speaking resta vero. */
  _armaWatchdog(id, testo) {
    if (this._watchdog) clearTimeout(this._watchdog);
    const rate = Math.max(0.3, Number(settings.voceRate) || 1);
    const stimaMs = Math.round(1500 + testo.length * 85 / rate);
    // 10/11/2026: prima "stima x 2 + 10 s": su alcuni PC Chrome non avvisa mai la fine e
    // continua a dire "sto parlando", e il microfono restava spento ~10 s dopo ogni frase.
    // La stima è già abbondante (≈ 10 lettere al secondo): basta 1,5 s di margine.
    const tetto = Date.now() + stimaMs + 1500;
    // 10/11/2026: controllo frequente. Se Chrome ha davvero smesso di parlare (due
    // controlli di fila) la frase è finita anche se non l'ha segnalato; se dice di
    // parlare ancora, si aspetta al massimo fino al tetto.
    let zitto = 0;
    const ultimaParolaDa = Math.max(0, testo.replace(/[\s.,;:!?…]+$/, '').lastIndexOf(' '));   // inizio dell'ultima parola
    const controlla = () => {
      if (id !== this._idParlato || !this._staParlando) return;
      const parlaAncora = synth && synth.speaking;
      zitto = parlaAncora ? 0 : zitto + 1;
      // ultima parola della frase già detta e poi mezzo secondo di silenzio → finita
      const ultimaDetta = this._ultimaParola && this._ultimoCarattere >= ultimaParolaDa &&
                          Date.now() - this._ultimaParola > 600;
      if (ultimaDetta) zitto = 2;
      if (zitto < 2 && Date.now() < tetto) { this._watchdog = setTimeout(controlla, 200); return; }
      log('⚠️ Fine del parlato non segnalata dal browser: la dichiaro io (' +
          (this._ultimaParola && Date.now() - this._ultimaParola > 600 ? 'ultima parola detta' : zitto >= 2 ? 'Chrome zitto' : 'tempo massimo') + ')');
      try { if (synth) synth.cancel(); } catch (e) {}
      this._fine(id, 'finito');
    };
    // primo controllo dopo 0,7 s, poi ogni 0,3 s
    this._watchdog = setTimeout(controlla, 700);
  },

  /** Risolve la promessa della frase corrente senza toccare microfono e volume. */
  _chiudiPromessa(esito) {
    if (this._watchdog) { clearTimeout(this._watchdog); this._watchdog = null; }
    const r = this._risolvi;
    this._risolvi = null;
    this._uCorrente = null;
    if (r) r(esito);
  },

  /** Fine di una frase: conta solo se il suo id è ancora quello corrente. */
  _fine(id, esito) {
    if (id !== this._idParlato || !this._staParlando) return;
    this._staParlando = false;
    this.fineUltimoParlato = Date.now();
    this._chiudiPromessa(esito);
    this._quandoFine();
  },

  _quandoInizio() {
    if (!(typeof Lista !== 'undefined' && Lista._inLettura)) Listener.pausa('parlato');
    Player.abbassaPerVoce();
    Sessione._aggiornaTimerInattivita();
  },

  _quandoFine() {
    Player.ripristinaVolume();
    if (!(typeof Lista !== 'undefined' && Lista._inLettura)) Listener.riprendi('parlato');
    Sessione._aggiornaTimerInattivita();
  }
};

/** Adattatore compatibile con il vecchio parla(testo, callback): la callback parte
 *  solo se la frase è stata detta tutta ('finito'). */
function parla(testo, callback) {
  return Voce.parla(testo).then(esito => {
    if (esito === 'finito' && callback) callback();
    return esito;
  });
}

// ------------------------------------------------------------
// 7b. FRASI DI ATTESA (10/11/2026, richiesta del nonno)
// ------------------------------------------------------------
// Se una ricerca dura più di 1,5 s, ASIA dice con voce più lenta e dolce frasi
// come "aspetta un attimo, te la sto cercando" (al massimo 3). Prima di annunciare
// la canzone aspetta che la frase finisca (finisci), così non si accavallano.
const Attesa = {
  FRASI: [
    'Aspetta un attimo{nome}, te la sto cercando.',
    "Abbi un po' di pazienza, sto arrivando.",
    'Ancora un momento{nome}, la sto trovando per te.',
    'Tranquillo, ci sono quasi.',
    'Un secondo ancora, adesso arriva.',
    'Sto cercando la versione più bella per te.'
  ],
  PRIMA_MS: 1500,
  TRA_MS: 4500,
  MAX: 3,
  _timer: null, _attiva: false, _detto: 0, _ultima: -1, _promessa: null,

  avvia() {
    this.ferma();
    if (settings.frasiAttesa === false) return;
    this._attiva = true;
    this._detto = 0;
    this._timer = setTimeout(() => this._dici(), this.PRIMA_MS);
  },
  _dici() {
    this._timer = null;
    if (!this._attiva || this._detto >= this.MAX) return;
    let i;
    do { i = Math.floor(Math.random() * this.FRASI.length); } while (i === this._ultima && this.FRASI.length > 1);
    this._ultima = i;
    const nome = settings.nomeUtente ? ', ' + settings.nomeUtente : '';
    this._detto++;
    const rate = (Number(settings.voceRate) || 0.9) * 0.88;
    const pitch = Math.max(0.5, (Number(settings.vocePitch) || 1) * 0.95);
    this._promessa = Voce.parla(this.FRASI[i].replace('{nome}', nome), { rate, pitch }).then(esito => {
      this._promessa = null;
      if (this._attiva && esito === 'finito') this._timer = setTimeout(() => this._dici(), this.TRA_MS);
      return esito;
    });
  },
  /** Niente più frasi (stop, errore, fine ricerca). */
  ferma() {
    this._attiva = false;
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
  },
  /** Niente più frasi e, se ASIA ne sta dicendo una, aspetta che finisca (max 4 s). */
  async finisci() {
    this.ferma();
    const p = this._promessa;
    if (p) await Promise.race([p, new Promise(r => setTimeout(r, 4000))]);
  }
};

// ------------------------------------------------------------
// 8. LISTENER (microfono unico + segmentatore)
//    Aperto se e solo se: Sessione.attiva && nessun motivo di pausa && !bloccato.
//    Nessuno lo apre/chiude "a mano": si chiamano pausa(motivo)/riprendi(motivo).
// ------------------------------------------------------------
const Listener = {
  r: null,                  // istanza SpeechRecognition corrente (guardia di identità)
  generazione: 0,           // contatore delle aperture (solo per il log)
  motiviPausa: new Set(),   // 'parlato' | 'background' | 'impostazioni' | 'musica'
  bloccato: false,          // freno d'emergenza contro i riavvii a raffica (R8)
  /** Unico destinatario delle frasi: Esecutore.riceviFrase (collegato in fondo al file). */
  suFrase: null,

  _timerRiapertura: null,
  _timerFreno: null,
  _riavvii: [],
  _frenate: 0,
  _seg: { timer: null, ultimoIndice: -1, parziale: '', indiceParziale: -1 },

  /** Chiamato solo da Sessione.avvia. */
  avvia() {
    this.bloccato = false;
    this._riavvii = [];
    this._frenate = 0;
    this._aggiorna();
  },

  /** Chiamato solo da Sessione.termina: chiude tutto e annulla i timer. */
  ferma() {
    if (this._timerRiapertura) { clearTimeout(this._timerRiapertura); this._timerRiapertura = null; }
    if (this._timerFreno) { clearTimeout(this._timerFreno); this._timerFreno = null; }
    this.bloccato = false;
    this._chiudi();
    Sessione.logStato();
  },

  /** Aggiunge un motivo di pausa (ogni modulo gestisce solo il proprio). */
  pausa(motivo) {
    this.motiviPausa.add(motivo);
    if (this._timerRiapertura) { clearTimeout(this._timerRiapertura); this._timerRiapertura = null; }
    this._aggiorna();
  },

  /** Toglie un motivo di pausa. Dopo il parlato riapre con un piccolo margine
   *  (settings.ritardoRiaperturaMicMs, 0 = subito) contro la coda audio del tablet. */
  riprendi(motivo) {
    this.motiviPausa.delete(motivo);
    const ritardo = Math.max(0, Number(settings.ritardoRiaperturaMicMs) || 0);
    if (motivo === 'parlato' && ritardo > 0 && this.aperto() && !this.r) {
      if (this._timerRiapertura) clearTimeout(this._timerRiapertura);
      this._timerRiapertura = setTimeout(() => {
        this._timerRiapertura = null;
        this._aggiorna();
      }, ritardo);
    }
    this._aggiorna();
  },

  /** CALCOLATO, mai impostato a mano: il microfono DEVE essere aperto? */
  aperto() {
    return Sessione.attiva && this.motiviPausa.size === 0 && !this.bloccato;
  },

  /** Porta la realtà (istanza aperta o no) in linea con aperto(). */
  _aggiorna() {
    if (this.aperto()) {
      if (!this.r && !this._timerRiapertura) this._apri();
    } else if (this.r) {
      this._chiudi();
    }
    Sessione.logStato();
  },

  /** Crea SEMPRE una nuova istanza (dopo abort() non si riusa mai la vecchia). */
  _apri() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      log('❌ Riconoscimento vocale non supportato. Usa Chrome.');
      Sessione.termina('errore_microfono');
      return;
    }
    const r = new SR();
    r.lang = 'it-IT';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 5;       // 5 e non 8: meno falsi positivi (R5)
    this.r = r;
    this.generazione++;
    this._resetSegmentatore();
    r.onresult = (ev) => { this._erroriRete = 0; try { VuMeter.sentito(); } catch (e) {} this._suRisultato(r, ev); };
    r.onerror = (e) => this._suErrore(r, e);
    r.onend = () => this._suFine(r);
    try {
      r.start();
      log('🎤 Microfono aperto (#' + this.generazione + ')');
      if (!Sessione.contesto().staSuonando) {
        setStatus(settings.messaggioAscolto);
        // 11/11/2026: suono "ti ascolto". Non dopo un errore di rete (non è ASIA che ti
        // ascolta di nuovo, è il microfono che riprova) e non durante la musica.
        if (!this._erroriRete) { try { Suoni.ascolto(); } catch (e) {} }
      }
    } catch (e) {
      log('🎤 Avvio microfono fallito: ' + e.message);
      if (this.r === r) this.r = null;
      this._frena();
    }
  },

  /** Chiude l'istanza corrente. I frammenti parziali non consegnati vengono SCARTATI
   *  (scelta prudente contro l'eco). Gli eventi in ritardo della vecchia istanza
   *  vengono ignorati grazie a Listener.r !== r. */
  _chiudi() {
    this._annullaTimerSeg();
    this._seg.parziale = '';
    if (this.r) {
      const r = this.r;
      this.r = null;
      try { r.abort(); } catch (e) {}
      log('🔇 Microfono chiuso');
    }
  },

  _resetSegmentatore() {
    this._annullaTimerSeg();
    this._seg.ultimoIndice = -1;     // Chrome ricomincia event.results da capo a ogni start
    this._seg.parziale = '';
    this._seg.indiceParziale = -1;
  },

  _annullaTimerSeg() {
    if (this._seg.timer) { clearTimeout(this._seg.timer); this._seg.timer = null; }
  },

  /** Segmentatore: dai frammenti alle frasi (sezione 3.4 dell'architettura). */
  _suRisultato(r, ev) {
    if (this.r !== r) return;
    let finale = '', ultimoFinale = -1, alternative = [];
    let parziale = '', ultimoParziale = -1;
    const results = ev.results || [];
    for (let i = ev.resultIndex || 0; i < results.length; i++) {
      if (i <= this._seg.ultimoIndice) continue;     // già consegnato: niente doppioni
      const res = results[i];
      const t = String((res[0] && res[0].transcript) || '').trim();
      if (res.isFinal) {
        if (t) finale += (finale ? ' ' : '') + t;
        ultimoFinale = i;
        alternative = [];
        for (let j = 0; j < res.length; j++) {
          const a = String((res[j] && res[j].transcript) || '').trim();
          if (a) alternative.push(a);
        }
      } else {
        if (t) parziale += (parziale ? ' ' : '') + t;
        ultimoParziale = i;
      }
    }

    if (ultimoFinale >= 0) {
      this._annullaTimerSeg();
      this._seg.ultimoIndice = ultimoFinale;
      this._seg.parziale = '';
      if (finale) this._consegna({ testo: finale, alternative, daParziale: false });
      if (this.r !== r) return;
    }

    if (parziale && ultimoParziale > this._seg.ultimoIndice) {
      this._seg.parziale = parziale;
      this._seg.indiceParziale = ultimoParziale;
      this._annullaTimerSeg();
      // 7.2: "stop" istantaneo sul frammento parziale (al massimo 2 parole).
      if (Classificatore.eStopRapido(parziale)) {
        this._consegnaParziale();
        return;
      }
      this._seg.timer = setTimeout(() => {
        this._seg.timer = null;
        if (this.r !== r) return;
        this._consegnaParziale();
      }, 800);
    }
  },

  _consegnaParziale() {
    const t = this._seg.parziale;
    if (!t) return;
    this._seg.ultimoIndice = Math.max(this._seg.ultimoIndice, this._seg.indiceParziale);
    this._seg.parziale = '';
    this._consegna({ testo: t, alternative: [t], daParziale: true });
  },

  _consegna(dati) {
    if (!this.aperto()) return;
    const frase = {
      testo: dati.testo,
      alternative: dati.alternative || [],
      daParziale: !!dati.daParziale,
      ts: Date.now(),
      generazione: this.generazione
    };
    const nAlt = frase.alternative.length;
    log('👤 "' + frase.testo + '"' + (frase.daParziale ? ' (parziale)' : '') +
        (nAlt > 1 ? ' (+' + (nAlt - 1) + ' alt.)' : ''));
    this._frenate = 0;
    if (typeof this.suFrase === 'function') {
      try { this.suFrase(frase); }
      catch (e) { log('❌ Errore gestendo la frase: ' + e.message); }
    }
  },

  _suErrore(r, e) {
    if (this.r !== r) return;
    const err = e && e.error;
    if (err === 'no-speech' || err === 'aborted') return;   // onend arriverà e riavvierà
    log('🎤 Errore riconoscimento: ' + err);
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      this._chiudi();
      Sessione.termina('permesso');
      return;
    }
    if (err === 'audio-capture') {
      this._chiudi();
      Sessione.termina('errore_microfono');
    }
    if (err === 'network') {
      // 10/11/2026: il servizio di Google che capisce la voce non risponde. Riprovare
      // subito sulla stessa istanza non serve (e il microfono restava "morto"): si chiude,
      // si aspetta un po' (1, 2, 4, 8 s) e si riapre un'istanza NUOVA.
      this._erroriRete = (this._erroriRete || 0) + 1;
      this._chiudi();
      this.bloccato = true;
      const attesa = Math.min(8000, 1000 * Math.pow(2, this._erroriRete - 1));
      if (this._erroriRete === 3) {
        Suoni.errore();
        setStatus('⚠️ Non riesco a collegarmi al servizio che capisce la voce. Controlla internet (o la VPN).');
        log('⚠️ Riconoscimento vocale: 3 errori di rete di fila. Internet c\'è? VPN accesa?');
      }
      this._bloccaPer(attesa);      // stesso timer del freno R8 (unico modo ammesso di riaprire)
      return;
    }
    // altri errori: ci pensa onend, con il freno.
  },

  /** Chrome (soprattutto Android) chiude spesso il riconoscimento da solo: se deve
   *  restare aperto lo riavviamo sulla STESSA istanza; se rifiuta, ne creiamo una nuova. */
  _suFine(r) {
    if (this.r !== r) return;
    if (this._seg.parziale) {
      this._annullaTimerSeg();
      this._consegnaParziale();
      if (this.r !== r) return;
    }
    if (!this.aperto()) { this.r = null; return; }
    if (!this._registraRiavvio()) return;
    try {
      this._resetSegmentatore();
      r.start();
    } catch (e) {
      log('🎤 Riavvio sulla stessa istanza fallito: ' + e.message);
      this.r = null;
      this._aggiorna();
    }
  },

  /** Freno R8: più di 5 riavvii in 10 s → pausa di 1 s. Restituisce false se ha frenato. */
  _registraRiavvio() {
    const ora = Date.now();
    this._riavvii = this._riavvii.filter(t => ora - t < 10000);
    this._riavvii.push(ora);
    if (this._riavvii.length > 5) { this._frena(); return false; }
    return true;
  },

  /** Unico setTimeout di riavvio ammesso: freno d'emergenza, non la strada normale.
   *  Dopo 3 frenate di fila senza nessuna frase utile, la sessione si chiude. */
  _frena() {
    this._frenate++;
    this._riavvii = [];
    if (this.r) { const r = this.r; this.r = null; try { r.abort(); } catch (e) {} }
    if (this._frenate > 3) {
      log('❌ Il microfono continua a chiudersi: chiudo la sessione');
      this._frenate = 0;
      Sessione.termina('errore_microfono');
      return;
    }
    log('🎤 Troppi riavvii del microfono: pausa di 1 secondo');
    this._bloccaPer(1000);
  },

  /** Freno R8 (e, dal 10/11/2026, pausa dopo un errore di rete): microfono fermo per
   *  `ms` millisecondi, poi si riapre un'istanza nuova se deve essere aperto. */
  _bloccaPer(ms) {
    this.bloccato = true;
    if (this._timerFreno) clearTimeout(this._timerFreno);
    this._timerFreno = setTimeout(() => {
      this._timerFreno = null;
      this.bloccato = false;
      this._aggiorna();
    }, ms);
  }
};

// ------------------------------------------------------------
// 9. CLASSIFICATORE (funzione pura: non esegue, non parla, non tocca il player)
// ------------------------------------------------------------
/** Parole "di riempimento" ammesse intorno a un comando ("salta QUESTA CANZONE",
 *  "alza UN PO' IL VOLUME"). Tutto ciò che non è comando o riempimento rende la
 *  frase NON un comando: è la difesa principale contro i titoli (R3). */
const PAROLE_RIEMPITIVO = new Set([
  'la', 'il', 'lo', 'le', 'i', 'gli', 'l', 'un', 'una', 'uno', 'po', 'poco',
  'questa', 'questo', 'quella', 'quello', 'canzone', 'brano', 'pezzo', 'musica', 'volume',
  'per', 'favore', 'grazie', 'dai', 'adesso', 'ora', 'subito', 'pure', 'ok', 'e', 'di',
  'piu', 'mi', 'me', 'ancora', 'asia'
]);

/** Frasi fatte solo di queste parole sono RUMORE (niente ricerca YouTube per un "ok"). */
const INTERIEZIONI = new Set([
  'si', 'no', 'ok', 'okay', 'eh', 'ah', 'oh', 'uh', 'uhm', 'ehm', 'mh', 'mmh', 'boh', 'mah',
  'ecco', 'allora', 'dai', 'va', 'bene', 'vabbe', 'vabbene', 'grazie', 'niente', 'ciao',
  'bravo', 'brava', 'perfetto', 'certo', 'esatto'
]);

/** Frase che inizia con un verbo di ricerca: vince SEMPRE la RICERCA (R3, regola 1). */
const RE_VERBO_RICERCA = /^(metti|mettimi|mettici|rimetti|rimettimi|cerca|cercami|voglio|vorrei|ascolta|ascoltiamo|riproduci|fammi sentire|fammi ascoltare|suona|suonami|manda|mandami)\b/;

/** Verbi che la vecchia estraiQueryRicerca non toglie: li togliamo prima noi. */
const RE_VERBI_EXTRA = /^(fammi ascoltare|voglio sentire|voglio ascoltare|vorrei sentire|vorrei ascoltare|vorrei|rimettimi|rimetti|mettimi|mettici|suonami|suona|mandami|manda|ascoltiamo)\s+/i;

/** La lista numerata si legge solo su richiesta ESPLICITA (7.12). */
const RE_LISTA_ESPLICITA = /(elenc|dimmi|mi dici|leggi|leggimi|quali sono|mostra|fammi vedere|lista)/;

/** Ordine di controllo dei comandi (dopo STOP e lista). */
const COMANDI_TRASPORTO = [
  ['PAUSA', 'comandiPausa'],
  ['RIPRENDI', 'comandiRiprendi'],
  ['SALTA', 'comandiSalta'],
  ['INDIETRO', 'comandiIndietro'],
  ['VOLUME_SU', 'comandiVolumeSu'],
  ['VOLUME_GIU', 'comandiVolumeGiu'],
  ['DI_NUOVO', 'comandiDiNuovo'],
  ['UN_ALTRA', 'comandiUnAltra'],
  ['INFO', 'comandiInfo']
];

const Classificatore = {
  MAX_PAROLE_COMANDO: 3,        // parole NON di riempimento in un comando (R3)
  MAX_PAROLE_STOP: 5,           // come il monitor di ASIA 1
  MAX_PAROLE_STOP_RAPIDO: 2,    // 7.2
  MAX_PAROLE_PER_ALTERNATIVE: 2,// le alternative servono solo a salvare comandi brevissimi (R5)
  FINESTRA_ECO_MS: 3000,
  SOGLIA_ECO: 0.7,

  /** Decide cosa fare di una frase. Non ha effetti collaterali.
   *  @param {{testo:string, alternative:string[], daParziale:boolean}} frase
   *  @param {object} contesto  istantanea da Sessione.contesto()
   *  @returns {{tipo:string, azione:?string, intent:?string, query:string, numero:?number, motivo:string, testo:string}} */
  classifica(frase, contesto) {
    const ctx = contesto || {};
    const scelta = this.scegliTrascrizione(frase);
    if (!scelta) return this._decisione('RUMORE', { motivo: 'frase vuota' });

    const { testo: senzaAsia } = this._togliPrefissoAsia(scelta.testo);
    const testo = senzaAsia.replace(/[\s,.;!?]*\b(per favore|grazie)[\s.!?]*$/i, '').trim();
    const norm = normalizza(testo);
    // Un'unica cifra da 1 a 9 (Chrome trascrive spesso "tre" come "3") non è "troppo
    // corta": può essere la scelta di un numero dalla lista (BUG 7). ---
    if (norm.length < 2 && !/^[1-9]$/.test(norm)) {
      return this._decisione('RUMORE', { motivo: 'frase troppo corta', testo });
    }
    const parole = norm.split(' ');

    // Alternative (già ripulite) solo per frasi brevissime.
    const altBrevi = parole.length <= this.MAX_PAROLE_PER_ALTERNATIVE
      ? scelta.alternative.map(a => normalizza(this._togliPrefissoAsia(a).testo)).filter(Boolean)
      : [];

    // --- 1. Durante la musica (7.1, poi rivisto): solo stop e pausa. ---
    if (ctx.staSuonando) {
      if (parole.length <= this.MAX_PAROLE_STOP && matchaComando(norm, settings.comandiSpegni)) {
        return this._decisione('COMANDO', { azione: 'SPEGNI', motivo: 'spegni durante la musica', testo });
      }
      if (parole.length <= this.MAX_PAROLE_STOP && matchaComando(norm, settings.comandiStop)) {
        return this._decisione('COMANDO', { azione: 'STOP', motivo: 'stop durante la musica', testo });
      }
      // "pausa" durante la riproduzione: aggiunto su richiesta esplicita dell'utente
      // dopo la revisione dell'Agente 2 (senza, "pausa" durante la musica non faceva
      // più niente, perché la 7.9 l'ha tolta dai comandi di stop).
      if (parole.length <= this.MAX_PAROLE_STOP && matchaComando(norm, settings.comandiPausa)) {
        return this._decisione('COMANDO', { azione: 'PAUSA', motivo: 'pausa durante la musica', testo });
      }
      return this._decisione('RUMORE', { motivo: 'durante la musica si ascolta solo "stop" o "pausa"', testo });
    }

    if (parole.length <= this.MAX_PAROLE_STOP && matchaComando(norm, settings.comandiSpegni)) {
      return this._decisione('COMANDO', { azione: 'SPEGNI', motivo: 'comando di spegnimento', testo });
    }

    // --- 2. STOP vince sempre (anche contro il filtro eco: un falso stop è innocuo). ---
    if (this._eFraseStop(norm, altBrevi)) {
      return this._decisione('COMANDO', { azione: 'STOP', motivo: 'vocabolario stop', testo });
    }

    // --- 3. Filtro anti-eco (3.5). Saltato quando la lista è appena stata letta (7.12,
    //     BUG 6): altrimenti un titolo appena elencato ("ancora", "numero 3", o il
    //     titolo stesso) somiglia troppo a quello che ASIA ha appena detto e viene
    //     scartato come eco, proprio mentre aspettiamo una risposta a quella lista. ---
    //     Revisione finale: a lista attiva il filtro NON scarta, ma ricorda che la frase
    //     somiglia all'eco (vedi passi 7-8): lì una frase "eco" può solo scegliere un
    //     titolo della lista, mai far partire una ricerca YouTube o una chat a caso
    //     (es. la coda "...che vuoi ascoltare" ricatturata dal microfono).
    //     Parte B: durante la LETTURA della lista (Lista._inLettura) il filtro va
    //     saltato anche lui, non solo a lista attiva — altrimenti "tre" o "tutte"
    //     dette mentre ASIA sta ancora leggendo (parole che compaiono per forza nel
    //     testo che sta pronunciando in quel momento, es. "Numero 3: Tre...", "...o
    //     tutte per sentirle tutte") verrebbero scartate come eco PRIMA di arrivare
    //     al blocco 4-bis che le deve gestire.
    const sembraEco = this._sembraEco(norm, ctx);
    if (sembraEco && !ctx.listaAttiva && !ctx.listaInLettura) {
      return this._decisione('RUMORE', { motivo: 'eco della voce di ASIA', testo });
    }

    // --- 4. Interiezioni isolate ("ok", "sì", "boh"), anche ripetute o combinate
    //     ("sì sì va bene", "ok va bene dai"): nessun limite di parole, basta che
    //     siano TUTTE interiezioni (BUG 5). ---
    if (parole.every(p => INTERIEZIONI.has(p))) {
      return this._decisione('RUMORE', { motivo: 'solo interiezioni', testo });
    }

    // --- 4-bis. Lista in lettura (Parte B, "non si può interrompere la lettura per
    //     scegliere"): mentre ASIA legge la lista ad alta voce il microfono resta
    //     aperto (vedi Voce._quandoInizio/_quandoFine e Lista._leggiPagina), e in
    //     questa finestra Lista.attiva() è FALSA (scadenza = 0 durante la lettura).
    //     Qui ascoltiamo SOLO ciò che ha senso mentre ASIA sta ancora parlando: un
    //     numero, "pausa" (zittisce ASIA senza chiudere la lista, azione LISTA_PAUSA),
    //     "tutte" o "ancora". "stop" resta gestito dal punto 2 (STOP vince sempre,
    //     invariato: chiude tutto, lista compresa, come un vero stop). Tutto il resto,
    //     incluso un possibile eco della voce di ASIA, è RUMORE: niente ricerche o
    //     chat a caso finché la lista non ha finito di parlare. ---
    if (ctx.listaInLettura) {
      const sigBis = parole.filter(p => !PAROLE_RIEMPITIVO.has(p)).length;
      if (sigBis <= this.MAX_PAROLE_STOP && matchaComando(norm, settings.comandiPausa)) {
        return this._decisione('COMANDO', { azione: 'LISTA_PAUSA', motivo: 'lista in lettura, "pausa"', testo });
      }
      if (sigBis <= this.MAX_PAROLE_COMANDO + 1 &&
          [norm, ...altBrevi].some(t => this._copreComando(t, settings.comandiTutte))) {
        return this._decisione('COMANDO', { azione: 'LISTA_TUTTI', motivo: 'lista in lettura, "tutte"', testo });
      }
      if (sigBis <= this.MAX_PAROLE_COMANDO &&
          [norm, ...altBrevi].some(t => this._copreComando(t, settings.comandiAncora))) {
        return this._decisione('COMANDO', { azione: 'LISTA_ANCORA', motivo: 'lista in lettura, "ancora"', testo });
      }
      const nBis = estraiNumero(norm);
      if (nBis && nBis >= 1 && nBis <= (ctx.listaLunghezza || 0) &&
          sigBis <= this.MAX_PAROLE_COMANDO &&
          !matchaComando(norm, settings.comandiConversazione)) {
        return this._decisione('COMANDO', { azione: 'LISTA_NUMERO', numero: nBis, motivo: 'lista in lettura, numero ' + nBis, testo });
      }
      return this._decisione('RUMORE', { motivo: 'lista in lettura: si ascolta solo pausa, un numero, "tutte" o "ancora"', testo });
    }

    const significative = parole.filter(p => !PAROLE_RIEMPITIVO.has(p)).length;

    // --- 5. Lista appena letta (contesto a scadenza, 7.12). ---
    if (ctx.listaAttiva) {
      // 5a. "tutte" / "playlist" → suona l'intera lista in coda.
      if (significative <= this.MAX_PAROLE_COMANDO + 1 &&
          [norm, ...altBrevi].some(t => this._copreComando(t, settings.comandiTutte))) {
        return this._decisione('COMANDO', { azione: 'LISTA_TUTTI', motivo: 'lista attiva, "tutte"', testo });
      }
      // 5b. "ripeti la lista" → la rilegge da capo, senza nuova ricerca.
      if (significative <= this.MAX_PAROLE_COMANDO + 2 &&
          [norm, ...altBrevi].some(t => this._copreComando(t, settings.comandiRipetiLista))) {
        return this._decisione('COMANDO', { azione: 'LISTA_RIPETI', motivo: 'lista attiva, ripeti', testo });
      }
      // 5c. "ancora" → pagina successiva.
      if (significative <= this.MAX_PAROLE_COMANDO &&
          [norm, ...altBrevi].some(t => this._copreComando(t, settings.comandiAncora))) {
        return this._decisione('COMANDO', { azione: 'LISTA_ANCORA', motivo: 'lista attiva, "ancora"', testo });
      }
      // 5d. numero → avvia quel brano (accetta "2", "due", "la due", "numero 2").
      const n = estraiNumero(norm);
      if (n && n >= 1 && n <= (ctx.listaLunghezza || 0) &&
          significative <= this.MAX_PAROLE_COMANDO &&
          !matchaComando(norm, settings.comandiConversazione)) {
        return this._decisione('COMANDO', { azione: 'LISTA_NUMERO', numero: n, motivo: 'lista attiva, numero ' + n, testo });
      }
    }

    // --- 6. Comandi di trasporto e info: frase breve e FATTA SOLO del comando (R3). ---
    if (significative <= this.MAX_PAROLE_COMANDO) {
      for (const [azione, chiave] of COMANDI_TRASPORTO) {
        if ([norm, ...altBrevi].some(t => this._copreComando(t, settings[chiave]))) {
          return this._decisione('COMANDO', { azione, motivo: 'frase breve, vocabolario ' + chiave, testo });
        }
      }
    }

    // --- 7. Verbo di ricerca all'inizio: vince sempre la RICERCA (R3). ---
    // --- 8. Default: RICERCA, salvo conversazione riconosciuta (R2). ---
    const d = RE_VERBO_RICERCA.test(norm)
      ? this._decisioneRicerca(testo, norm, true, 'inizia con un verbo di ricerca')
      : this._decisioneRicerca(testo, norm, false, 'default: ricerca');
    if (sembraEco && ctx.listaAttiva) {
      if (d.tipo === 'CHAT') return this._decisione('RUMORE', { motivo: 'eco della lista (niente chat)', testo });
      if (d.tipo === 'RICERCA') { d.soloTitoloLista = true; d.motivo += ' (somiglia all\'eco: vale solo come titolo della lista)'; }
    }
    return d;
  },

  /** Sceglie la trascrizione da usare: la PRIMA (R5; su Android la confidence vale spesso 0).
   *  Restituisce { testo, alternative } con le alternative diverse dalla scelta, o null.
   *  (Nome diverso da scegliMigliore della Ricerca: vedi R13.) */
  scegliTrascrizione(frase) {
    if (!frase) return null;
    const alt = (frase.alternative || []).map(s => String(s == null ? '' : s).trim()).filter(Boolean);
    const testo = String(frase.testo == null ? '' : frase.testo).trim() || alt[0] || '';
    if (!testo) return null;
    const nt = normalizza(testo);
    const altre = [];
    alt.forEach(a => { if (normalizza(a) !== nt && !altre.includes(a)) altre.push(a); });
    return { testo, alternative: altre };
  },

  /** Per il Listener (7.2): il frammento parziale è uno "stop" da eseguire subito?
   *  BUG 1: come _eFraseStop, MAI se inizia con un verbo di ricerca — altrimenti
   *  "metti Stop di Sam Brown" (un titolo) viene tagliato a "metti Stop" e consegnato
   *  subito come comando, perdendo il resto della frase. */
  eStopRapido(testo) {
    const norm = normalizza(testo);
    if (!norm || RE_VERBO_RICERCA.test(norm)) return false;
    return norm.split(' ').length <= this.MAX_PAROLE_STOP_RAPIDO && matchaComando(norm, settings.comandiStop);
  },

  /** Stop fuori dalla musica: frase breve con una parola di stop e SENZA verbo di
   *  ricerca davanti ("metti Stop di..." è una ricerca). Il limite di 2 parole per i
   *  frammenti parziali (7.2) lo applica già il Listener con eStopRapido(). */
  _eFraseStop(norm, altBrevi) {
    if (norm.split(' ').length > this.MAX_PAROLE_STOP) return false;
    if (RE_VERBO_RICERCA.test(norm)) return false;
    return matchaComando(norm, settings.comandiStop, altBrevi);
  },

  /** true se la frase è fatta SOLO del comando più parole di riempimento.
   *  Riusa paroleCombaciano (stessa tolleranza di matchaComando). */
  _copreComando(norm, comandiStringa) {
    const comandi = comandiArray(comandiStringa).map(normalizza).filter(Boolean);
    if (!comandi.length || !norm) return false;
    let trovato = false;
    let resto = ' ' + norm + ' ';
    comandi.filter(c => c.includes(' ')).sort((a, b) => b.length - a.length).forEach(c => {
      while (resto.includes(' ' + c + ' ')) { resto = resto.replace(' ' + c + ' ', ' '); trovato = true; }
    });
    const singoli = comandi.filter(c => !c.includes(' '));
    const restanti = resto.split(' ').filter(Boolean).filter(p => {
      if (singoli.some(c => paroleCombaciano(p, c))) { trovato = true; return false; }
      return !PAROLE_RIEMPITIVO.has(p);
    });
    return trovato && restanti.length === 0;
  },

  /** Filtro anti-eco: frase arrivata entro 3 s dalla fine del parlato e fatta per
   *  almeno il 70% di parole appena dette da ASIA → RUMORE. */
  _sembraEco(norm, contesto) {
    const ctx = contesto || {};
    if (!ctx.ultimoTestoParlato) return false;
    if (!(ctx.msDaFineParlato >= 0 && ctx.msDaFineParlato < this.FINESTRA_ECO_MS)) return false;
    const parole = String(norm || '').split(' ').filter(Boolean);
    if (!parole.length) return false;
    const dette = new Set(normalizza(ctx.ultimoTestoParlato).split(' ').filter(Boolean));
    const dentro = parole.filter(p => dette.has(p)).length;
    return dentro / parole.length >= this.SOGLIA_ECO;
  },

  /** Toglie "Asia" (o "ehi Asia") all'inizio della frase.
   *  NON tocca "ciao Asia", che è una frase di conversazione. */
  _togliPrefissoAsia(testo) {
    const t = String(testo || '');
    const m = t.match(/^\s*(?:(?:ehi|hey|ei|oh)\s+)?asia\b[\s,.:;!?]*/i);
    if (!m) return { testo: t.trim(), conPrefisso: false };
    return { testo: t.slice(m[0].length).trim(), conPrefisso: true };
  },

  /** Costruisce la decisione RICERCA (o CHAT se è una conversazione riconosciuta). */
  _decisioneRicerca(testo, norm, conVerbo, motivo) {
    if (conVerbo && !norm.replace(RE_VERBO_RICERCA, '').trim()) {
      return this._decisione('RUMORE', { motivo: 'solo il verbo, senza cosa cercare', testo });
    }
    // 10/11/2026: soprannomi. "chiamala X" dà un nome alla canzone che suona;
    // un soprannome detto (anche dopo "metti") vince su tutto il resto.
    const daiNome = norm.match(RE_DAI_NOME);
    if (daiNome) {
      return this._decisione('COMANDO', { azione: 'SOPRANNOME', query: daiNome[1], motivo: 'dai un nome alla canzone', testo });
    }
    // 10/11/2026: radio ("metti Radio Italia", "accendi la radio", "metti RTL").
    const radio = rilevaRadio(norm);
    if (radio !== null) {
      return this._decisione('RICERCA', { intent: 'radio', query: radio, motivo: 'radio', testo });
    }
    const sopr = Soprannomi.trova(norm);
    if (sopr && sopr.playlist) {
      return this._decisione('RICERCA', { intent: 'playlistYT', query: sopr.nome, playlist: sopr.playlist,
        motivo: motivo + ' (playlist "' + sopr.nome + '")', testo });
    }
    if (sopr) {
      return this._decisione('RICERCA', { intent: sopr.brano ? 'soprannome' : 'riproduci', query: sopr.cerca || sopr.nome,
        brano: sopr.brano || null, motivo: motivo + ' (soprannome "' + sopr.nome + '")', testo });
    }
    // 10/11/2026 (amichetto): frasi che sono chiaramente una chiacchierata e non un
    // titolo. Solo SENZA verbo di ricerca davanti ("metti Sei bellissima" resta musica).
    if (!conVerbo && RE_CHIACCHIERA.test(norm)) {
      return this._decisione('CHAT', { motivo: 'chiacchierata (amichetto)', testo });
    }
    // 10/11/2026: preferiti ("questa mi piace", "togli dai preferiti", "metti i miei preferiti").
    const pref = rilevaPreferiti(norm);
    if (pref === 'aggiungi') return this._decisione('COMANDO', { azione: 'PREF_AGGIUNGI', motivo: 'preferiti: aggiungi', testo });
    if (pref === 'togli') return this._decisione('COMANDO', { azione: 'PREF_TOGLI', motivo: 'preferiti: togli', testo });
    if (pref === 'metti') {
      return this._decisione('RICERCA', { intent: 'preferiti', query: testo, motivo: motivo + ' (preferiti)', testo,
        leggi: RE_LISTA_ESPLICITA.test(norm) });
    }
    // 10/11/2026: "a piacere", "novità", "canzoni del momento".
    const speciale = rilevaRichiestaSpeciale(norm);
    const vuoleLeggere = RE_LISTA_ESPLICITA.test(norm);
    if (speciale === 'piacere') {
      const artista = this._artistaDopoDi(testo.replace(RE_VERBI_EXTRA, ''));
      if (artista && !RE_A_PIACERE.test(normalizza(artista))) {
        return this._decisione('RICERCA', { intent: 'riproduci', query: artista.replace(/[\s,;.!?]+$/, '').trim(),
          motivo: motivo + ' (a caso di un artista → coda dell\'artista)', testo });
      }
      return this._decisione('RICERCA', { intent: 'piacere', query: testo, motivo: motivo + ' (a piacere)', testo });
    }
    if (speciale === 'novita') {
      return this._decisione('RICERCA', { intent: 'novita', query: testo, motivo: motivo + ' (novità)', testo, leggi: vuoleLeggere });
    }
    let intent = rilevaIntent(testo);
    if (speciale === 'momento' && intent === 'riproduci') {
      return this._decisione('RICERCA', { intent: 'momento', query: testo, motivo: motivo + ' (canzoni del momento)', testo, leggi: vuoleLeggere });
    }
    if (intent === 'conversazione') {
      if (!conVerbo) return this._decisione('CHAT', { motivo: 'frase di conversazione', testo });
      intent = 'riproduci';
    }
    let query;
    const pulito = testo.replace(RE_VERBI_EXTRA, '');
    const artistaDeiSuccessi = intent === 'top' ? this._artistaDopoDi(pulito) : null;
    // Se l'utente ha detto ESPLICITAMENTE "playlist", "elenca", "leggimi", ecc.,
    // rispettiamo la richiesta di lista numerata ANCHE se c'è un artista dopo
    // "di" ("playlist di Nino D'Angelo" → lista numerata di Nino D'Angelo).
    const vuoleListaEsplicita = RE_LISTA_ESPLICITA.test(norm) || /\bplaylist\b/.test(norm);
    if (intent === 'lista' || intent === 'top') {
      // Con Gemini attivo, NON estraiamo una query YouTube: passiamo il testo
      // originale a Gemini, che produrrà una lista strutturata di brani.
      // Senza Gemini, manteniamo il comportamento attuale (query YouTube diretta).
      if (settings.usaGeminiPerPlaylist && settings.geminiApiKey) {
        query = pulito.trim();   // testo originale, per Gemini
        motivo += ' (lista via Gemini)';
      } else if (intent === 'lista' && vuoleListaEsplicita) {
        query = estraiQueryRicerca(pulito, 'lista');
        motivo += ' (lista esplicita)';
      } else if (intent === 'lista' && !vuoleListaEsplicita) {
        // "metti le canzoni di Vasco" → coda di Vasco, non lettura della lista (7.12).
        query = estraiQueryRicerca(pulito, 'lista');
        intent = 'riproduci';
        motivo += ' (canzoni di un artista → coda)';
      } else if (artistaDeiSuccessi) {
        // "i successi/le più ascoltate/i brani più belli DI <artista>" (BUG 2): l'artista
        // c'è, quindi mettiamo in coda i suoi brani invece di una classifica generica
        // "top hits <anno>" che lo perderebbe del tutto.
        query = artistaDeiSuccessi.replace(/[\s,;.!?]+$/, '').trim();
        intent = 'riproduci';
        motivo += ' (successi di un artista → coda dell\'artista)';
      } else {
        query = estraiQueryRicerca(pulito, intent);
      }
    } else if (artistaDeiSuccessi) {
      query = artistaDeiSuccessi.replace(/[\s,;.!?]+$/, '').trim();
      intent = 'riproduci';
      motivo += ' (successi di un artista → coda dell\'artista)';
    } else {
      query = estraiQueryRicerca(pulito, intent);
    }
    if (!query && intent !== 'top') {
      return this._decisione('RUMORE', { motivo: 'ricerca senza contenuto', testo });
    }
    return this._decisione('RICERCA', { intent, query, motivo, testo });
  },

  /** BUG 2 (completato in revisione finale, poi esteso per "playlist ..."): l'artista
   *  dopo "di" O dopo una preposizione articolata ("i successi DEI Pooh", "le più
   *  ascoltate DELLA Pausini", "DEGLI 883"), saltando sia le espressioni di tempo
   *  ("di oggi", "di sempre", "del momento", "di questa settimana") sia i sostantivi
   *  generici della musica ("DELLE canzoni più suonate", "DEI brani del momento"), che
   *  NON sono un artista e devono restare una classifica generica. Con più di una
   *  preposizione nella frase ("playlist DELLE canzoni più suonate DI quest'anno") si
   *  prende l'ULTIMA preposizione valida, perché l'artista (quando c'è) è di solito il
   *  qualificatore finale. */
  _artistaDopoDi(testo) {
    const RE_PREP = /\b(?:di|del|dello|della|dei|degli|delle)\s+/gi;
    const RE_TEMPO = /^(?:oggi|adesso|ora|sempre|ieri|momento|settimana|mese|anno|estate|inverno|stagione|quest\w*|ultim\w*|tutti i tempi|(?:19|20)\d\d)\b/;
    const RE_GENERICO = /^(?:canzon\w*|bran\w*|music\w*|pezz\w*|success\w*|hit\w*|classific\w*|playlist\w*)\b/;
    let candidato = null;
    let m;
    while ((m = RE_PREP.exec(testo))) {
      const resto = testo.slice(m.index + m[0].length).trim();
      const n = normalizza(resto);
      if (resto && !RE_TEMPO.test(n) && !RE_GENERICO.test(n)) candidato = resto;
    }
    return candidato;
  },

  _decisione(tipo, extra) {
    return Object.assign({ tipo, azione: null, intent: null, query: '', numero: null, motivo: '', testo: '' }, extra || {});
  }
};

// ------------------------------------------------------------
// 10. MEMORIA (ultimo artista, brani di sessione, brani saltati persistiti)
// ------------------------------------------------------------
const Memoria = {
  CHIAVE: 'asia_memoria',
  SOGLIA_SALTO_SEC: 10,                       // 7.14
  SCADENZA_SALTO_MS: 30 * 24 * 3600 * 1000,   // 7.14: 30 giorni
  MAX_SALTATI: 50,                            // 7.14

  ultimoArtista: '',
  ultimaQuery: '',
  ultimoBrano: null,           // ultimo brano davvero partito (per "di nuovo" dopo uno stop)
  braniSessione: new Set(),    // id dei brani suonati in questa sessione
  titoliSessione: new Set(),   // stessi brani, per titolo (altri caricamenti dello stesso brano, R10)
  braniSaltati: [],            // [{ id, ts }] persistiti in localStorage

  /** Ricorda cosa ha chiesto Domenico e di quale artista si tratta. */
  registraRicerca(query, artista) {
    this.ultimaQuery = query || '';
    if (artista) this.ultimoArtista = artista;
    if (artista && query !== 'playlist') Gusti.registraRichiesta(artista);
  },

  /** Chiamato dal Player a OGNI avvio effettivo di un brano. */
  registraAvvio(brano) {
    try { Cronologia.brano(brano); } catch (e) {}
    try { Storico.registra(brano); } catch (e) {}
    if (!brano) return;
    this.ultimoBrano = brano;
    this.braniSessione.add(brano.id);
    this.titoliSessione.add(Ricerca.chiaveTitolo(brano));
  },

  /** Brano ascoltato fino alla fine (per ora solo log: base per l'apprendimento futuro). */
  registraFine(brano, secondiAscoltati) {
    if (brano) log('✔️ Ascoltato: ' + pulisciTitolo(brano.titolo) + ' (' + Math.round(secondiAscoltati || 0) + ' s)');
    contaAscolto(brano);
  },

  /** Salva il brano tra i "non graditi" SOLO se saltato entro 10 secondi. */
  registraSalto(brano, secondiAscoltati) {
    if (!brano || !(secondiAscoltati < this.SOGLIA_SALTO_SEC)) return false;
    this._pulisciScaduti();
    this.braniSaltati = this.braniSaltati.filter(s => s.id !== brano.id);
    this.braniSaltati.push({ id: brano.id, ts: Date.now() });
    if (this.braniSaltati.length > this.MAX_SALTATI) {
      this.braniSaltati = this.braniSaltati.slice(-this.MAX_SALTATI);
    }
    this.salva();
    Gusti.registraSalto(brano);
    log('👎 Non gradito (saltato dopo ' + Math.round(secondiAscoltati) + ' s): ' + pulisciTitolo(brano.titolo));
    return true;
  },

  /** true se il brano è stato saltato presto negli ultimi 30 giorni. */
  eSaltato(id) {
    const ora = Date.now();
    return this.braniSaltati.some(s => s.id === id && ora - s.ts < this.SCADENZA_SALTO_MS);
  },

  /** Insieme degli id saltati ancora validi (per escluderli dalle code). */
  idSaltatiValidi() {
    this._pulisciScaduti();
    return new Set(this.braniSaltati.map(s => s.id));
  },

  /** Pulsante "Dimentica brani saltati" nelle Impostazioni. */
  dimenticaSaltati() {
    this.braniSaltati = [];
    this.salva();
    log('🗑️ Brani saltati dimenticati');
  },

  /** Legge i brani saltati dal browser (accetta anche il vecchio formato: solo id). */
  carica() {
    try {
      const dati = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null');
      const arr = (dati && Array.isArray(dati.braniSaltati)) ? dati.braniSaltati : [];
      this.braniSaltati = arr.map(s => (typeof s === 'string') ? { id: s, ts: Date.now() } : s)
                             .filter(s => s && s.id && typeof s.ts === 'number');
      this._pulisciScaduti();
    } catch (e) {
      this.braniSaltati = [];
    }
  },

  /** Salva i brani saltati nel browser. */
  salva() {
    try { localStorage.setItem(this.CHIAVE, JSON.stringify({ braniSaltati: this.braniSaltati })); }
    catch (e) { /* spazio pieno o storage bloccato: non è grave */ }
  },

  _pulisciScaduti() {
    const ora = Date.now();
    this.braniSaltati = this.braniSaltati.filter(s => ora - s.ts < this.SCADENZA_SALTO_MS);
  }
};

// ------------------------------------------------------------
// 10b. GUSTI (10/11/2026): ASIA impara cosa piace a Domenico
// ------------------------------------------------------------
// Ricorda, nel browser, i cantanti che chiede, le canzoni che ascolta fino in
// fondo (e quante volte) e i cantanti che salta subito. Serve per "una canzone
// a piacere", le novità e le classifiche ordinate secondo i suoi gusti.
const Gusti = {
  CHIAVE: 'asia_gusti',
  MAX_BRANI: 200,
  MAX_ARTISTI: 300,
  artisti: {},   // chiave → { nome, richieste, ascolti, salti, ultimo }
  brani: {},     // chiave → { titolo, artista, volte, ultimo }
  _caricato: false,

  pulisciArtista(s) {
    return String(s || '').replace(/\s*-\s*topic\s*$/i, '').replace(/vevo\s*$/i, '')
      .replace(/\b(official|ufficiale|channel|canale)\b/gi, '').replace(/\s+/g, ' ').trim();
  },
  _artista(nome) {
    const n = this.pulisciArtista(nome);
    const k = normalizza(n);
    if (!k || k === 'playlist') return null;
    if (!this.artisti[k]) this.artisti[k] = { nome: n, richieste: 0, ascolti: 0, salti: 0, ultimo: 0 };
    return this.artisti[k];
  },
  /** Domenico ha chiesto questo cantante. */
  registraRichiesta(artista) {
    this.carica();
    const a = this._artista(artista);
    if (!a) return;
    a.richieste++; a.ultimo = Date.now();
    this.salva();
  },
  /** Canzone ascoltata fino alla fine. */
  registraAscolto(brano) {
    if (!brano) return;
    this.carica();
    const a = this._artista(brano.autore);
    if (a) { a.ascolti++; a.ultimo = Date.now(); }
    const titolo = pulisciTitolo(brano.titolo || '');
    const k = normalizza(titolo);
    if (k) {
      const b = this.brani[k] || (this.brani[k] = { titolo, artista: a ? a.nome : '', volte: 0, ultimo: 0 });
      b.volte++; b.ultimo = Date.now();
    }
    this._taglia();
    this.salva();
  },
  /** Canzone saltata nei primi secondi. */
  registraSalto(brano) {
    if (!brano) return;
    this.carica();
    const a = this._artista(brano.autore);
    if (a) { a.salti++; this.salva(); }
  },
  punteggio(a) { return a.richieste * 2 + a.ascolti * 3 - a.salti * 2; },
  artistiPreferiti(n) {
    this.carica();
    return Object.values(this.artisti).filter(a => this.punteggio(a) > 0)
      .sort((x, y) => this.punteggio(y) - this.punteggio(x) || y.ultimo - x.ultimo).slice(0, n || 12);
  },
  braniPreferiti(n) {
    this.carica();
    return Object.values(this.brani).sort((x, y) => y.volte - x.volte || y.ultimo - x.ultimo).slice(0, n || 10);
  },
  artistiNonGraditi(n) {
    this.carica();
    return Object.values(this.artisti).filter(a => a.salti >= 2 && this.punteggio(a) <= 0).slice(0, n || 6);
  },
  /** Testo dei gusti da dare a Gemini ('' se non sa ancora niente). */
  descrizione() {
    const a = this.artistiPreferiti(12).map(x => x.nome);
    const b = this.braniPreferiti(10).map(x => x.titolo + (x.artista ? ' di ' + x.artista : ''));
    const no = this.artistiNonGraditi(6).map(x => x.nome);
    if (!a.length && !b.length) return '';
    let t = '';
    if (a.length) t += 'Cantanti preferiti (dal più amato): ' + a.join(', ') + '. ';
    if (b.length) t += 'Canzoni che ascolta più spesso: ' + b.join('; ') + '. ';
    if (no.length) t += 'Cantanti che di solito salta: ' + no.join(', ') + '. ';
    return t.trim();
  },
  _taglia() {
    const arr = Object.entries(this.brani);
    if (arr.length > this.MAX_BRANI) {
      arr.sort((x, y) => (y[1].volte * 1e13 + y[1].ultimo) - (x[1].volte * 1e13 + x[1].ultimo));
      this.brani = Object.fromEntries(arr.slice(0, this.MAX_BRANI));
    }
    const art = Object.entries(this.artisti);
    if (art.length > this.MAX_ARTISTI) {
      art.sort((x, y) => (this.punteggio(y[1]) * 1e13 + y[1].ultimo) - (this.punteggio(x[1]) * 1e13 + x[1].ultimo));
      this.artisti = Object.fromEntries(art.slice(0, this.MAX_ARTISTI));
    }
  },
  carica() {
    if (this._caricato) return;
    this._caricato = true;
    try {
      const d = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null');
      this.artisti = (d && d.artisti) || {};
      this.brani = (d && d.brani) || {};
    } catch (e) { this.artisti = {}; this.brani = {}; }
  },
  salva() {
    try { localStorage.setItem(this.CHIAVE, JSON.stringify({ artisti: this.artisti, brani: this.brani })); }
    catch (e) { /* spazio pieno: non è grave */ }
  },
  dimentica() {
    this.artisti = {}; this.brani = {}; this._caricato = true;
    this.salva();
    log('🗑️ Gusti dimenticati');
  }
};

// ------------------------------------------------------------
// 10c. PREFERITI (10/11/2026)
// ------------------------------------------------------------
// Una canzone ascoltata fino alla fine almeno 2 volte entra da sola nei preferiti;
// "questa mi piace" la aggiunge subito, "togli dai preferiti" la toglie (e non
// rientra più da sola). Si salva il video YouTube esatto: ripartono senza ricerche.
const Preferiti = {
  CHIAVE: 'asia_preferiti',
  SOGLIA_ASCOLTI: 2,
  MAX: 300,
  brani: {},       // id → { id, titolo, autore, anno, durataSec, canaleUfficiale, ascolti, manuale, tolto, aggiunto, ultimo }
  _caricato: false,

  _copia(b) {
    return { id: b.id, titolo: b.titolo || '', autore: b.autore || '', anno: b.anno || null,
             durataSec: b.durataSec || 0, canaleUfficiale: !!b.canaleUfficiale };
  },
  _voce(b) {
    this.carica();
    return this.brani[b.id] || (this.brani[b.id] = Object.assign(this._copia(b),
      { ascolti: 0, manuale: false, tolto: false, aggiunto: 0, ultimo: 0 }));
  },
  registraAscolto(b) {
    if (!b || !b.id) return;
    const v = this._voce(b);
    v.ascolti++; v.ultimo = Date.now();
    if (!v.aggiunto && !v.tolto && v.ascolti >= this.SOGLIA_ASCOLTI) {
      v.aggiunto = Date.now();
      log('⭐ Nei preferiti (ascoltata ' + v.ascolti + ' volte): ' + pulisciTitolo(v.titolo));
    }
    this._taglia(); this.salva();
  },
  aggiungi(b) {
    if (!b || !b.id) return false;
    const v = this._voce(b);
    v.manuale = true; v.tolto = false; v.aggiunto = v.aggiunto || Date.now(); v.ultimo = Date.now();
    this.salva();
    log('⭐ Aggiunta ai preferiti: ' + pulisciTitolo(v.titolo));
    return true;
  },
  togli(b) {
    if (!b || !b.id) return false;
    const v = this._voce(b);
    const cera = !!v.aggiunto && !v.tolto;
    v.tolto = true; v.aggiunto = 0; v.manuale = false;
    this.salva();
    log('🚫 Tolta dai preferiti: ' + pulisciTitolo(v.titolo));
    return cera;
  },
  elenco() {
    this.carica();
    return Object.values(this.brani).filter(v => v.aggiunto && !v.tolto)
      .sort((a, b) => b.ascolti - a.ascolti || b.aggiunto - a.aggiunto);
  },
  descrizione() {
    const el = this.elenco();
    if (!el.length) return 'Nessuna canzone nei preferiti.';
    return 'Preferiti (' + el.length + '): ' + el.map(v => pulisciTitolo(v.titolo) +
      (v.autore ? ' – ' + Gusti.pulisciArtista(v.autore) : '') + ' (' + v.ascolti + 'x)').join('; ');
  },
  _taglia() {
    const arr = Object.entries(this.brani);
    if (arr.length <= this.MAX) return;
    // tiene i preferiti e i "tolti" (per non farli rientrare), poi i più ascoltati
    arr.sort((x, y) => ((y[1].aggiunto || y[1].tolto) ? 1e15 : 0) + y[1].ascolti * 1e13 + y[1].ultimo
                     - (((x[1].aggiunto || x[1].tolto) ? 1e15 : 0) + x[1].ascolti * 1e13 + x[1].ultimo));
    this.brani = Object.fromEntries(arr.slice(0, this.MAX));
  },
  carica() {
    if (this._caricato) return;
    this._caricato = true;
    try { const d = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null'); this.brani = (d && d.brani) || {}; }
    catch (e) { this.brani = {}; }
  },
  salva() {
    try { localStorage.setItem(this.CHIAVE, JSON.stringify({ brani: this.brani })); } catch (e) {}
  },
  svuota() { this.brani = {}; this._caricato = true; this.salva(); log('🗑️ Preferiti svuotati'); }
};

/** 10/11/2026: inizi di frase da chiacchierata (non titoli). Volutamente stretti:
 *  "sei una/un ...", non "sei bellissima"; "sono triste", non "sono solo parole". */
const RE_CHIACCHIERA = /^(?:ti piace|ti piacciono|ti e piaciut\w*|sei una|sei un|sei bravo|sei brava|sei simpatic\w*|sei vera|sei vero|chi ti ha|lo sai|sai che|sai chi|mi sento|sono (?:triste|stanco|stanca|felice|contento|contenta|arrabbiato|arrabbiata|nervoso|nervosa|annoiato|annoiata|stufo|stufa)|oggi (?:sono|ho|e stata|e stato)|ho (?:fame|sonno|paura|freddo|caldo|mal di)|grazie(?: asia| mille| tante| tantissimo)*(?: sei (?:bravo|brava|gentile|simpatic\w*|forte|fantastic\w*))?$|ti voglio bene|mi vuoi bene|come ti senti|cosa fai|che fai|che stai facendo|giochiamo|parlami|cantiamo|indovina|hai (?:visto|sentito|mangiato|dormito)|tu (?:sai|canti|balli|mangi|dormi|hai))\b/;

// ------------------------------------------------------------
// 10d. SOPRANNOMI (10/11/2026): nomi facili per canzoni difficili da pronunciare
// ------------------------------------------------------------
// Due fonti: le righe "nome facile = titolo e cantante" scritte dal nonno nelle
// Impostazioni, e i nomi dati a voce ("chiamala ...") che salvano il video esatto.
const Soprannomi = {
  CHIAVE: 'asia_soprannomi',
  voce: null,       // norm → { nome, brano }
  _carica() {
    if (this.voce) return this.voce;
    try { this.voce = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null') || {}; } catch (e) { this.voce = {}; }
    return this.voce;
  },
  _salva() { try { localStorage.setItem(this.CHIAVE, JSON.stringify(this.voce || {})); } catch (e) {} },
  /** Elenco completo: [{ nome, norm, cerca?, brano? }] */
  elenco() {
    const out = [];
    String(settings.soprannomi || '').split('\n').forEach(riga => {
      const i = riga.indexOf('=');
      if (i < 1) return;
      const nome = riga.slice(0, i).trim(), cerca = riga.slice(i + 1).trim();
      if (!nome || !cerca) return;
      // A destra si può mettere anche il LINK di YouTube: parte quel video, senza ricerca.
      const lista = idPlaylistDaLink(cerca);
      if (lista) { out.push({ nome, norm: normalizza(nome), playlist: lista }); return; }
      const id = idDaLinkYouTube(cerca);
      if (id) out.push({ nome, norm: normalizza(nome), brano: { id, titolo: nome, autore: '', anno: null, durataSec: 0 } });
      else out.push({ nome, norm: normalizza(nome), cerca });
    });
    Object.entries(this._carica()).forEach(([norm, v]) => out.push({ nome: v.nome, norm, brano: v.brano }));
    return out;
  },
  /** Cerca un soprannome nella frase (uguale, o quasi uguale se Chrome sbaglia una lettera). */
  trova(normFrase) {
    const f = String(normFrase || '').replace(/^(?:metti|mettimi|rimetti|cerca|cercami|voglio|vorrei|fammi sentire|fammi ascoltare|suona|suonami|ascolta|riproduci)\s+/, '')
      .replace(/^(?:la canzone|quella|la)\s+(?=\S)/, '').trim();
    if (!f) return null;
    let migliore = null, punti = 0;
    for (const s of this.elenco()) {
      const n = s.norm.replace(/^(?:la canzone|quella|la)\s+(?=\S)/, '');
      if (!n) continue;
      const sim = (f === n) ? 1 : somiglianza(f, n);
      if (sim > punti) { punti = sim; migliore = s; }
    }
    return (migliore && punti >= 0.82) ? migliore : null;
  },
  /** "chiamala <nome>": dà un nome facile alla canzone che sta suonando. */
  impara(nome, brano) {
    const n = normalizza(nome);
    if (!n || !brano || !brano.id) return false;
    this._carica()[n] = { nome: nome.trim(), brano: Preferiti._copia(brano) };
    this._salva();
    log('🏷️ Soprannome: "' + nome.trim() + '" = ' + pulisciTitolo(brano.titolo));
    return true;
  }
};

/** Codice del video da un link YouTube (youtube.com/watch?v=, youtu.be/, shorts/, music.youtube.com). */
function idDaLinkYouTube(testo) {
  const m = String(testo || '').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

/** Codice di una PLAYLIST da un link (…&list=PL…). I "mix" automatici di YouTube
 *  (list=RD…) non si possono leggere: per quelli vale il singolo video. */
function idPlaylistDaLink(testo) {
  const m = String(testo || '').match(/[?&]list=([A-Za-z0-9_-]{10,})/);
  if (!m || /^RD/.test(m[1])) return null;
  return m[1];
}

/** Legge le canzoni di una playlist YouTube (1 unità di quota ogni 50 canzoni,
 *  massimo 200). Ricordata come le ricerche, così la seconda volta è gratis.
 *  @returns {Promise<{brani:object[], errore:?string}>} */
async function leggiPlaylistYouTube(idLista) {
  if (!settings.youtubeApiKey) return { brani: [], errore: 'chiave_mancante' };
  const dallaCache = leggiCacheRicerca('playlist ' + idLista, 'playlist');
  if (dallaCache) { log('📦 Playlist presa dalla memoria (' + dallaCache.length + ' canzoni)'); return { brani: dallaCache, errore: null }; }
  const brani = [];
  let pagina = '';
  try {
    for (let giro = 0; giro < 4; giro++) {
      const url = 'https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50'
        + '&playlistId=' + encodeURIComponent(idLista) + (pagina ? '&pageToken=' + pagina : '')
        + '&key=' + encodeURIComponent(settings.youtubeApiKey);
      const resp = await fetch(url);
      Consumi.youtube(1);
      if (!resp.ok) throw new Error('playlist HTTP ' + resp.status);
      const dati = await resp.json();
      (dati.items || []).forEach(it => {
        const sn = it.snippet || {}, id = it.contentDetails && it.contentDetails.videoId;
        if (!id || /^(deleted|private) video$/i.test(sn.title || '')) return;
        const titolo = rimuoviEmoji(sn.title || '');
        const canale = rimuoviEmoji(sn.videoOwnerChannelTitle || '').replace(/\s*-\s*topic$/i, '');
        brani.push({ id, titolo, autore: estraiArtista(titolo, canale), anno: null, durataSec: 0 });
      });
      pagina = dati.nextPageToken;
      if (!pagina) break;
    }
  } catch (e) {
    log('❌ Errore playlist YouTube: ' + e.message);
    if (!brani.length) return { brani: [], errore: 'rete' };
  }
  if (brani.length) scriviCacheRicerca('playlist ' + idLista, 'playlist', brani);
  log('📃 Playlist: ' + brani.length + ' canzoni');
  return { brani, errore: null };
}

/** 10/11/2026: STORICO delle canzoni suonate (video esatto). Se Domenico richiede una
 *  canzone già sentita, ASIA la riconosce anche se Chrome ha capito qualche lettera
 *  diversa ("college" / "collage") e la rimette senza cercare su YouTube. */
const Storico = {
  CHIAVE: 'asia_suonati',
  MAX: 400,
  brani: null,
  VUOTE: new Set(['di', 'del', 'della', 'dei', 'degli', 'delle', 'la', 'il', 'lo', 'le', 'gli', 'un', 'una', 'the', 'and',
                  'metti', 'mettimi', 'canzone', 'canzoni', 'cerca', 'cercami', 'voglio', 'sentire', 'ascoltare', 'fammi', 'per', 'con']),
  _carica() {
    if (this.brani) return this.brani;
    try { this.brani = JSON.parse(localStorage.getItem(this.CHIAVE) || 'null') || {}; } catch (e) { this.brani = {}; }
    return this.brani;
  },
  _salva() {
    const arr = Object.values(this.brani || {});
    if (arr.length > this.MAX) {
      arr.sort((a, b) => b.ts - a.ts);
      this.brani = Object.fromEntries(arr.slice(0, this.MAX).map(b => [b.id, b]));
    }
    try { localStorage.setItem(this.CHIAVE, JSON.stringify(this.brani)); } catch (e) {}
  },
  registra(b) {
    if (!b || !b.id || b.radio) return;
    const st = this._carica();
    const v = st[b.id] || (st[b.id] = Object.assign(Preferiti._copia(b), { volte: 0 }));
    v.volte++; v.ts = Date.now();
    this._salva();
    // 11/11/2026: richiesta 3 volte → nei preferiti (anche se l'ha sempre cambiata presto)
    if (v.volte >= 3) {
      const p = Preferiti._voce(b);
      if (!p.aggiunto && !p.tolto) { p.aggiunto = Date.now(); Preferiti.salva(); log('⭐ Nei preferiti (chiesta ' + v.volte + ' volte): ' + pulisciTitolo(b.titolo)); }
    }
  },
  _parole(t) { return normalizza(t).split(' ').filter(w => w.length > 1 && !this.VUOTE.has(w)); },
  _uguale(a, b) { return a === b || (a.length > 3 && b.length > 3 && somiglianza(a, b) >= 0.75); },
  /** Una canzone già suonata che corrisponde alla richiesta, oppure null.
   *  Servono: tutte le parole chieste presenti (anche "quasi uguali") e buona parte del TITOLO. */
  trova(query) {
    const q = this._parole(query);
    if (!q.length) return null;
    let migliore = null, punti = 0;
    for (const b of Object.values(this._carica())) {
      const titolo = this._parole(pulisciTitolo(Annunci.titoloBreve ? Annunci.titoloBreve(b) : b.titolo));
      if (!titolo.length) continue;
      const tutte = this._parole(pulisciTitolo(b.titolo) + ' ' + (b.autore || ''));
      if (!q.every(w => tutte.some(t => this._uguale(w, t)))) continue;
      const copertura = titolo.filter(t => q.some(w => this._uguale(w, t))).length / titolo.length;
      if (copertura < 0.6) continue;
      const p = copertura * 10 + Math.min(b.volte || 0, 9) / 10;
      if (p > punti) { punti = p; migliore = b; }
    }
    return migliore;
  }
};

/** 10/11/2026: video che YouTube ha rifiutato di suonare: non si riprovano più. */
const VideoBloccati = {
  CHIAVE: 'asia_video_bloccati',
  _s: null,
  _set() {
    if (!this._s) { try { this._s = new Set(JSON.parse(localStorage.getItem(this.CHIAVE) || '[]')); } catch (e) { this._s = new Set(); } }
    return this._s;
  },
  ha(id) { return this._set().has(id); },

    try { localStorage.setItem(this.CHIAVE, JSON.stringify([...s].slice(-500))); } catch (e) {}
  }
};

/** Somiglianza 0..1 tra due testi (distanza di Levenshtein). */
function somiglianza(a, b) {
  if (a === b) return 1;
  const m = a.length, n = b.length;
  if (!m || !n) return 0;
  let prec = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prec[j] + 1, cur[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prec = cur;
  }
  return 1 - prec[n] / Math.max(m, n);
}

/** "chiamala X", "questa si chiama X", "il suo nome è X" → X (oppure null). */
const RE_DAI_NOME = /^(?:chiamala|chiamalo|chiamiamola|questa (?:la chiamiamo|si chiama)|il suo nome e|dalle il nome(?: di)?)\s+(.+)$/;

// ------------------------------------------------------------
// 10e. RADIO (10/11/2026): radio in diretta, gratis e senza limiti
// ------------------------------------------------------------
// Le radio si trovano da sole su Radio Browser (elenco pubblico e gratuito di tutte le
// radio del mondo, sempre aggiornato). Nelle Impostazioni si possono scrivere a mano
// quelle che non trova o che vanno male ("nome = indirizzo").
const Radio = {
  SERVER: ['https://de1.api.radio-browser.info', 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info'],
  CHIAVE: 'asia_radio_trovate',

  /** "rtl 102 5" → "rtl 102.5" (il riconoscimento vocale perde il punto). */
  _nomeRicerca(n) { return String(n || '').replace(/\b(\d{2,3}) (\d)\b/g, '$1.$2').trim(); },

  _aMano() {
    const out = [];
    String(settings.radioElenco || '').split('\n').forEach(r => {
      const i = r.indexOf('=');
      if (i < 1) return;
      const nome = r.slice(0, i).trim(), url = r.slice(i + 1).trim();
      if (nome && /^https?:\/\//.test(url)) out.push({ nome, url });
    });
    return out;
  },

  /** Trova una radio per nome. @returns {Promise<?{nome, url}>} */
  async trova(nome) {
    nome = String(nome || '').trim() || settings.radioPreferita || 'Radio Italia';
    const n = normalizza(nome);
    // 1. scritte a mano dal nonno
    let migliore = null, punti = 0;
    for (const r of this._aMano()) {
      const sim = somiglianza(n, normalizza(r.nome));
      if (sim > punti) { punti = sim; migliore = r; }
    }
    if (migliore && punti >= 0.75) return migliore;
    // 2. già trovate in passato
    let memo = {};
    try { memo = JSON.parse(localStorage.getItem(this.CHIAVE) || '{}'); } catch (e) {}
    if (memo[n] && Date.now() - memo[n].ts < 7 * 24 * 3600 * 1000) return memo[n];
    // 3. Radio Browser (prima in Italia, poi ovunque)
    const sicura = typeof location !== 'undefined' && location.protocol === 'https:';
    const cerca = this._nomeRicerca(nome);
    for (const filtroPaese of ['&countrycode=IT', '']) {
      for (const srv of this.SERVER) {
        try {
          const url = srv + '/json/stations/search?name=' + encodeURIComponent(cerca) + filtroPaese +
                      '&order=votes&reverse=true&hidebroken=true&limit=10';
          const resp = await fetch(url);
          if (!resp.ok) continue;
          const lista = (await resp.json()).filter(s => s.url_resolved && !s.hls &&
            (!sicura || /^https:/.test(s.url_resolved)));
          if (!lista.length) break;   // il server ha risposto: niente con questo filtro
          // tra le radio che contengono TUTTE le parole chieste vince la più ascoltata
          // ("radio italia" → Radio Italia solomusicaitaliana, non "Radio Italia Anni 60")
          const parole = n.split(' ').filter(Boolean);
          const buone = lista.filter(x => { const nn = ' ' + normalizza(x.name) + ' '; return parole.every(w => nn.includes(' ' + w + ' ') || nn.includes(w)); });
          if (!buone.length) break;
          buone.sort((a, b) => (b.votes || 0) - (a.votes || 0));
          const s = buone[0];
          const trovata = { nome: s.name.trim(), url: s.url_resolved, ts: Date.now() };
          memo[n] = trovata;
          try { localStorage.setItem(this.CHIAVE, JSON.stringify(memo)); } catch (e) {}
          log('📻 Radio trovata: ' + trovata.nome + ' (' + (s.codec || '?') + ' ' + (s.bitrate || '?') + ' kbps)');
          return trovata;
        } catch (e) { /* prova il server successivo */ }
      }
    }
    return null;
  },

  /** La radio come "brano" per Coda e Player. */
  comeBrano(r) {
    return { id: 'radio:' + normalizza(r.nome).replace(/ /g, '_'), radio: true, url: r.url,
             titolo: r.nome, autore: '', anno: null, durataSec: 0 };
  }
};

/** "metti Radio Italia", "accendi la radio", "la radio", "metti RTL", "RDS"… → nome (anche '') o null. */
const RE_RADIO = /^(?:metti(?:mi)?|accendi|ascolta|ascoltiamo|fammi sentire|voglio sentire|vorrei sentire|voglio|vorrei|sentiamo)?\s*(?:la |una )?(radio)\b\s*(.*)$/;
const RE_RADIO_NOMI = /^(?:metti(?:mi)?|accendi|ascolta|sentiamo)?\s*(rtl(?: 102 5)?|rds|deejay|m2o|r101|rmc|virgin radio|kiss kiss|monte carlo|rai radio (?:uno|due|tre|1|2|3))$/;
function rilevaRadio(norm) {
  let m = norm.match(RE_RADIO);
  if (m) return ('radio ' + m[2]).trim() === 'radio' ? '' : (/^(?:italia|deejay|105|24|kiss kiss|monte carlo|capital|subasio|bruno|sportiva|maria|zeta|freccia|norba|radio)\b/.test(m[2]) || m[2].split(' ').length <= 3 ? 'radio ' + m[2] : null);
  m = norm.match(RE_RADIO_NOMI);
  return m ? m[1] : null;
}
